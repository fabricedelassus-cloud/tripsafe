<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta name="description" content="TripSafe — comprendre vite la biologie des substances, suivre une situation, vérifier les interactions et accompagner quelqu’un. Données locales uniquement.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>TripSafe — v16 Cockpit local de vigilance et réduction des risques</title>
  <style>:root {
  --bg: #090d1a;
  --bg2: #0f172a;
  --surface: rgba(20, 30, 54, .76);
  --surface-solid: #111827;
  --surface-2: rgba(255, 255, 255, .07);
  --text: #f8fafc;
  --muted: #a7b4c8;
  --line: rgba(255, 255, 255, .13);
  --shadow: 0 24px 80px rgba(0,0,0,.38);
  --info: #6366f1;
  --safe: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --critical: #7f1d1d;
  --classic: #0891b2;
  --ketamine: #7c3aed;
  --serotonin: #d946ef;
  --radius: 26px;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  --sans: ui-rounded, "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #eef2ff;
  --surface: rgba(255, 255, 255, .86);
  --surface-solid: #ffffff;
  --surface-2: rgba(15, 23, 42, .05);
  --text: #0f172a;
  --muted: #53627a;
  --line: rgba(15, 23, 42, .13);
  --shadow: 0 24px 60px rgba(15,23,42,.14);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); color: var(--text); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(circle at 10% -10%, rgba(217,70,239,.30), transparent 28rem),
    radial-gradient(circle at 100% 5%, rgba(8,145,178,.24), transparent 22rem),
    radial-gradient(circle at 50% 105%, rgba(16,185,129,.18), transparent 26rem),
    linear-gradient(180deg, var(--bg2), var(--bg));
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--info) 70%, white); outline-offset: 2px; }

.noscript { max-width: 560px; padding: 24px; margin: 0 auto; }
.app-shell { width: min(100%, 560px); min-height: 100svh; margin: 0 auto; padding: env(safe-area-inset-top) 14px calc(98px + env(safe-area-inset-bottom)); }
.screen { padding-bottom: 16px; }
.enter { animation: enter .28s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0 10px;
  backdrop-filter: blur(24px);
}
.brand { border: 0; background: transparent; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0; text-align: left; cursor: pointer; }
.brand b { display: block; letter-spacing: -.03em; font-size: 16px; }
.brand small { display: block; color: var(--muted); font-size: 11px; margin-top: -2px; }
.logo-orb { width: 46px; height: 46px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(217,70,239,.9), rgba(8,145,178,.85)); box-shadow: 0 12px 35px rgba(99,102,241,.35); }
.logo-orb span { width: 19px; height: 19px; border-radius: 999px; border: 3px solid #fff; border-top-color: transparent; animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn, .sos-mini, .primary-btn, .ghost-btn, .small-btn, .danger-btn, .call-btn {
  min-height: 44px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  background: var(--surface); box-shadow: 0 10px 30px rgba(0,0,0,.12); color: var(--text);
}
.icon-btn { width: 44px; padding: 0; }
.sos-mini { background: rgba(239,68,68,.18); color: #fecaca; border-color: rgba(239,68,68,.42); font-weight: 900; padding: 0 14px; }
.primary-btn { background: linear-gradient(135deg, var(--info), var(--classic)); border: 0; color: white; font-weight: 900; padding: 0 18px; }
.ghost-btn { padding: 0 16px; }
.small-btn { min-height: 38px; padding: 0 12px; font-size: 13px; }
.small-btn.ghost { background: transparent; }
.danger-btn { background: rgba(239,68,68,.18); color: #fecaca; border-color: rgba(239,68,68,.35); padding: 0 18px; font-weight: 900; }
.full { width: 100%; margin-top: 12px; }
button:active, .call-btn:active { transform: translateY(1px); }

.hero, .card-xl, .ai-card, .doc-header, .video-card, .live-hero, .install-banner, .substance-card, .interaction-result, .metric-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(24px);
}
.wow-card { position: relative; min-height: 370px; overflow: hidden; padding: 22px; display: flex; align-items: flex-end; }
.hero-copy { position: relative; z-index: 2; }
.eyebrow { display: inline-flex; width: max-content; max-width: 100%; min-height: 28px; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 900; color: #dbeafe; background: rgba(99,102,241,.24); border: 1px solid rgba(99,102,241,.35); }
.hero h1, .doc-header h1, .section-title h1, .live-hero h1 { margin: 10px 0 8px; font-size: clamp(35px, 12vw, 58px); line-height: .88; letter-spacing: -.075em; }
.hero p, .doc-header p, .section-title p, .live-hero p, .muted { color: var(--muted); margin: 0; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.orbital { position: absolute; inset: -30px -40px auto auto; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), rgba(217,70,239,.26) 28%, rgba(8,145,178,.20) 54%, transparent 70%); filter: blur(.2px); animation: float 8s ease-in-out infinite; }
.orbital span { position: absolute; border: 1px solid rgba(255,255,255,.20); border-radius: 50%; inset: 12%; animation: spin 16s linear infinite; }
.orbital span:nth-child(2) { inset: 26%; animation-duration: 12s; animation-direction: reverse; }
.orbital span:nth-child(3) { inset: 41%; background: rgba(255,255,255,.8); box-shadow: 0 0 40px rgba(255,255,255,.5); }
@keyframes float { 50% { transform: translate3d(-10px, 18px, 0) scale(1.04); } }

.install-banner { margin: 12px 0 18px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.install-banner p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.section-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 2px 12px; }
.section-title h1, .section-title h2 { margin: 0; letter-spacing: -.055em; }
.section-title h2 { font-size: 24px; }
.section-title p { font-size: 13px; max-width: 260px; }

.substance-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.substance-card { min-height: 168px; padding: 15px; text-align: left; border: 1px solid var(--line); cursor: pointer; overflow: hidden; position: relative; }
.substance-card::after { content: ''; position: absolute; right: -28px; top: -28px; width: 110px; height: 110px; border-radius: 50%; background: var(--classic); opacity: .18; }
.substance-card.serotonin::after { background: var(--serotonin); }
.substance-card.ketamine::after { background: var(--ketamine); }
.substance-card h3 { margin: 12px 0 6px; font-size: 19px; line-height: 1; letter-spacing: -.045em; }
.substance-card p { margin: 0; font-size: 12px; color: var(--muted); }
.mini-row { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }

.badge, .route-pill, .back-chip, .rail-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; max-width: 100%;
  border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 900; line-height: 1; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
}
.badge.safe, .badge.safe-soft, .risk-code.safe, .risk-code.safe-soft { background: rgba(16,185,129,.18); color: #bbf7d0; }
.badge.info { background: rgba(99,102,241,.24); color: #dbeafe; }
.badge.warn { background: rgba(245,158,11,.22); color: #fde68a; }
.badge.danger { background: rgba(239,68,68,.22); color: #fecaca; }
.badge.critical { background: rgba(127,29,29,.72); color: #fff; }
.badge.classic { background: rgba(8,145,178,.24); color: #cffafe; }
.badge.ketamine { background: rgba(124,58,237,.24); color: #ddd6fe; }
.badge.serotonin { background: rgba(217,70,239,.24); color: #fae8ff; }
.badge.neutral { background: rgba(148,163,184,.18); color: var(--text); }
.route-pill { flex: none; min-height: 36px; padding-inline: 12px; overflow: visible; }
.back-chip { margin-bottom: 8px; min-height: 34px; }

.doc-header { margin-top: 8px; padding: 18px; overflow: visible; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(255,255,255,.03)), var(--surface); }
.doc-header.classic { background: linear-gradient(135deg, rgba(8,145,178,.22), rgba(255,255,255,.03)), var(--surface); }
.doc-header.serotonin { background: linear-gradient(135deg, rgba(217,70,239,.24), rgba(99,102,241,.14)), var(--surface); }
.doc-header.ketamine { background: linear-gradient(135deg, rgba(124,58,237,.26), rgba(255,255,255,.03)), var(--surface); }
.doc-header h1 { font-size: clamp(32px, 10vw, 52px); }
.substance-rail { display: flex; overflow-x: auto; gap: 8px; padding: 12px 2px 4px; scrollbar-width: none; }
.substance-rail::-webkit-scrollbar { display: none; }
.rail-chip { border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; flex: 0 0 auto; }
.rail-chip.active { background: rgba(99,102,241,.34); }
.segmented { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 12px; scrollbar-width: none; }
.segmented::-webkit-scrollbar { display: none; }
.segmented button { flex: 0 0 auto; min-height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); font-weight: 800; cursor: pointer; }
.segmented button.active { color: white; background: linear-gradient(135deg, var(--info), var(--classic)); border-color: transparent; }

.stack { display: grid; gap: 12px; }
.card-xl, .ai-card, .video-card { padding: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
h2, h3 { margin: 0 0 8px; letter-spacing: -.045em; line-height: 1.05; }
p { margin: 8px 0; }
ul { margin: 8px 0 0; padding-left: 18px; }
li { margin: 6px 0; }
.info-grid, .effect-grid, .form-grid, .metric-grid, .risk-grid { display: grid; gap: 10px; }
.info-grid { grid-template-columns: 1fr; }
.effect-grid { grid-template-columns: 1fr; }
.effect-card, .phase-card { border: 1px solid var(--line); background: var(--surface-2); border-radius: 18px; padding: 12px; }
.effect-card b, .phase-card span { font-weight: 900; }
.danger-zone { border-color: rgba(239,68,68,.35); }
.heart-card { border-color: rgba(217,70,239,.28); }

.ai-card { display: flex; align-items: flex-start; gap: 12px; background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(8,145,178,.12)), var(--surface); }
.ai-avatar { flex: 0 0 44px; height: 44px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, var(--info), var(--serotonin)); color: white; font-family: var(--mono); font-weight: 900; }
.ai-card p { color: var(--muted); font-size: 13px; margin: 6px 0; }

.video-card { overflow: hidden; position: relative; }
.video-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mechanism { width: 100%; display: block; border-radius: 22px; background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.10), rgba(255,255,255,.03) 44%, rgba(0,0,0,.14)); border: 1px solid var(--line); overflow: hidden; }
.mechanism text { fill: currentColor; font: 700 12px var(--mono); opacity: .82; }
.neuron, .lung, .gut, .room, .scale, .clock { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.45); stroke-width: 2; }
.post { fill: rgba(8,145,178,.14); }
.particles circle, .ions circle, .molecule { fill: #f0abfc; filter: url(#glow); animation: particle 2.2s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .08s); }
.mechanism.classic .particles circle, .mechanism.classic .molecule { fill: #67e8f9; }
.mechanism.ketamine .particles circle, .mechanism.ketamine .molecule { fill: #c4b5fd; }
@keyframes particle { 50% { transform: translate(10px, -8px); opacity: .55; } }
.gate, .channel, .display { fill: rgba(99,102,241,.24); stroke: rgba(255,255,255,.4); }
.membrane, .pulse path, .signal, .wave { fill: none; stroke: rgba(255,255,255,.50); stroke-width: 4; stroke-linecap: round; }
.receptor path, .receptor ellipse { fill: none; stroke: #93c5fd; stroke-width: 5; stroke-linecap: round; }
.signal { stroke: #a7f3d0; stroke-dasharray: 12 10; animation: dash 1.5s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -44; } }
.blocker { fill: #c4b5fd; filter: url(#glow); }
.heart-shape { fill: rgba(239,68,68,.30); stroke: #fecaca; stroke-width: 3; transform-origin: 210px 115px; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.06); } }
.pulse path { stroke: #fca5a5; stroke-dasharray: 520; animation: pulse 1.6s linear infinite; }
@keyframes pulse { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
.temp { fill: #f59e0b; filter: url(#glow); }
.warning-tri { fill: rgba(245,158,11,.18); stroke: #fbbf24; stroke-width: 4; }
.warn-mark { font: 900 82px var(--sans) ; fill: #fbbf24 ; }
.hand { stroke: #fff; stroke-width: 6; stroke-linecap: round; transform-origin: 210px 105px; animation: spin 12s linear infinite; }
.h2 { animation-duration: 4s; }
.progress-line { height: 8px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; margin: 12px 0; }
.progress-line span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--serotonin), var(--classic)); transition: width .25s ease; }
.video-script { font-size: 15px; }
.chapter-row { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 0; scrollbar-width: none; }
.chapter { flex: 0 0 112px; min-height: 72px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); text-align: left; padding: 10px; font-size: 12px; font-weight: 800; }
.chapter span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.12); margin-bottom: 6px; color: var(--text); }
.chapter.active { color: var(--text); border-color: rgba(99,102,241,.55); background: rgba(99,102,241,.18); }

.phase-cards { display: grid; gap: 9px; margin-top: 12px; }
.phase-cards.detailed { grid-template-columns: 1fr; }
.phase-card p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.phase-card.active { border-color: rgba(99,102,241,.65); background: rgba(99,102,241,.16); }

label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
input, select, textarea { width: 100%; min-height: 46px; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
textarea { resize: vertical; }
[data-theme="light"] input, [data-theme="light"] select, [data-theme="light"] textarea { background: #fff; }
.form-grid { grid-template-columns: 1fr; margin-top: 10px; }
.form-grid.two-cols, .form-grid.three-cols { grid-template-columns: 1fr 1fr; }
.result-card { display: grid; gap: 4px; margin-top: 12px; padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
.result-card span { color: var(--muted); font-size: 12px; font-weight: 900; }
.result-card b { font-size: 27px; letter-spacing: -.05em; }
.result-card em { font-family: var(--mono); font-style: normal; color: var(--muted); }
.result-card.warn { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.14); }
.result-card.danger, .result-card.critical { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.14); }
.result-card.safe { border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.12); }
.result-card.info { border-color: rgba(99,102,241,.5); background: rgba(99,102,241,.14); }

.alert, .friendly-warning, .action-strip { border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-top: 10px; background: var(--surface-2); }
.alert.safe { border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.12); }
.alert.warn, .friendly-warning { border-color: rgba(245,158,11,.42); background: rgba(245,158,11,.14); }
.alert.danger, .alert.critical { border-color: rgba(239,68,68,.48); background: rgba(239,68,68,.15); }
.alert.info { border-color: rgba(99,102,241,.42); background: rgba(99,102,241,.12); }

.timeline-wrap { margin: 12px 0; }
.timeline-bar { position: relative; display: flex; height: 48px; border-radius: 999px; padding: 4px; background: rgba(255,255,255,.08); overflow: hidden; border: 1px solid var(--line); }
.seg { display: grid; place-items: center; min-width: 48px; color: white; font-size: 10px; font-weight: 900; text-align: center; }
.seg:first-child { border-radius: 999px 0 0 999px; }
.seg:nth-last-child(2) { border-radius: 0 999px 999px 0; }
.seg.debut { background: rgba(99,102,241,.62); }
.seg.montee { background: rgba(217,70,239,.62); }
.seg.plateau { background: rgba(16,185,129,.62); }
.seg.descente { background: rgba(245,158,11,.68); }
.now-marker { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 999px; background: white; box-shadow: 0 0 18px white; }
.timeline-legend { display: grid; gap: 5px; margin-top: 8px; font-size: 11px; color: var(--muted); grid-template-columns: 1fr 1fr; }

.interaction-result { margin-top: 12px; padding: 14px; border-radius: 22px; }
.interaction-result.warn { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
.interaction-result.danger, .interaction-result.critical { border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.15); }
.interaction-result.safe, .interaction-result.safe-soft { border-color: rgba(16,185,129,.40); background: rgba(16,185,129,.10); }
.interaction-result.info { border-color: rgba(99,102,241,.40); background: rgba(99,102,241,.10); }
.risk-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.risk-badge b { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 16px; background: rgba(255,255,255,.16); font-size: 24px; }
.risk-badge span { font-weight: 900; }
.mini-video { margin-top: 12px; overflow: hidden; }
.mini-video-rail { display: grid; gap: 8px; }
.mini-video-rail div { padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: rgba(0,0,0,.10); }
.mini-video-rail i { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.14); font-style: normal; font-weight: 900; margin-right: 8px; }
.mini-video-rail b { font-weight: 900; }
.mini-video-rail p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.risk-grid { grid-template-columns: 1fr; }
.risk-code { border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
.risk-code b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.13); }
.risk-code.warn { background: rgba(245,158,11,.12); }
.risk-code.danger { background: rgba(239,68,68,.12); }
.risk-code.critical { background: rgba(127,29,29,.45); }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-chip { min-height: 38px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); padding: 0 12px; cursor: pointer; font-size: 13px; font-weight: 800; }
.toggle-chip.active { background: rgba(99,102,241,.24); color: var(--text); border-color: rgba(99,102,241,.45); }
.live-hero { margin-top: 8px; padding: 18px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, rgba(99,102,241,.26), rgba(217,70,239,.16)), var(--surface); }
.live-hero h1 { font-size: clamp(31px, 9vw, 48px); }
.live-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 0 rgba(16,185,129,.8); animation: live 1.4s infinite; }
@keyframes live { 70% { box-shadow: 0 0 0 14px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
.metric-grid { grid-template-columns: 1fr 1fr 1fr; }
.metric-card { padding: 12px; border-radius: 20px; box-shadow: none; }
.metric-card span, .metric-card small { display: block; color: var(--muted); font-size: 11px; font-weight: 900; }
.metric-card b { display: block; font-family: var(--mono); font-size: 19px; margin: 5px 0; }
.metric-card.safe { border-color: rgba(16,185,129,.45); }
.metric-card.warn { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
.metric-card.critical { border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.16); }
.entry-list { display: grid; gap: 8px; }

.interaction-svg .mix-core { fill: url(#mixGrad); opacity: .34; filter: url(#mixGlow); }

  "Empathogène stimulant : énergie, empathie, musique et contact social peuvent être amplifiés. Le point critique n’est pas seulement la dose : chaleur, danse, alcool, médicaments, reprises et fatigue changent beaucoup le profil de risque.": "MDMA is a stimulating empathogen: energy, empathy, music and social contact may feel amplified. The key risk is not only the dose: heat, dancing, alcohol, medicines, redoses and fatigue can quickly change the risk profile, so keep body signals visible.",
  "La MDMA fait monter très fort certains messagers du cerveau, surtout la sérotonine, mais aussi noradrénaline et dopamine. Cette poussée explique une partie de l’euphorie et de l’empathie, mais aussi la température, le cœur qui accélère et la descente.": "MDMA strongly raises certain brain messengers, especially serotonin, but also noradrenaline and dopamine. This surge explains part of the euphoria and empathy, but also heat, a faster heart rate and the comedown, so caution remains central.",
  "Inversion du transporteur SERT, libération massive de 5‑HT, inhibition de la recapture, contribution NET/DAT, libération d’ocytocine, baisse de la réactivité de l’amygdale. Point clé : la MDMA est liée au métabolisme CYP2D6 et peut rendre les reprises moins prévisibles.": "SERT reversal, massive 5-HT release, reduced reuptake, NET/DAT contribution, oxytocin release and lower amygdala reactivity. Key point: MDMA involves CYP2D6 metabolism and redoses can become less predictable, so treat them with caution.",
  "Noradrénaline plus haute : fréquence cardiaque et pression peuvent monter.": "Higher noradrenaline: heart rate and blood pressure can rise, so monitor body signals.",
  "Température : danse + lieu chaud + MDMA peuvent dépasser les capacités de refroidissement.": "Temperature: dancing + a hot venue + MDMA can exceed the body’s cooling capacity, so take cool-down breaks.",
  "Hydratation : trop peu d’eau expose à la déshydratation ; trop d’eau peut diluer les électrolytes.": "Hydration: too little water increases dehydration risk; too much plain water can dilute electrolytes, so aim for balanced hydration.",
  "Mélanges stimulants : cocaïne, amphétamines, cathinones ou caféine forte peuvent additionner la charge cardio.": "Stimulant mixtures: cocaine, amphetamines, cathinones or strong caffeine can add heart load, so avoid stacking stimulation.",

  "Grossesse / allaitement": "Untested product or signs of infection/vasculitis",
  "Avant : la vraie question est “est-ce que mon corps et mon contexte peuvent absorber une stimulation ?”. Sommeil, chaleur, alcool, médicaments, humeur et produit non analysé changent le scénario.": "Before: the real question is whether body and context can handle stimulation. Sleep, heat, alcohol, medication, mood and untested product all change the scenario, so stay cautious.",
  "Début : l’absorption orale prend souvent 30 à 60 min. Le piège classique est de conclure trop tôt que “ça ne marche pas”.": "Onset: oral absorption often takes 30 to 60 minutes. The classic trap is deciding too early that “nothing is happening”, so avoid rushing.",
  "Montée : la sérotonine et la noradrénaline augmentent. Sensations : chaleur, accélération cardiaque, tension corporelle, excitation ou anxiété.": "Come-up: serotonin and noradrenaline rise. Possible feelings include heat, faster heart rate, body tension, excitement or anxiety, so keep monitoring.",
  "Au plateau, tu te sens bien et tu n’as pas forcément envie de t’arrêter. Mais c’est exactement pour ça que c’est le moment le plus risqué physiquement : la MDMA réduit ta perception de la chaleur et de la fatigue. Règle pratique : toutes les 30-45 minutes de danse, fais une pause de 5-10 minutes dans un endroit plus frais. Bois environ 500 ml d’eau par heure si tu danses activement — pas plus, pas moins : trop d’eau d’un coup peut être aussi dangereux que pas assez. Si tu transpires beaucoup, pense aux électrolytes.": "Plateau: you may feel good and not want to stop. That is exactly why this phase is physically risky: MDMA can reduce awareness of heat and fatigue. Practical rule: every 30–45 minutes of dancing, pause 5–10 minutes somewhere cooler. Drink around 500 ml of water per hour if dancing actively — not much more, not much less. If you sweat heavily, think about electrolytes.",
  "Les effets que tu voulais vivre — empathie, euphorie, connexion — commencent à baisser. Mais pendant ce temps, ton cœur et ta température continuent à travailler fort pendant encore un moment. C’est ça la “charge corporelle”. Si tu reprends une dose pour retrouver le plateau du début, cette deuxième prise se superpose à une machine déjà fatiguée — ce qui la rend beaucoup moins prévisible et plus risquée que la première.": "Comedown: desired effects such as empathy, euphoria and connection start to fade. Meanwhile your heart and temperature may still be working hard: this is the body load. Redosing to “get the plateau back” adds onto a system already tired, making it less predictable and more risky.",
  "Dans les heures et les jours qui suivent, tu peux ressentir une humeur en creux, de la fatigue, moins d’appétit ou des difficultés à te concentrer. C’est normal et temporaire — c’est ton cerveau qui se recharge. Ce dont il a besoin : dormir autant que possible, manger des choses nourrissantes, éviter l’alcool et les stimulants pendant au moins 48h, et ne pas planifier une nouvelle prise avant que tu te sentes vraiment revenu à ton niveau de base.": "After: in the hours and days that follow, low mood, fatigue, reduced appetite or concentration problems can appear. This is temporary biology, not a moral failure: sleep, nourishing food, avoiding alcohol/stimulants for at least 48h and waiting until baseline returns are harm-reduction tools.",
  "Avant de commencer, pose-toi ces questions : est-ce que j’ai bien dormi cette nuit ? Est-ce que je suis dans un endroit que je connais ? Est-ce que je mange et bois suffisamment ? Est-ce que quelqu’un sait où je suis ? Mon produit a-t-il été analysé ? Ai-je mon téléphone chargé ? Ces questions ne sont pas de la paranoïa — elles changent vraiment ce qui va se passer dans les prochaines heures.": "Before starting, ask: did I sleep well? Am I in a place I know? Am I eating and drinking enough? Does someone know where I am? Has the product been tested? Is my phone charged? These questions are not paranoia — they change what may happen over the next hours, so stay cautious.",
  "Maintenant que le contexte est posé, la molécule doit d’abord passer par le système digestif puis le sang. C’est pour ça qu’une montée orale peut prendre du temps : un repas lourd, le stress ou la fatigue peuvent modifier la perception du délai.": "Once the context is set, the molecule first passes through digestion and blood. This is why oral onset can take time: a heavy meal, stress or fatigue can change how the delay feels. Do not rush interpretation.",
  "Au repos, deux neurones communiquent par petits messages chimiques. La sérotonine est stockée dans des petites poches, puis recyclée après utilisation par un récupérateur appelé SERT.": "At rest, two neurons communicate with small chemical messages. Serotonin is stored in small packets and then recycled after use by a transporter called SERT. This helps explain why later depletion needs caution.",
  "La MDMA arrive et trompe ce récupérateur. Au lieu de ramasser la sérotonine, SERT laisse sortir beaucoup plus de sérotonine dans l’espace entre les neurones.": "MDMA enters and tricks this recycler. Instead of collecting serotonin, SERT lets much more serotonin out into the space between neurons. This mechanism explains both the empathic rise and the need for caution.",
  "Résultat : les récepteurs reçoivent beaucoup de signaux d’un coup. C’est ce qui peut donner empathie, euphorie, confiance et chaleur émotionnelle — mais le stock est aussi dépensé très vite.": "Result: receptors receive many signals at once. This can produce empathy, euphoria, confidence and emotional warmth — but the stock is also spent quickly, so recovery matters.",
  "C’est pour ça que le plaisir ne suffit pas à lire le risque : la noradrénaline participe à l’accélération cardiaque, et la danse, la chaleur ou l’alcool peuvent amplifier la contrainte sur le corps.": "Pleasure is not enough to read risk: noradrenaline contributes to faster heart rate, while dancing, heat or alcohol can amplify body load. Keep heart and temperature visible.",
  "Quand l’euphorie baisse, les effets ressentis diminuent plus vite que la charge sur le corps. Reprendre pour “retrouver le plateau” revient à ajouter une dose sur une machine déjà fatiguée.": "When euphoria drops, felt effects may fall faster than body load. Redosing to “recover the plateau” adds a dose onto a tired system, so caution is stronger.",
  "Reconstruction": "Recovery",
  "Pendant les 24 à 72 heures qui suivent, ton cerveau reconstruit ses stocks de sérotonine. Ce processus dépend surtout du sommeil, de ce que tu manges — œufs, dinde, légumineuses, graines ou soja apportent du tryptophane, la matière première — et du repos. L’humeur basse, la fatigue ou l’irritabilité ne sont pas “dans ta tête” : c’est ton cerveau qui refait ses réserves. Plus tu laisses du temps, plus la récupération est complète.": "Over the next 24–72 hours, the brain rebuilds serotonin stores. Sleep, food such as eggs, turkey, legumes, seeds or soy, and rest provide support. Low mood or irritability can reflect rebuilding, so give recovery time.",
  "Attendre au minimum la fin de la montée et du pic ressenti avant toute interprétation. Une longue montée ou un buvard sous-dosé/sur-dosé peut tromper.": "Wait at least until the come-up and peak are complete before interpreting effects. A slow come-up or uncertain blotter can mislead, so stay cautious.",
  "Laisser finir la rémanence, dormir, intégrer. Le suivi signale les sessions proches qui se chevauchent avec la récupération.": "Let after-effects finish, sleep and integrate. The local tracker flags sessions that overlap with recovery.",
  "Psychédélique classique très long. Le risque principal est souvent psychologique, contextuel et accidentel : environnement, personnes, durée, fatigue, mélange cannabis ou lithium.": "LSD is a long-acting classic psychedelic. Main risks are often psychological, contextual and accidental: environment, people, duration, fatigue, cannabis or lithium can change the experience, so caution is essential.",
  "Le LSD active fortement des récepteurs de la sérotonine, surtout 5‑HT2A. Cela modifie la manière dont les perceptions, émotions et associations d’idées se construisent.": "LSD strongly activates serotonin receptors, especially 5-HT2A. This changes how perceptions, emotions and associations of ideas are built, so set and setting matter.",
  "Lysergamide avec agonisme/activité sur plusieurs récepteurs sérotoninergiques et dopaminergiques, dont 5‑HT2A. Durée longue et forte sensibilité au set and setting.": "Lysergamide with activity at several serotonergic and dopaminergic receptors, including 5-HT2A. Long duration and high sensitivity to set and setting require caution.",
  "Stimulation sympathique généralement transitoire : cœur et tension peuvent monter.": "Usually transient sympathetic stimulation: heart and blood pressure can rise.",

  "Un trip au LSD se prépare comme une journée complète : lieu, personnes, téléphone, retour, sommeil.": "An LSD experience is prepared like a full day: place, people, phone, return plan and sleep. This planning is a safety measure.",

  "La musique, la lumière, les paroles et la foule peuvent orienter l’expérience.": "Music, light, words and crowds can guide the experience more than expected. Reduce inputs if things become too intense.",
  "Le temps peut sembler très lent ou très rapide. Une boucle de pensée n’est pas une vérité : c’est une phase.": "Time may feel very slow or very fast. A thought loop is not truth: it is a phase to ride with caution.",

  "Le retour prend des heures. La priorité est de ne pas se mettre dans une situation qui exige d’être sobre.": "The return takes hours. The priority is not to enter a situation that requires sobriety.",
  "Le lendemain : repos, discussion bienveillante, recul. Les grandes conclusions attendent souvent un peu.": "The next day: rest, kind discussion and distance. Major conclusions often need time.",
  "Les effets peuvent arriver lentement selon repas, lot et digestion. Ne pas se baser sur les 20 premières minutes.": "Effects may arrive slowly depending on meal, batch and digestion. Do not rely on the first 20 minutes.",
  "Laisser dormir et intégrer ; le suivi signale les sessions trop proches ou une espèce/dose incertaine.": "Let sleep and integration happen; the tracker flags close sessions or uncertain species/dose.",
  "Psilocybine/psilocine avec puissance très variable selon espèce, partie du champignon et lot. Les erreurs d’identification peuvent être graves.": "Psilocybin/psilocin potency varies strongly by species, mushroom part and batch. Identification errors can be serious, so caution is essential.",
  "La psilocybine est transformée en psilocine, proche de la sérotonine, qui active notamment 5‑HT2A.": "Psilocybin is converted into psilocin, a molecule close to serotonin, which activates receptors such as 5-HT2A. Context remains central.",
  "Tryptamine psychédélique, conversion psilocybine → psilocine, agonisme 5‑HT2A et autres cibles sérotoninergiques.": "Psychedelic tryptamine, psilocybin → psilocin conversion, 5-HT2A agonism and other serotonergic targets. Product variability requires caution.",

  "Avant : vérifier espèce, forme sèche/fraîche, contexte et sitter. Une dose en grammes n’a de sens que si le produit est identifié.": "Before: check species, dry/fresh form, context and sitter. A gram dose only has meaning when the product is identified.",

  "Le lieu et les personnes deviennent très importants. Simple, doux, familier.": "Place and people become very important. Simple, soft and familiar is safer.",
  "Dormir, manger, écrire, parler. L’expérience peut continuer psychologiquement sans substance active.": "Sleep, eat, write and talk. The psychological process can continue after active effects.",
  "La prise nasale monte vite mais l’incoordination et la descente peuvent durer longtemps. La reprise visuelle est très imprécise.": "Nasal onset is fast, but incoordination and comedown can last long. Visual redosing is very imprecise.",
  "Surveiller sommeil, mémoire, vessie, tolérance et fréquence. Le suivi signale les répétitions rapprochées.": "Watch sleep, memory, bladder, tolerance and frequency. The tracker flags repeated close sessions.",
  "Dissociatif anesthésique. Risques majeurs : chute, confusion, vomissement, mélange avec alcool/GHB/benzodiazépines/opioïdes, et usage répété.": "Ketamine is a dissociative anesthetic. Major risks include falls, confusion, vomiting, mixtures with alcohol/GHB/benzodiazepines/opioids, and repeated use.",
  "La kétamine bloque des récepteurs NMDA du glutamate : le cerveau intègre moins bien les signaux corporels et sensoriels, d’où dissociation et incoordination.": "Ketamine blocks NMDA glutamate receptors: the brain integrates body and sensory signals less clearly, leading to dissociation and incoordination. Physical safety is central.",
  "Antagoniste non compétitif NMDA, effets dissociatifs et anesthésiques. Effets respiratoires particulièrement préoccupants avec dépresseurs du SNC.": "Non-competitive NMDA antagonist with dissociative and anesthetic effects. Respiratory and sedation risks are especially concerning with CNS depressants.",
  "Le risque cardio n’est pas le seul : respiration, vomissement et perte de coordination comptent beaucoup.": "Cardio risk is not the only issue: breathing, vomiting and loss of coordination matter a lot.",
  "Alcool/GHB/benzodiazépines/opioïdes : risque de sédation profonde et respiration ralentie.": "Alcohol/GHB/benzodiazepines/opioids: risk of deep sedation and slowed breathing.",
  "Même après le pic, marcher, escaliers, eau ou route restent risqués.": "Even after the peak, walking, stairs, water or roads remain risky.",

  "Avant : la priorité est le sol, pas la performance : lieu bas, calme, pas d’escalier, pas d’eau, pas de conduite.": "Before: the priority is the floor, not performance — low, calm place, no stairs, no water, no driving.",
  "Début : 2 à 5 min en sniff. Les effets arrivent vite.": "Onset: 2 to 5 minutes when snorted. Effects arrive fast.",
  "Montée : coordination et perception corporelle se décalent.": "Come-up: coordination and body perception shift.",

  "Avec un dissociatif, le lieu physique est un équipement de sécurité.": "With a dissociative, the physical place is safety equipment.",
  "Les effets peuvent apparaître en quelques minutes : pas le temps d’improviser.": "Effects can appear within minutes: there is no time to improvise.",
  "La kétamine bloque le canal NMDA : la transmission glutamate change.": "Ketamine blocks the NMDA channel: glutamate transmission changes.",
  "Corps, espace et temps peuvent sembler séparés. Marcher ou monter des escaliers devient plus risqué.": "Body, space and time may feel separated. Walking or using stairs becomes riskier.",
  "Alcool, GHB, benzos ou opioïdes peuvent additionner sédation et respiration ralentie.": "Alcohol, GHB, benzodiazepines or opioids can add sedation and slowed breathing.",
  "Même après le pic, la coordination et le jugement peuvent rester altérés.": "Even after the peak, coordination and judgment may remain impaired.",
  "Légal en France. Sa légalité ne neutralise pas sa dangerosité : sevrage, accidents, foie et mélanges restent des zones de vigilance.": "Legal in France. Legality does not neutralize danger: withdrawal, accidents, liver injury and mixtures remain areas of vigilance.",
  "L’alcool s’élimine à vitesse presque fixe : café, douche froide ou volonté ne l’accélèrent pas. La reprise ou le mélange avec sédatifs/stimulants augmente l’incertitude, donc prudence.": "Alcohol is eliminated at an almost fixed speed: coffee, cold showers or willpower do not accelerate it. Redosing or mixing with sedatives/stimulants increases uncertainty, so stay cautious.",
  "Après une consommation importante, surveiller sommeil, mémoire, nausées, humeur, hydratation et signes de sevrage. Une consommation quotidienne prolongée ne doit pas être arrêtée brutalement sans avis médical.": "After heavy drinking, monitor sleep, memory, nausea, mood, hydration and withdrawal signs. Prolonged daily drinking should not be stopped abruptly without medical advice.",
  "L’alcool est un dépresseur du système nerveux central. Il peut donner une impression de désinhibition parce que le cortex préfrontal s’éteint tôt, mais il ralentit coordination, mémoire, jugement et respiration en mélange. Sa légalité ne réduit pas le risque biologique : prudence.": "Alcohol is a central nervous system depressant. It may feel disinhibiting because the prefrontal cortex goes offline early, but it slows coordination, memory, judgment and breathing when mixed. Legality does not reduce biological risk: stay vigilant.",
  "L’alcool renforce le frein GABA, bloque une partie du système glutamate/NMDA lié à la mémoire, et libère indirectement de la dopamine via les endorphines. Il s’agit d’une dépression globale du cerveau, pas d’une stimulation sûre.": "Alcohol strengthens the GABA brake, blocks part of the glutamate/NMDA memory system, and indirectly releases dopamine via endorphins. This is global brain depression, not safe stimulation.",
  "Potentialisation GABA_A, inhibition NMDA, désinhibition dopaminergique via voies opioïdes dans l’ATV, métabolisme ADH → acétaldéhyde puis ALDH2 → acétate, induction CYP2E1 en exposition chronique. Les mélanges dépresseurs et le sevrage imposent une vigilance médicale.": "GABA_A potentiation, NMDA inhibition, dopaminergic disinhibition via opioid pathways in the VTA, ADH → acetaldehyde then ALDH2 → acetate metabolism, CYP2E1 induction in chronic exposure. Depressant mixtures and withdrawal require medical vigilance.",
  "Dépresseur du SNC : vigilance, réflexes, coordination et respiration peuvent baisser, surtout avec d’autres dépresseurs.": "CNS depressant: alertness, reflexes, coordination and breathing can fall, especially with other depressants.",
  "Foie : l’éthanol devient acétaldéhyde, molécule toxique et inflammatoire, puis acétate si le système suit.": "Liver: ethanol becomes acetaldehyde, a toxic inflammatory molecule, then acetate if the system keeps up.",
  "Mémoire : le blocage NMDA peut produire un blackout, c’est-à-dire vivre des événements sans les enregistrer durablement.": "Memory: NMDA blockade can produce blackout — living events without storing them durably.",
  "Sevrage : tremblements, confusion, hallucinations ou convulsions après arrêt d’une consommation quotidienne prolongée sont une urgence médicale.": "Withdrawal: tremor, confusion, hallucinations or seizures after stopping prolonged daily drinking are a medical emergency.",

  "Avant : rappeler que légal ne veut pas dire neutre. Le contexte, les quantités, la vitesse de prise, le sommeil, les médicaments et les autres substances changent le risque ; prudence.": "Before: remember that legal does not mean neutral. Context, quantities, drinking speed, sleep, medications and other substances change risk; stay cautious.",
  "Début : absorption digestive rapide, désinhibition précoce et baisse du frein social. C’est déjà une altération du jugement, donc vigilance.": "Onset: rapid digestive absorption, early disinhibition and lowered social brake. Judgment is already altered, so stay vigilant.",
  "Montée : le cortex préfrontal se désorganise, la coordination baisse et la mémoire commence à devenir fragile. Ralentir le rythme et éviter les mélanges restent les priorités.": "Come-up: the prefrontal cortex becomes disorganized, coordination drops and memory starts to become fragile. Slowing the pace and avoiding mixtures remain priorities.",
  "Plateau : GABA renforcé et NMDA bloqué peuvent créer somnolence, chute, blackout et perte de repères. Le danger augmente fortement avec dépresseurs, donc prudence.": "Plateau: strengthened GABA and blocked NMDA can create sleepiness, falls, blackout and disorientation. Danger rises strongly with depressants, so be cautious.",
  "Descente : le corps élimine une quantité fixe par heure. Quand l’effet subjectif change, l’alcoolémie peut encore rester élevée ; pas de conduite ni décision risquée.": "Comedown: the body eliminates a fixed amount per hour. When subjective effects shift, blood alcohol can still be high; no driving or risky decisions.",
  "Après : gueule de bois, sommeil fragmenté, acétaldéhyde, déshydratation et rebond glutamatergique peuvent coexister. Consulter en cas de confusion, vomissements répétés, douleur ou sevrage.": "After: hangover, fragmented sleep, acetaldehyde, dehydration and glutamate rebound can coexist. Seek help for confusion, repeated vomiting, pain or withdrawal.",
  "Avant de boire ou de gérer une situation avec alcool, la question n’est pas seulement la légalité : c’est le contexte, les mélanges, la vitesse, le transport, le consentement et la capacité à rentrer en sécurité. Cette lecture sert à renforcer la vigilance.": "Before drinking or managing a situation with alcohol, the question is not only legality: context, mixtures, speed, transport, consent and safe return matter. This reading is for vigilance.",
  "L’alcool renforce les freins GABA_A : les neurones déclenchent moins facilement leurs signaux. Détente et maladresse viennent du même mécanisme, donc prudence.": "Alcohol strengthens GABA_A brakes: neurons fire less easily. Relaxation and clumsiness come from the same mechanism, so stay cautious.",
  "En bloquant NMDA, l’alcool empêche l’hippocampe de graver correctement certains souvenirs. Le blackout n’est pas un simple oubli : c’est une alerte de vigilance.": "By blocking NMDA, alcohol prevents the hippocampus from storing some memories correctly. Blackout is not simple forgetfulness: it is a vigilance alert.",
  "Le foie transforme l’alcool en acétaldéhyde, puis en acétate. Si le flux dépasse les capacités ou devient chronique, inflammation et dégâts hépatiques deviennent des zones de prudence.": "The liver turns alcohol into acetaldehyde, then acetate. If the flow exceeds capacity or becomes chronic, inflammation and liver injury become areas of caution.",
  "Avec GHB, benzodiazépines ou opiacés, la respiration et la conscience peuvent chuter. C’est une zone critique de réduction des risques.": "With GHB, benzodiazepines or opioids, breathing and consciousness can drop. This is a critical harm-reduction zone.",
  "Après consommation quotidienne prolongée, arrêter brutalement peut déclencher tremblements, convulsions ou Delirium Tremens. Cette situation relève d’une aide médicale.": "After prolonged daily drinking, stopping abruptly can trigger tremors, seizures or Delirium Tremens. This situation requires medical help.",
  "La durée courte favorise la compulsion de reprise : quand le rush baisse, le cœur et la tension peuvent encore être sollicités. La prudence porte sur la répétition, pas seulement sur une ligne.": "Short duration encourages compulsive redosing: when the rush drops, heart and blood pressure may still be under load. Caution concerns repetition, not only the first line.",
  "Après usage, surveiller douleur thoracique, palpitations, anxiété, paranoïa, craving, sommeil et humeur. Produit non analysé = vigilance renforcée, notamment lévamisole.": "After use, monitor chest pain, palpitations, anxiety, paranoia, craving, sleep and mood. Untested product = stronger vigilance, especially for levamisole.",
  "La cocaïne bloque la recapture de dopamine, noradrénaline et sérotonine. L’euphorie et la confiance peuvent être brèves, mais la charge cardiovasculaire peut être aiguë : infarctus, arythmie, AVC et toxicité des adultérants imposent une vigilance forte.": "Cocaine blocks reuptake of dopamine, noradrenaline and serotonin. Euphoria and confidence can be brief, but cardiovascular load can be acute: heart attack, stroke, arrhythmia and levamisole adulteration must be as visible as the rush.",
  "La cocaïne bouche DAT, NET et SERT : les messagers restent coincés dans la synapse. Dopamine = récompense artificielle ; noradrénaline = cœur/tension en alerte ; sérotonine = confiance/désinhibition. Cette combinaison demande prudence.": "Cocaine blocks DAT, NET and SERT: chemical messengers stay trapped in the synapse. Dopamine = artificial reward; noradrenaline = heart/blood pressure alert; serotonin = added confidence/disinhibition. This combination requires caution.",
  "Inhibition DAT/NET/SERT, tempête adrénergique, vasospasme alpha‑1, tachycardie beta‑1, blocage canaux sodium et hERG, cocaéthylène avec alcool, craving glutamatergique via xCT/GLT‑1 et plasticité ΔFosB. Risque cardio aigu à rendre très visible.": "DAT/NET/SERT inhibition, adrenergic storm, alpha-1 vasospasm, beta-1 tachycardia, sodium and hERG channel blockade, cocaethylene with alcohol, glutamatergic craving via xCT/GLT-1, and DeltaFosB-related plasticity. Cardiovascular vigilance is central.",
  "Cœur : la demande d’oxygène augmente alors que les coronaires peuvent se resserrer par vasospasme. Douleur thoracique ou malaise = urgence.": "Heart: oxygen demand rises while coronary arteries can tighten via vasospasm. Chest pain or faintness = emergency.",
  "Électricité : blocage de canaux sodium/hERG peut favoriser arythmies, QTc allongé et fibrillation.": "Electrical system: sodium/hERG channel blockade may favor arrhythmias, prolonged QTc and fibrillation.",
  "Lévamisole : adultérant fréquent pouvant détruire des globules blancs et provoquer vascularite ou nécrose.": "Levamisole: frequent adulterant that can destroy white blood cells and trigger vasculitis or necrosis.",
  "Craving : la redescente dopaminergique et le glutamate peuvent pousser à reprendre malgré les risques.": "Brain/vessels: high blood pressure, sticky platelets and damaged endothelium increase stroke risk.",
  "Éveil, pupilles dilatées, tension corporelle, anesthésie locale nasale": "Numbness of mucosa, increased light/sound alertness, dilated pupils",
  "Confiance, urgence d’agir, mégalomanie temporaire, anxiété ou paranoïa": "Euphoria, confidence, speed of thought, irritability or paranoia",
  "Tachycardie, hypertension, vasospasme, risque infarctus/AVC, insomnie, saignements nasaux": "Tachycardia, blood pressure rise, sweating, chest pain risk, redosing compulsion",
  "Douleur thoracique, hypertension, trouble cardiaque ou antécédent AVC": "Heart disease, hypertension, stroke history, chest pain",
  "Mélange avec alcool ou stimulants": "Alcohol: cocaethylene and higher cardiac toxicity",
  "Produit non analysé, risque lévamisole": "Stimulants, MAOIs or other substances increasing blood pressure",
  "Avant : produit non analysé, cœur, tension, sommeil, anxiété, alcool et contexte doivent être considérés. La brièveté du rush ne signifie pas faible risque.": "Before: heart, blood pressure, alcohol, product analysis, sleep and context matter before euphoria. Untested powder creates extra uncertainty, so stay cautious.",
  "Début : sniff 1 à 5 min, montée rapide de dopamine/noradrénaline. L’effet peut pousser à parler, bouger, décider vite ; prudence.": "Onset: rapid dopamine/noradrenaline rise. The effect can push fast talking, movement and decisions; stay cautious.",
  "Montée : DAT/NET/SERT sont bloqués, l’alerte corporelle augmente et la confiance peut masquer les signaux rouges.": "Come-up: DAT/NET/SERT are blocked, body alertness increases and confidence may hide red flags.",
  "Plateau : le cœur demande plus d’oxygène pendant que les artères peuvent se resserrer. Toute douleur thoracique, malaise ou déficit neurologique = 112.": "Plateau: the heart asks for more oxygen while arteries can tighten. Any chest pain, faintness or neurological deficit = 112.",
  "Descente : dopamine sous la ligne de base, irritabilité, anxiété, fatigue et craving. La reprise immédiate augmente la charge cardiovasculaire.": "Comedown: dopamine falls below baseline, with irritability, anxiety, fatigue and craving. Immediate redosing increases cardiovascular load.",
  "Après : sommeil, humeur, nez, cœur et envie de reprendre doivent être surveillés. En cas de douleur thoracique, faiblesse d’un côté, confusion ou fièvre : urgence.": "After: sleep, mood, nose, heart and urge to redose should be monitored. Chest pain, one-sided weakness, confusion or fever = emergency.",
  "La cocaïne est courte mais pas légère pour le corps. Cœur, tension, sommeil, alcool, produit non analysé et contexte sont les signaux à mettre devant l’euphorie.": "Cocaine is short but not light on the body. Heart, blood pressure, sleep, alcohol, untested product and context must come before euphoria.",
  "La molécule ne vide pas les stocks comme la MDMA : elle bouche les récupérateurs. Les messagers restent dans la synapse et bombardent les récepteurs.": "The molecule does not empty stores like MDMA: it blocks the recyclers. Messengers remain in the synapse and bombard receptors.",
  "NET bloqué signifie alerte et tension : le cœur bat plus vite et plus fort. Cette stimulation peut devenir dangereuse, donc vigilance.": "NET blocked means alert and blood pressure: the heart beats faster and harder. This stimulation can become dangerous, so stay vigilant.",
  "Avec alcool, le foie peut former du cocaéthylène, métabolite plus long et plus toxique pour le cœur. Éviter ce mélange est une mesure de prudence.": "With alcohol, the liver can form cocaethylene, a longer-lasting and more cardiotoxic metabolite. Avoiding this mixture is a caution measure.",
  "Un adultérant fréquent, le lévamisole, peut toucher l’immunité et les vaisseaux. Faire analyser les produits reste une mesure de vigilance RdR.": "A frequent adulterant, levamisole, can affect immunity and blood vessels. Product checking remains a harm-reduction vigilance measure.",
  "Quand la dopamine chute, l’envie de reprendre peut devenir très forte. Reconnaître ce mécanisme aide à différer et à réduire le risque.": "When dopamine drops, the urge to redose can become very strong. Naming this mechanism can help delay action and reduce risk.",
  "SERT : le cheval de Troie": "SERT: the Trojan horse",
  "Pourquoi la MDMA ne fait pas seulement activer un bouton, mais force un flux entier à changer de sens.": "Why MDMA does not only press a button, but forces a whole flow to change direction.",
  "La sérotonine est un messager chimique : elle participe à l’humeur, au lien social, au sommeil, à l’appétit et à la température. En temps normal, elle est envoyée dans la synapse puis récupérée pour être recyclée, ce qui garde le signal sous contrôle. Cette lecture sert à comprendre la vigilance, pas à banaliser la prise.": "Serotonin is a chemical messenger involved in mood, social bonding, sleep, appetite and temperature. Normally it is sent into the synapse and then recovered for recycling, keeping the signal controlled. This is information for vigilance, not reassurance.",
  "Le récupérateur principal s’appelle SERT. Tu peux l’imaginer comme un aspirateur de recyclage posé sur le neurone émetteur : il ramasse la sérotonine qui flotte encore après le message et la fait rentrer pour la réutiliser. Cette image aide à comprendre pourquoi les reprises sont à prendre avec prudence.": "The main recycler is called SERT. Imagine it as a recycling vacuum on the sending neuron: it collects serotonin still floating after the message and brings it back in for reuse. This image explains why redosing needs caution.",
  "La MDMA ressemble assez à la sérotonine pour tromper SERT. Le transporteur l’attrape et la fait entrer dans le neurone, croyant récupérer de la sérotonine à recycler : c’est le mécanisme du cheval de Troie. Cette ressemblance ne rend pas la situation sûre, elle explique seulement le piège biologique.": "MDMA resembles serotonin enough to trick SERT. The transporter grabs MDMA and brings it into the neuron, thinking it is recovering serotonin: this is the Trojan horse mechanism. Resemblance does not make it safe; it explains the biological trap.",
  "Une fois à l’intérieur, la MDMA ne reste pas calmement rangée. Elle provoque la vidange des réserves internes, le neurone se retrouve rempli de sérotonine libre depuis l’intérieur, et SERT finit par changer de sens sous la pression de ce trop-plein. Plus l’explication devient claire, plus la prudence sur les reprises doit rester forte.": "Once inside, MDMA does not sit quietly. It causes internal stores to empty, the neuron fills with free serotonin from within, and SERT eventually reverses under the pressure of the overflow. The clearer the mechanism, the stronger the caution around redoses.",
  "Résultat : beaucoup de sérotonine arrive dans la synapse en peu de temps, ce qui peut produire empathie, euphorie et chaleur émotionnelle. Mais le même mécanisme dépense un stock biologique qui devra être reconstruit ; c’est une raison de surveiller dose totale, chaleur, sommeil et récupération.": "Result: a lot of serotonin reaches the synapse quickly, which can produce empathy, euphoria and emotional warmth. But the same mechanism spends a biological stock that must be rebuilt; dose total, heat, sleep and recovery remain vigilance points.",
  "Pour aller plus loin que l’image de l’aspirateur : la MDMA agit comme substrat de SERT, le transporteur membranaire de la sérotonine, et déclenche un efflux de 5‑HT vers la fente synaptique. L’information reste une base de vigilance pharmacologique.": "In molecular terms, MDMA acts as a SERT substrate and drives 5-HT efflux into the synaptic cleft. This remains pharmacological vigilance information.",
  "Ce n’est pas SERT seul qui explique tout : l’efflux dépend aussi de l’accumulation intraneuronale créée par la vidange des vésicules et par la perturbation de l’équilibre ionique. Le signal peut donc devenir moins linéaire qu’une simple addition de dose, ce qui justifie la prudence.": "SERT alone does not explain everything: efflux also depends on intraneuronal accumulation created by vesicle emptying and ionic disruption. The signal can be less linear than simple dose addition, which supports caution.",
  "Le mécanisme est différent d’un simple agonisme de récepteur : il perturbe transport membranaire, stockage vésiculaire, recapture et disponibilité du stock. Cette complexité rend les top-ups et mélanges plus difficiles à interpréter avec sécurité.": "This is different from simple receptor agonism: membrane transport, vesicular storage, reuptake and stock availability are disrupted. Top-ups and mixtures are therefore harder to interpret safely.",
  "VMAT2 : la batterie des vésicules": "VMAT2: the vesicle battery",
  "Pourquoi les poches de sérotonine se vident au lieu de rester stables.": "Why serotonin packets empty instead of staying stable.",
  "Dans le neurone, la sérotonine est rangée dans de petites poches appelées vésicules. Ces poches ne sont pas de simples sacs : elles gardent leur contenu grâce à une forte acidité interne, comme une batterie chargée. Comprendre ce stockage aide à respecter les temps de récupération.": "Inside the neuron, serotonin is stored in small packets called vesicles. They are not simple bags: they keep their content with a strongly acidic interior, like a charged battery. Understanding storage helps respect recovery time.",
  "Le transporteur VMAT2 utilise cette batterie acide pour forcer la sérotonine à rester dans la poche malgré la pression. Tant que l’acidité est là, la vésicule peut stocker correctement le messager. Cette mécanique fragile devient une zone de vigilance quand elle est perturbée.": "VMAT2 uses this acidic battery to force serotonin into the vesicle and keep it there against pressure. As long as acidity is present, storage works. This fragile mechanism becomes a vigilance point when disrupted.",
  "La MDMA est chimiquement basique. Quand elle entre dans la vésicule acide, elle capture des protons et neutralise une partie de l’acidité : le pH monte, donc la batterie perd sa charge. Ce n’est pas un effet mystérieux : c’est le mécanisme lui-même, et il appelle à la prudence.": "MDMA is chemically basic. When it enters the acidic vesicle, it captures protons and neutralizes part of the acidity: pH rises and the battery loses charge. This is not a mysterious side effect: it is the mechanism itself, and it calls for caution.",
  "Sans ce gradient de pH, VMAT2 ne retient plus aussi bien la sérotonine. La poche ne s’ouvre pas comme une porte, mais elle devient moins capable de garder son contenu : la sérotonine fuit dans le neurone puis ressort vers la synapse via SERT inversé. Ce phénomène explique pourquoi le stock n’est pas immédiatement disponible après.": "Without this pH gradient, VMAT2 cannot hold serotonin as well. The vesicle does not open like a door, but becomes less able to retain content: serotonin leaks into the neuron and then exits through reversed SERT. This explains why the stock is not immediately available afterwards.",
  "Après la session, le système doit retrouver son acidité interne, recharger les vésicules et restaurer les transporteurs. Cette reconstruction prend du temps : ne pas la confondre avec un simple retour subjectif à la normale.": "After the session, the system must restore internal acidity, refill vesicles and restore transporters. This takes time: do not confuse feeling “back” with full biological recovery.",
  "Pour aller plus loin : VMAT2 concentre les monoamines dans les vésicules en utilisant un gradient protonique maintenu par l’acidification intravésiculaire. La perturbation de ce gradient réduit la capacité de stockage et impose une prudence sur les répétitions.": "VMAT2 concentrates monoamines in vesicles using a proton gradient maintained by intravesicular acidification. Disrupting this gradient reduces storage capacity and supports caution around repeated use.",
  "La MDMA, base faible, peut contribuer à dissiper le gradient de protons et à augmenter le pH intravésiculaire. La sérotonine cytosolique devient alors plus disponible pour l’efflux, ce qui renforce la nécessité de suivre la charge totale.": "MDMA, a weak base, can dissipate the proton gradient and raise intravesicular pH. Cytosolic serotonin becomes more available for efflux, reinforcing the need to track total load.",
  "Quand les prises se répètent avant restauration vésiculaire, le terminal présynaptique peut être exposé à davantage de stress oxydatif et de dysrégulation monoaminergique. Cette partie doit rester une information de vigilance, pas une prédiction individuelle.": "If use repeats before vesicular restoration, the serotonergic terminal can face more oxidative stress and monoaminergic dysregulation. This is vigilance information, not an individual prediction.",
  "Foie et CYP2D6 : l’auto-inhibition": "Liver and CYP2D6: auto-inhibition",
  "Pourquoi une deuxième prise ne disparaît pas forcément comme la première.": "Why a second dose may not clear like the first.",
  "Le foie essaie de nettoyer la MDMA en la transformant avec des enzymes. Une de ces enzymes, CYP2D6, participe au nettoyage, mais la MDMA peut aussi ralentir partiellement cette même enzyme. Ce point sert à comprendre pourquoi une reprise doit être traitée avec prudence.": "The liver tries to clear MDMA by transforming it with enzymes. One of them, CYP2D6, contributes to clearance, but MDMA can partly slow that same enzyme. This explains why redosing deserves caution.",
  "On appelle cela une auto-inhibition : la molécule peut freiner une partie de son propre système d’élimination. Résultat : une deuxième prise peut s’accumuler dans un système déjà occupé au lieu d’être nettoyée à la même vitesse que la première. Cette accumulation rend le scénario moins prévisible.": "This is called auto-inhibition: the molecule can slow part of its own cleanup system. A second dose can accumulate in a system already busy instead of being cleared at the same speed as the first. That makes the scenario less predictable.",
  "C’est pour cela qu’un petit top-up n’est pas toujours une petite addition simple. Le corps peut encore contenir la première dose, le foie peut être ralenti, et la température ou le cœur peuvent rester sollicités. Le suivi doit donc rester prudent même si l’euphorie baisse.": "A small top-up is not always a simple small addition. The body may still contain the first dose, the liver may be slowed, and heart/temperature can remain under load. Tracking should stay cautious even if euphoria falls.",
  "Cette information n’est pas un calcul exact de concentration sanguine : elle sert à rappeler qu’une reprise ressentie comme légère peut augmenter une charge biologique déjà présente. En cas de confusion, chaleur forte, malaise ou douleur thoracique, la vigilance doit primer.": "This is not an exact blood-concentration calculator: it reminds that a redose felt as light can increase a biological load already present. Confusion, strong heat, faintness or chest pain call for immediate vigilance.",
  "Pour aller plus loin : CYP2D6 est une enzyme hépatique de biotransformation impliquée dans le métabolisme de la MDMA ; l’inhibition mécanisme‑dépendante peut contribuer à une pharmacocinétique non linéaire. Cette notion soutient la prudence sur les redoses.": "CYP2D6 is a hepatic biotransformation enzyme involved in MDMA metabolism; mechanism-dependent inhibition can contribute to non-linear pharmacokinetics. This supports redose caution.",
  "La concentration plasmatique peut augmenter de manière disproportionnée quand l’élimination est ralentie et que la prise s’ajoute à une exposition encore active. Le suivi par dose totale reste indicatif et ne remplace pas une évaluation médicale.": "Plasma concentration may increase disproportionately when elimination is slowed and exposure remains active. Total-dose tracking is indicative and not medical assessment.",
  "Les métabolites, l’hyperthermie, la stimulation sympathique et les interactions médicamenteuses peuvent se superposer. Cette superposition est un signal de vigilance RdR.": "Metabolites, hyperthermia, sympathetic stimulation and drug interactions can overlap. That overlap is a harm-reduction warning signal.",
  "Surchauffe et hyponatrémie": "Overheating and hyponatremia",
  "Deux risques opposés : trop peu d’eau, mais aussi trop d’eau pure.": "Two opposite risks: too little water, but also too much plain water.",
  "La sérotonine intervient aussi dans la thermorégulation, c’est-à-dire le thermostat du corps. Sous MDMA, ce thermostat peut devenir moins fiable, surtout si tu danses longtemps, dans un lieu chaud, avec peu de pauses. La priorité est de surveiller les signaux corporels sans attendre d’être en difficulté.": "Serotonin also participates in thermoregulation, the body thermostat. Under MDMA, this thermostat may be less reliable, especially with long dancing, hot venues and few breaks. Monitor body signals before distress appears.",
  "Quand le corps chauffe, il transpire pour se refroidir. La transpiration fait perdre de l’eau, mais aussi des électrolytes comme le sodium. Boire trop peu peut aggraver la déshydratation et la surchauffe : c’est une vraie zone de vigilance.": "When the body heats, it sweats to cool down. Sweat loses water but also electrolytes such as sodium. Drinking too little can worsen dehydration and overheating: this is a real vigilance point.",
  "Mais boire des litres d’eau pure très vite peut créer un autre danger : le sodium du sang se dilue, ce qu’on appelle hyponatrémie. L’eau peut alors entrer dans les cellules pour rééquilibrer les concentrations. Cette situation est rare mais grave, donc elle doit être connue.": "But drinking liters of plain water very fast can create another danger: blood sodium becomes diluted, called hyponatremia. Water can then enter cells to rebalance concentrations. This is rare but serious, so it must be known.",
  "Le cerveau est enfermé dans le crâne, une boîte rigide. S’il gonfle, la pression peut monter, réduire l’apport sanguin, comprimer le tronc cérébral, perturber la respiration, puis provoquer un manque d’oxygène pour le cœur. Confusion, vomissements, convulsions, forte température ou malaise justifient d’appeler les secours.": "The brain is trapped inside the rigid skull. If it swells, pressure can rise, reduce blood supply, compress the brainstem, disrupt breathing, then deprive the heart of oxygen. Confusion, vomiting, seizures, high temperature or faintness justify emergency help.",
  "La conduite pratique reste simple : pauses régulières au frais, hydratation normale, électrolytes si forte transpiration, éviter alcool et stimulation excessive. Le but est la vigilance équilibrée, pas la peur.": "Practical approach: regular cool breaks, normal hydration, electrolytes if heavy sweating, avoid alcohol and excessive stimulation. The goal is balanced vigilance, not fear.",
  "Pour aller plus loin : la MDMA peut perturber thermorégulation, hormone antidiurétique et comportements d’effort, ce qui rend simultanément possibles hyperthermie, déshydratation et hyponatrémie selon le contexte. Cette cohabitation impose une lecture prudente.": "MDMA can disturb thermoregulation, antidiuretic hormone and effort behavior, making hyperthermia, dehydration and hyponatremia possible depending on context. This overlap requires caution.",
  "L’hyponatrémie sévère expose à œdème cérébral, hypertension intracrânienne, convulsions, compression du tronc cérébral, arrêt respiratoire puis hypoxie. Ces signes relèvent d’une urgence médicale.": "Severe hyponatremia can lead to cerebral edema, intracranial hypertension, seizures, brainstem compression, respiratory arrest and hypoxia. These signs are medical emergencies.",
  "Les métriques température, fréquence cardiaque, hydratation et état mental doivent donc être lues ensemble. Aucune valeur isolée ne suffit à garantir la sécurité.": "Temperature, heart rate, hydration and mental state must be read together. No single value guarantees safety.",
  "Valves cardiaques : le risque silencieux de la répétition": "Heart valves: the silent risk of repetition",
  "Le problème n’est pas seulement l’intensité d’une soirée, mais la fréquence cumulée.": "The issue is not only one intense night, but cumulative frequency.",
  "Certaines cellules des valves cardiaques portent des récepteurs sensibles à la sérotonine, notamment 5‑HT2B. Quand ces récepteurs sont stimulés de manière répétée, ils peuvent envoyer un signal de construction aux cellules de valve. Cette partie est une vigilance de long terme, pas un diagnostic personnel.": "Some heart valve cells carry serotonin-sensitive receptors, including 5-HT2B. When stimulated repeatedly, they can send a construction signal to valve cells. This is long-term vigilance, not a personal diagnosis.",
  "La cellule peut alors produire davantage de collagène, une protéine solide qui sert normalement à réparer les tissus. En excès, le collagène rigidifie la valve, comme une cicatrice interne qui rendrait une petite porte moins souple. La répétition augmente la prudence nécessaire.": "The cell may produce more collagen, a solid protein normally used to repair tissues. In excess, collagen stiffens the valve like an internal scar making a small door less flexible. Repetition increases the need for caution.",
  "Une valve rigide peut moins bien se fermer. Le sang peut refluer, le cœur doit travailler davantage, puis se fatiguer avec le temps. Ce processus est souvent silencieux au début : on ne sent pas ses valves s’épaissir. Cette absence de symptôme précoce ne doit pas être interprétée comme une absence de risque.": "A rigid valve may close less well. Blood can leak backward, the heart must work harder, and over time it can tire. This process is often silent at first: you do not feel valves thickening. No early symptom does not mean no risk.",
  "Le précédent du Fen-Phen, médicament retiré pour des problèmes valvulaires via des mécanismes liés à 5‑HT2B, montre pourquoi les chercheurs prennent ce sujet au sérieux. Pour la MDMA comme pour les psychédéliques répétés, le message RdR est la prudence sur la fréquence.": "The Fen-Phen precedent, a medicine withdrawn for valve problems linked to 5-HT2B mechanisms, explains why researchers take this seriously. For repeated MDMA or psychedelic exposure, the harm-reduction message is frequency caution.",
  "Pour aller plus loin : l’activation répétée de 5‑HT2B sur les cellules interstitielles valvulaires peut engager des voies pro‑mitogènes, notamment Gq, phospholipase C, calcium intracellulaire et kinases ERK. Cette cascade soutient la vigilance sur l’exposition chronique.": "Repeated 5-HT2B activation on valvular interstitial cells may engage pro-mitogenic pathways including Gq, phospholipase C, intracellular calcium and ERK kinases. This cascade supports vigilance on chronic exposure.",
  "La surproduction de matrice extracellulaire, dont collagène, peut contribuer à fibrose valvulaire, perte d’élasticité, régurgitation et augmentation de la charge cardiaque. Le risque dépend de nombreux facteurs et ne se résume pas à une prise isolée.": "Extracellular matrix overproduction, including collagen, can contribute to valvular fibrosis, loss of elasticity, regurgitation and increased cardiac workload. Risk depends on many factors and not only one episode.",
  "L’absence de seuil humain précis impose un principe de prudence : réduire la fréquence et demander un avis médical en cas d’essoufflement inhabituel, douleur thoracique ou palpitations persistantes.": "With no clear human threshold, a precautionary principle applies: reduce frequency and seek medical advice for unusual breathlessness, persistent palpitations or chest pain.",
  "Descente et reconstruction": "Comedown and rebuilding",
  "La récupération se compte en jours, parfois en semaines, pas en une nuit magique.": "Recovery is counted in days, sometimes weeks, not one magic night.",
  "Après l’inondation de sérotonine, le cerveau doit refaire ses réserves. Il repart d’une matière première alimentaire, le tryptophane, qu’il transforme progressivement en 5‑HTP puis en sérotonine. Cette reconstruction demande du sommeil, de la nourriture et du temps.": "After the serotonin flood, the brain must rebuild its reserves. It starts from a dietary raw material, tryptophan, transformed gradually into 5-HTP and then serotonin. This rebuilding needs sleep, food and time.",
  "La nouvelle sérotonine doit ensuite être rangée dans des vésicules, puis transportée et utilisée correctement au bout des axones. Si les membranes ou les terminaisons ont subi du stress oxydatif, la récupération peut être plus longue. Ce n’est pas une faiblesse morale : c’est une contrainte biologique.": "New serotonin must then be stored in vesicles, transported and used correctly at axon endings. If membranes or terminals experienced oxidative stress, recovery may take longer. This is biology, not moral weakness.",
  "La partie chimique peut prendre plusieurs jours ; la récupération fonctionnelle complète, surtout après forte dose, chaleur, mélanges ou répétitions, peut prendre plusieurs semaines. C’est pour cela que les repères RdR parlent souvent de 4 à 6 semaines minimum entre sessions MDMA.": "The chemical part can take several days; full functional recovery, especially after high dose, heat, mixtures or repetition, can take several weeks. This is why harm-reduction references often mention at least 4–6 weeks between MDMA sessions.",
  "Si une nouvelle session arrive trop tôt, les réserves peuvent être incomplètes : l’effet empathique baisse, mais les effets stimulants et corporels peuvent rester présents. Cette dissociation entre plaisir et charge est un signal de vigilance important.": "If a new session arrives too early, reserves may be incomplete: the empathic effect drops, while stimulating and bodily effects can remain. That split between pleasure and load is an important vigilance signal.",
  "Pour aller plus loin : la récupération implique synthèse de novo de 5‑HT, restauration du stockage VMAT2, recyclage vésiculaire, transport axonal et réparation des terminaisons si stress oxydatif. Cette chaîne soutient la prudence sur la fréquence.": "Recovery involves de novo 5-HT synthesis, VMAT2 storage restoration, vesicle recycling, axonal transport and terminal repair if oxidative stress occurred. This chain supports frequency caution.",
  "En cas de chronicité, dopamine et métabolites réactifs peuvent participer à la formation de radicaux libres dans des environnements cellulaires vulnérables, avec atteinte des membranes et mitochondries. Cette information sert à expliquer la vigilance, pas à poser un diagnostic.": "With chronicity, dopamine and reactive metabolites may contribute to free radical formation in vulnerable cellular environments, affecting membranes and mitochondria. This information explains vigilance and is not a diagnosis.",
  "L’historique local repère les répétitions rapprochées afin de rendre visible la récupération, sans culpabiliser ni encourager une nouvelle prise.": "Local history detects repeated close sessions to make recovery visible, without blame or encouragement.",
  "5‑HT2A : une clé qui reste longtemps": "5-HT2A: a key that stays longer",
  "Le LSD ne crée pas des images dans les yeux : il modifie le traitement cortical de la perception.": "LSD does not create images in the eyes: it changes cortical processing of perception.",
  "La sérotonine est un messager naturel du cerveau. Le LSD ressemble assez à ce messager pour se fixer sur un récepteur appelé 5‑HT2A, très présent dans des zones corticales liées à la perception, aux émotions et aux associations d’idées. Cette localisation explique pourquoi plusieurs fonctions changent en même temps.": "Serotonin is a natural brain messenger. LSD resembles it enough to bind a receptor called 5-HT2A, highly present in cortical areas linked to perception, emotions and associations. That location explains why several functions shift together.",
  "Un récepteur fonctionne comme une serrure biologique. La sérotonine native se fixe puis se détache relativement vite ; le LSD peut activer le récepteur plus longtemps, comme une clé qui reste coincée. Cette durée prolongée participe à la longueur de l’expérience et impose de prévoir du temps.": "A receptor acts like a biological lock. Natural serotonin binds and leaves relatively quickly; LSD can activate the receptor longer, like a key stuck in the lock. This long engagement contributes to duration and requires planning time.",
  "Quand 5‑HT2A est activé dans le cortex, le cerveau relie plus facilement des sensations, souvenirs et pensées qui restent d’habitude séparés. C’est une des bases possibles des motifs, couleurs intensifiées, synesthésies ou associations très rapides. Ces perceptions demandent un cadre sécurisé.": "When 5-HT2A is activated in the cortex, the brain more easily connects sensations, memories and thoughts that normally remain separate. This may underlie patterns, intensified colours, synesthesia or rapid associations. These perceptions require a safe setting.",
  "Le plus fréquent n’est pas forcément une hallucination au sens psychiatrique strict, mais une perception transformée à partir de quelque chose de réel. Cette nuance aide à garder une pensée critique, mais ne remplace jamais la prudence sur le setting.": "Most of the time this is not necessarily hallucination in the strict psychiatric sense, but transformed perception based on something real. This nuance supports critical thinking but never replaces caution with setting.",
