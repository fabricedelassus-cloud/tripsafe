  "Pour aller plus loin : 5‑HT2A est fortement exprimé dans le cortex préfrontal et d’autres couches corticales impliquées dans cognition, perception et régulation émotionnelle. Cette distribution soutient la vigilance sur les antécédents psychiatriques.": "5-HT2A is strongly expressed in prefrontal cortex and other cortical layers involved in cognition, perception and emotional regulation. This distribution supports psychiatric-history vigilance.",
  "L’agonisme 5‑HT2A engage notamment des voies Gq/PLC/IP3/DAG et modifie l’équilibre glutamate/GABA, avec effets sur la connectivité thalamo‑corticale et corticale globale. Cette complexité rend l’expérience très dépendante du contexte.": "5-HT2A agonism engages Gq/PLC/IP3/DAG pathways and modifies glutamate/GABA balance, with effects on thalamo-cortical and global cortical connectivity. Context still matters strongly.",
  "Le schéma doit être lu comme une différence de durée et de mode d’activation entre sérotonine native et LSD, pas comme une preuve de sécurité individuelle.": "The diagram represents a difference in duration and mode of activation between native serotonin and LSD, not proof of individual safety.",
  "Thalamus : le filtre qui laisse trop passer": "Thalamus: the filter that lets too much through",
  "Le problème n’est pas un cerveau magique, mais un tri sensoriel modifié.": "The issue is not a magic brain, but altered sensory filtering.",
  "Ton cerveau reçoit beaucoup plus de signaux que ce que tu remarques : sons, lumière, sensations corporelles, souvenirs, pensées de fond. Le thalamus aide à trier ce flot, comme un filtre qui laisse passer l’utile et retient une partie du bruit. Quand ce filtre change, le monde peut sembler débordant.": "Your brain receives far more signals than you notice: sounds, light, body sensations, memories and background thoughts. The thalamus helps sort this flow like a filter that lets useful signals through and holds back noise.",
  "Sous LSD, le filtre peut devenir plus perméable. Un son banal, une lumière, une texture ou une sensation corporelle peuvent prendre beaucoup plus de place dans la conscience. C’est pour cela que musique, foule, fatigue et lumière forte comptent autant.": "Under LSD, the filter may become more permeable. A banal sound, light, texture or body sensation can take much more space in consciousness. That is why music, crowds, fatigue and strong light matter so much.",
  "La chimie derrière peut se comprendre simplement : le glutamate transmet et accélère, le GABA freine et calme. Si le système transmet davantage que ce qu’il freine, le cortex reçoit trop d’informations et tente de leur donner du sens. Cette surcharge appelle un setting simple et rassurant.": "The chemistry is simple to picture: glutamate transmits and accelerates, GABA brakes and calms. If the system transmits more than it brakes, the cortex receives too much information and tries to make meaning from it. A simple reassuring setting is safer.",
  "Changer de pièce, baisser la lumière, réduire le son ou parler moins peut réellement modifier l’expérience, parce que le filtre sensoriel est plus ouvert. Cette action sur le setting est une mesure de prudence.": "Changing room, lowering light, reducing sound or speaking less can really modify the experience because the sensory filter is more open. Changing setting is a caution tool.",
  "Pour aller plus loin : les modèles de gating thalamique décrivent une modification du filtrage sensoriel et des boucles thalamo‑corticales. Cette notion justifie la vigilance sur environnements bruyants ou imprévisibles.": "Thalamic gating models describe altered sensory filtering and thalamo-cortical loops. This supports caution in loud or unpredictable environments.",
  "L’activation 5‑HT2A peut augmenter la transmission glutamatergique et modifier le contrôle GABAergique, ce qui favorise un flux sensoriel plus large vers le cortex. Cette interprétation reste un modèle pédagogique, pas un diagnostic en temps réel.": "5-HT2A activation may increase glutamatergic transmission and modify GABAergic control, widening sensory flow to cortex. This is a pedagogical model, not real-time diagnosis.",
  "Le schéma représente donc un filtre dont davantage de trous sont ouverts : la prudence consiste à réduire le nombre de signaux entrants quand l’expérience devient trop forte.": "The diagram is a filter with more holes open: harm reduction means reducing incoming signals when the experience is too strong.",
  "Microdosage : intensité faible, durée pas forcément courte": "Microdosing: low intensity does not always mean short duration",
  "Réduire la dose réduit surtout l’intensité, pas toujours la durée ressentie dans la même proportion.": "Lowering dose mainly lowers intensity, not always duration proportionally.",
  "Une microdose est pensée comme très faible, mais cela ne veut pas dire que le système nerveux arrête d’être stimulé très vite. Pour le LSD, la demi-vie sanguine est souvent autour de quelques heures, mais la molécule peut rester engagée avec certains récepteurs plus longtemps que le ressenti ne le suggère. Cette différence impose de rester prudent.": "A microdose is intended to be very small, but that does not mean the nervous system stops being stimulated quickly. LSD blood half-life is often a few hours, but receptor engagement may outlast the felt effect. Stay cautious.",
  "Le leurre classique est de se sentir plus productif parce que la tâche semble plus agréable, plus nouvelle ou plus fluide. Ce ressenti ne prouve pas que les performances objectives — logique, calcul, précision — augmentent. Cette distinction évite de confondre plaisir de faire et efficacité réelle.": "A common trap is feeling more productive because a task feels more pleasant, new or fluid. This feeling does not prove that objective performance — logic, calculation, precision — improves. Distinguish enjoyment from real efficiency.",
  "La répétition chronique pose aussi une question cardiaque via le récepteur 5‑HT2B. L’image utile : une goutte d’eau répétée peut creuser une pierre plus sûrement qu’un seau d’eau versé une seule fois puis oublié. La fréquence est donc une donnée de vigilance.": "Repeated chronic exposure also raises a heart question via 5-HT2B. Useful image: a repeated drop of water can carve stone more than a single bucket poured once. Frequency is therefore a vigilance metric.",
  "Les études restent discutées et l’effet placebo peut être fort. Le suivi doit donc rester centré sur sommeil, anxiété, humeur, cœur, fréquence et capacité à fonctionner, sans transformer le microdosage en pratique banalisée.": "Studies remain debated and expectancy/placebo can be strong. Tracking should focus on sleep, anxiety, mood, heart, frequency and functioning, without normalizing microdosing.",
  "Pour aller plus loin : la demi-vie plasmatique du LSD ne capture pas entièrement le temps de résidence fonctionnel au niveau de certains récepteurs et circuits. Cette dissociation soutient la prudence sur conduite, sommeil et tâches à risque.": "LSD plasma half-life does not fully capture functional residence time at some receptors and circuits. This supports caution with driving, sleep and risky tasks.",
  "Les effets subjectifs sur humeur et motivation peuvent diverger des mesures objectives de performance cognitive, notamment en attention focalisée. Cette incertitude doit rester visible dans l’interface.": "Subjective mood/motivation effects can diverge from objective cognitive performance measures, especially focused attention. This uncertainty should remain visible.",
  "L’exposition répétée à des agonistes 5‑HT2B est discutée comme risque théorique de valvulopathie ; faute de seuil humain clair, le principe de prudence s’applique.": "Repeated exposure to 5-HT2B agonists is discussed as a theoretical valvulopathy risk; without clear human threshold, precaution applies.",
  "Valves : collagène, MMP et TIMP": "Valves: collagen, MMP and TIMP",
  "Un chantier de construction et de démolition qui peut perdre son équilibre.": "A construction and demolition site that can lose balance.",
  "Une valve cardiaque saine est souple : elle s’ouvre et se ferme comme une petite porte anti-retour. Si certaines cellules de valve reçoivent trop souvent un signal de croissance, elles peuvent produire trop de collagène, qui rigidifie la structure. Cette évolution est lente et mérite vigilance.": "A healthy heart valve is flexible: it opens and closes like a small one-way door. If some valve cells receive growth signals too often, they can produce too much collagen, stiffening the structure. This evolves slowly and deserves vigilance.",
  "Le corps possède des outils de nettoyage : les MMP, des enzymes qui coupent le collagène en excès. Il possède aussi des freins : les TIMP, qui empêchent les MMP de détruire trop de tissu. La récupération dépend de l’équilibre entre ces deux forces.": "The body has cleaning tools: MMP enzymes that cut excess collagen. It also has brakes: TIMP proteins that stop MMP from destroying too much tissue. Recovery depends on the balance between these forces.",
  "Si les TIMP dominent trop, le collagène reste et la valve garde sa rigidité. Si les MMP travaillent quand la stimulation cesse, une partie du collagène jeune peut être remodelée progressivement. Cette fenêtre de récupération n’est pas infinie.": "If TIMP dominates too much, collagen remains and the valve stays rigid. If MMP can work after stimulation stops, some young collagen can be gradually remodeled. This recovery window is not infinite.",
  "Avec le temps, le collagène peut se réticuler, c’est-à-dire se lier plus fortement, puis parfois se calcifier. Une fois que le tissu devient dur comme de la pierre, la récupération naturelle devient beaucoup plus limitée. Cette zone justifie la prudence sur les usages répétés.": "Over time collagen can cross-link, binding more strongly, and sometimes calcify. Once tissue becomes stone-like, natural recovery is much more limited. This supports caution around repeated use.",
  "Pour aller plus loin : les MMP sont des métalloprotéinases matricielles capables de dégrader des composants de matrice extracellulaire, tandis que les TIMP inhibent leur activité. Cette balance gouverne une partie du remodelage tissulaire.": "MMP are matrix metalloproteinases able to degrade extracellular matrix components, while TIMP inhibit their activity. This balance governs tissue remodeling.",
  "La fibrose valvulaire associe production de collagène, modification de la matrice, éventuelle réticulation puis calcification, ce qui rend le retour ad integrum de plus en plus difficile. Cette information reste une vigilance de long terme.": "Valvular fibrosis involves collagen production, matrix modification, possible cross-linking and calcification, making full return increasingly difficult. This is long-term vigilance.",
  "Le suivi de fréquence ne remplace pas une échographie ni un avis médical ; essoufflement, palpitations persistantes ou douleur thoracique justifient de consulter.": "Frequency tracking does not replace echocardiography or medical advice; unusual breathlessness, persistent palpitations or chest pain should be checked.",
  "Boucles, temps et intégration": "Loops, time and integration",
  "Pourquoi une pensée peut tourner et pourquoi les conclusions attendent souvent quelques jours.": "Why one thought can spin and why conclusions often need days.",
  "Sous LSD, des zones cérébrales qui communiquent peu d’habitude peuvent s’envoyer beaucoup plus de signaux. La pensée peut alors revenir sur le même point, tourner en boucle ou sauter vers des associations très éloignées. Une boucle de pensée n’est pas une vérité : c’est un état transitoire à accompagner avec prudence.": "Under LSD, brain areas that do not usually communicate much can send many more signals to one another. Thought may return to the same point, loop, or jump to distant associations. A thought loop is not truth: it is a temporary state to accompany cautiously.",
  "La perception du temps dépend de circuits qui comparent ce qui vient d’arriver avec ce qui arrive maintenant. Si ces circuits sont surchargés ou désynchronisés, une minute peut sembler très longue ou très courte. Il vaut mieux éviter les décisions importantes pendant cette phase.": "Time perception depends on circuits comparing what just happened with what is happening now. If these circuits are overloaded or desynchronized, a minute can feel very long or very short. Important decisions should wait.",
  "La zone sombre ou rémanente d’une timeline signifie : système nerveux encore sensible, perceptions encore modifiées, fatigue possible et jugement pas totalement revenu. Même si le pic baisse, la prudence sur conduite, messages importants ou déplacements reste nécessaire.": "The dark or after-effect zone on a timeline means the nervous system is still sensitive, perception may remain changed, fatigue can be present and judgment may not be fully back. Even if the peak falls, caution with driving, messages or travel remains needed.",
  "L’intégration commence après : images, pensées et émotions doivent se réordonner. Se précipiter vers une grande conclusion dans les 24 heures peut donner une certitude qui se transforme ensuite. Laisser quelques jours, dormir et parler avec une personne fiable fait partie de la vigilance.": "Integration starts afterwards: images, thoughts and emotions need to reorganize. Rushing into one big conclusion within 24 hours can create a certainty that later changes. Give it days, sleep and talk with someone reliable.",
  "Pour aller plus loin : l’hyperconnectivité fonctionnelle et la désorganisation temporaire de certaines hiérarchies prédictives peuvent favoriser boucles de pensée, distorsion temporelle et associations atypiques. Cette lecture doit rester contextualisée.": "Functional hyperconnectivity and temporary disruption of predictive hierarchies can favor loops, time distortion and atypical associations. This reading remains contextual.",
  "La mémoire immédiate et les comparateurs temporels participent à l’impression de durée ; leur perturbation peut expliquer dilatation ou compression du temps subjectif. Cette incertitude justifie de différer les décisions majeures.": "Immediate memory and temporal comparators contribute to subjective duration; their disruption can explain dilation or compression of time. Major decisions should be delayed.",
  "L’intégration est un processus cognitif et émotionnel post-effet : sommeil, mise en récit et soutien social réduisent le risque de surinterprétation ou d’anxiété persistante.": "Integration is a post-effect cognitive/emotional process: sleep, narrative and social support reduce overinterpretation or persistent anxiety risk.",
  "Prodrogue : psilocybine → psilocine": "Prodrug: psilocybin → psilocin",
  "Le corps transforme d’abord la molécule avant que l’effet principal arrive.": "The body transforms the molecule before the main effect arrives.",
  "La psilocybine est souvent appelée prodrogue : cela veut dire qu’elle est comme un paquet fermé. Le corps doit enlever un petit morceau chimique pour la transformer en psilocine, la forme qui agit surtout dans le cerveau. Cette étape explique la variabilité de montée et demande prudence.": "Psilocybin is often called a prodrug: like a closed package. The body must remove a chemical piece to turn it into psilocin, the form that mainly acts in the brain. This explains variable onset and requires caution.",
  "La digestion, le repas précédent, le stress, la forme du produit et la personne influencent cette transformation. Une montée lente ne veut pas dire que rien ne va se passer : elle peut simplement être retardée. C’est pour cela qu’il faut éviter de conclure trop vite.": "Digestion, previous meal, stress, product form and individual biology influence this conversion. A slow come-up does not mean nothing will happen; it may be delayed. Avoid judging too quickly.",
  "La psilocine ressemble chimiquement à la sérotonine et active notamment 5‑HT2A, ce qui modifie perception, émotions et associations d’idées. Le contexte devient donc aussi important que la dose déclarée.": "Psilocin chemically resembles serotonin and activates receptors such as 5-HT2A, changing perception, emotions and associations. Context becomes as important as declared dose.",
  "Même si la durée est souvent plus courte que le LSD, l’intensité psychologique peut être forte. Le suivi doit rester prudent, surtout en cas d’anxiété, de fatigue, de mélange ou d’antécédent psychiatrique.": "Even if duration is often shorter than LSD, psychological intensity can be strong. Tracking should remain cautious with anxiety, fatigue, mixtures or psychiatric history.",
  "Pour aller plus loin : la psilocybine est déphosphorylée en psilocine, tryptamine active avec agonisme sérotoninergique, notamment 5‑HT2A. Cette conversion explique une partie du délai d’action.": "Psilocybin is dephosphorylated into psilocin, an active tryptamine with serotonergic agonism, notably 5-HT2A. This conversion explains part of onset delay.",
  "La cinétique dépend de l’absorption digestive, du métabolisme individuel et de la matrice biologique du champignon. Cette variabilité rend le calcul de dose seulement indicatif.": "Kinetics depend on digestive absorption, individual metabolism and the biological mushroom matrix. Dose calculation remains indicative.",
  "La prudence porte sur l’identification, la concentration réelle, le set and setting et les mélanges, pas seulement sur le poids en grammes.": "Vigilance concerns identification, real concentration, set and setting and mixtures — not just grams.",
  "Tryptamine : proche du modèle naturel": "Tryptamine: close to the natural model",
  "Une clé plus flexible que le LSD, mais pas une garantie de sécurité.": "A more flexible key than LSD, but not a safety guarantee.",
  "La psilocine appartient aux tryptamines, une famille chimique qui ressemble à la structure de la sérotonine. Cette ressemblance lui permet de se fixer sur certains récepteurs de la sérotonine et de modifier l’expérience consciente. La proximité chimique ne signifie pas absence de risque.": "Psilocin belongs to tryptamines, a chemical family similar to serotonin. This resemblance lets it bind certain serotonin receptors and modify conscious experience. Chemical similarity does not mean no risk.",
  "Comparée au LSD, la psilocine est souvent décrite comme une clé plus simple et plus flexible. Elle ne reste pas coincée dans les récepteurs de la même manière, ce qui participe à une durée généralement plus courte. Cela reste une tendance, pas une garantie individuelle.": "Compared with LSD, psilocin is often described as a simpler, more flexible key. It does not stay stuck in receptors in the same way, contributing to a generally shorter duration. This is a trend, not an individual guarantee.",
  "Pour le cœur, le risque lié à la répétition chronique semble moins préoccupant avec la psilocine qu’avec le LSD — mais la prudence sur la fréquence reste valable. On ne remplace jamais cette prudence par une impression de douceur naturelle.": "For the heart, chronic repetition appears less concerning with psilocin than LSD, but frequency caution still applies. A “natural” feeling should not replace vigilance.",
  "Les risques principaux restent psychologiques et contextuels : anxiété, confusion, suggestibilité, mauvais setting ou mauvaise identification du produit. Garder un cadre simple reste la priorité.": "Main risks remain psychological and contextual: anxiety, confusion, suggestibility, bad setting or poor identification. A simple safe frame remains priority.",
  "Pour aller plus loin : psilocine est une tryptamine, distincte des lysergamides comme le LSD, avec des profils d’affinité et de résidence aux récepteurs différents. Cette comparaison soutient une prudence proportionnée.": "Psilocin is a tryptamine, distinct from lysergamides like LSD, with different affinity/residence profiles at receptors. This supports proportional caution.",
  "La discussion 5‑HT2B reste théorique et comparative : elle ne permet pas de conclure à un risque individuel précis sans données cliniques adaptées. La fréquence doit donc rester surveillée.": "The 5-HT2B discussion remains theoretical and comparative: it cannot determine an individual risk without clinical data. Frequency should still be monitored.",
  "La sécurité pratique dépend surtout de dose réelle, identification, antécédents psychiatriques, contexte et polyconsommation.": "Practical safety depends on real dose, identification, psychiatric history, context and polysubstance use.",
  "Puissance variable : espèce, lot, chapeau, pied": "Variable potency: species, batch, cap, stem",
  "Un gramme de champignon n’est pas une quantité exacte de psilocine.": "A gram of mushroom is not an exact amount of psilocin.",
  "Un champignon est un organisme vivant, pas un comprimé dosé en usine. Deux morceaux du même poids peuvent contenir des quantités différentes de psilocybine et de psilocine selon l’espèce, le lot, la culture et le séchage. Cette variabilité impose prudence.": "A mushroom is a living organism, not a factory-dosed tablet. Two pieces of the same weight can contain different amounts of psilocybin and psilocin depending on species, batch, cultivation and drying. This variability requires caution.",
  "Même dans un même lot, le chapeau et le pied peuvent ne pas avoir exactement la même concentration. Broyer un lot sec en poudre homogène avant de peser peut réduire certains écarts entre morceaux, mais ne donne pas la concentration exacte. La mesure reste indicative.": "Even within one batch, cap and stem can differ. Grinding a dry batch into a homogeneous powder before weighing can reduce differences between pieces, but does not give exact concentration. The measure remains indicative.",
  "Le frais contient beaucoup d’eau, donc grammes frais et grammes secs ne sont pas équivalents. Confondre les deux peut changer fortement la dose réelle. Cette différence doit être visible avant toute interprétation de niveau.": "Fresh mushrooms contain a lot of water, so fresh grams and dry grams are not equivalent. Confusing them can strongly change the real dose. This difference must be visible before interpreting level.",
  "Le risque d’identification est séparé du risque psychédélique : une erreur d’espèce peut exposer à une toxicité qui n’a rien à voir avec la psilocine. Si l’identification est incertaine, la prudence maximale s’impose.": "Identification risk is separate from psychedelic risk: a species error can expose to toxicity unrelated to psilocin. If identification is uncertain, maximum caution applies.",
  "Pour aller plus loin : la variabilité naturelle concerne espèce, souche, conditions de culture, partie du sporophore, conservation et homogénéisation du lot. Le poids sec ne remplace pas une quantification HPLC.": "Natural variability concerns species, strain, cultivation conditions, sporophore part, conservation and homogenization. Dry weight does not replace HPLC quantification.",
  "L’homogénéisation réduit la variance intra-lot mais n’identifie pas contaminants, espèces toxiques ni concentration absolue. Cette limite doit rester affichée.": "Homogenization reduces intra-batch variance but does not identify contaminants, toxic species or absolute concentration. This limit must remain visible.",
  "La vigilance porte sur l’identification mycologique, la forme sèche/fraîche, la dose, le contexte et les symptômes inhabituels.": "Vigilance concerns mycological identification, dry/fresh form, dose, context and unusual symptoms.",
  "NMDA : le bouchon du glutamate": "NMDA: the glutamate plug",
  "La kétamine coupe des canaux de communication plutôt qu’elle n’active la sérotonine.": "Ketamine cuts communication channels rather than activating serotonin.",
  "Le glutamate est le grand messager excitateur du cerveau. Il aide les neurones à transmettre des informations sur le corps, l’espace, le toucher, la douleur, le son et l’attention. Le comprendre avant de parler de kétamine évite de confondre dissociation et psychédélisme classique.": "Glutamate is the main excitatory messenger in the brain. It helps neurons transmit information about body, space, touch, pain, sound and attention. Understanding this avoids confusing dissociation with classic psychedelia.",
  "Un des grands passages du glutamate s’appelle le récepteur NMDA. C’est comme une porte-canal : quand le message arrive, la porte laisse passer le signal électrique et chimique. La stabilité de cette porte est importante pour la perception du corps.": "One major glutamate passage is the NMDA receptor. It is like a channel-door: when the message arrives, the door lets electrical and chemical signal pass. This door helps stabilize body perception.",
  "La kétamine se loge dans ce canal et le bouche de l’intérieur : c’est pour cela qu’on parle d’antagoniste non compétitif. Le glutamate peut être présent, mais le passage est partiellement bloqué. Cette déconnexion explique l’incoordination et impose prudence.": "Ketamine lodges inside this channel and blocks it from within: this is why it is called a non-competitive antagonist. Glutamate may be present, but passage is partly blocked. This disconnection explains incoordination and requires caution.",
  "Résultat : le cerveau reçoit moins clairement certains messages du corps. Le corps peut sembler loin, léger, étrange ou difficile à situer, et la douleur peut être moins bien perçue. C’est précisément ce qui rend les chutes, escaliers, eau et conduite dangereux.": "Result: the brain receives body messages less clearly. The body may feel far, light, strange or hard to locate, and pain may be less perceived. That is exactly why falls, stairs, water and driving are dangerous.",
  "Pour aller plus loin : la kétamine bloque le canal NMDA de manière non compétitive, perturbant intégration sensorielle, proprioception, douleur et réseaux corticaux. Cette perturbation nécessite un environnement physiquement sécurisé.": "Ketamine blocks the NMDA channel non-competitively, disrupting sensory integration, proprioception, pain and cortical networks. This requires a physically safe environment.",
  "À dose sub-anesthésique, le blocage est partiel : certains signaux comme la musique peuvent rester saillants tandis que le corps devient flou. Cette dissociation sélective augmente le risque de mauvais jugement moteur.": "At sub-anesthetic doses, blockade is partial: signals such as music can remain salient while the body becomes blurry. This selective dissociation increases motor-judgment risk.",
  "Contrairement à de nombreux sédatifs, la kétamine peut aussi augmenter fréquence cardiaque et pression artérielle via stimulation sympathique et noradrénaline ; cette vigilance cardio doit rester visible.": "Unlike many sedatives, ketamine can also raise heart rate and blood pressure via sympathetic/noradrenergic stimulation; cardio vigilance remains visible.",
  "Volume du dosage : distorsion → dissociation": "Dose volume: distortion → dissociation",
  "Ce n’est pas un interrupteur, c’est un variateur.": "It is not a switch, it is a dimmer.",
  "À faible intensité, une partie des messages continue à passer : la musique, la lumière ou l’ambiance peuvent rester très présentes, mais le corps semble ralenti ou bizarre. La dissociation ne touche pas toutes les fonctions en même temps. Cette situation peut donner une fausse impression de contrôle.": "At low intensity, some messages still pass: music, light or atmosphere can remain very present, while the body feels slowed or strange. Dissociation does not affect every function at once, which can create a false sense of control.",
  "Quand l’intensité augmente, les repères corporels deviennent moins fiables : équilibre, position des membres, distance, douleur et coordination. La personne peut avoir l’impression de flotter ou de regarder son corps de loin. La prudence physique devient prioritaire.": "As intensity rises, body landmarks become less reliable: balance, limb position, distance, pain and coordination. The person may feel floating or watching the body from afar. Physical caution becomes priority.",
  "À très forte dissociation, la frontière entre soi et l’environnement peut devenir floue. Ce n’est pas forcément agréable, contrôlable ni facile à interrompre. Le bon réflexe est de réduire les déplacements et de rester dans un espace bas et sûr.": "At very deep dissociation, the boundary between self and environment can blur. It is not necessarily pleasant, controllable or easy to interrupt. The safest reflex is to reduce movement and stay in a low safe space.",
  "La règle pratique : éviter escaliers, eau, conduite, flammes, objets tranchants et déplacements seuls. Une personne sobre à proximité est une mesure de vigilance, pas un luxe.": "Practical rule: avoid stairs, water, driving, flames, sharp objects and moving alone. A sober person nearby is a vigilance measure, not a luxury.",
  "Pour aller plus loin : l’antagonisme NMDA module progressivement intégration somatosensorielle, proprioception, réseau de conscience de soi et traitement auditif. Les différents réseaux ne basculent pas simultanément, ce qui peut préserver certaines perceptions.": "NMDA antagonism progressively modulates somatosensory integration, proprioception, self-consciousness networks and auditory processing. Networks do not switch simultaneously, preserving some perceptions.",
  "L’analgésie et l’ataxie rendent les blessures plus probables et moins immédiatement ressenties. Cette dissociation entre dommage corporel et signal douleur impose prudence.": "Analgesia and ataxia make injuries more likely and less immediately felt. This split between injury and pain signal requires caution.",
  "Le niveau de risque dépend de dose, tolérance, voie, environnement et dépresseurs associés ; cette lecture ne doit pas être interprétée comme un seuil de sécurité.": "Risk depends on dose, tolerance, route, environment and associated depressants; this reading must not be interpreted as a safety threshold.",
  "Vessie : urothélium, inflammation, fibrose": "Bladder: urothelium, inflammation, fibrosis",
  "La toxicité signature de la répétition est urinaire.": "The signature toxicity of repetition is urinary.",
  "La kétamine et certains métabolites sont éliminés dans l’urine. La vessie stocke cette urine, donc sa paroi reste en contact avec ces produits plus longtemps que de simples tuyaux où l’urine circule. Cette durée de contact explique la vigilance urinaire.": "Ketamine and some metabolites are eliminated in urine. The bladder stores this urine, so its wall stays in contact with these products longer than tubes where urine simply flows. Contact time explains urinary vigilance.",
  "La couche interne de la vessie s’appelle l’urothélium. Elle fonctionne comme un revêtement étanche qui protège les tissus sensibles. Si ce revêtement est irrité à répétition, l’urine peut devenir douloureuse pour les tissus dessous. Les douleurs urinaires ne sont pas un détail.": "The inner layer of the bladder is the urothelium. It acts like a waterproof coating protecting sensitive tissue underneath. If irritated repeatedly, urine can become painful for the tissue below. Urinary pain is not a detail.",
  "Le corps essaie de réparer l’inflammation avec du tissu cicatriciel. Si ce processus devient chronique, la vessie peut perdre de l’élasticité, stocker moins d’urine et déclencher des envies très fréquentes. Cette fibrose peut devenir partiellement irréversible.": "The body tries to repair inflammation with scar tissue. If chronic, the bladder can lose elasticity, hold less urine and trigger very frequent urges. This fibrosis may become partly irreversible.",
  "Il existe une fenêtre de récupération si les signaux sont pris tôt : réduire l’exposition et consulter peut éviter que l’inflammation s’installe. Brûlures, sang, douleurs, réveils nocturnes ou besoin d’uriner très souvent doivent être traités comme signaux médicaux.": "There is a recovery window if signals are taken early: reducing exposure and consulting can prevent inflammation from settling. Burning, blood, pain or frequent urination deserve medical advice.",
  "Pour aller plus loin : les atteintes décrites associent toxicité urothéliale, inflammation chronique, apoptose, fibrose, baisse de capacité vésicale et parfois retentissement sur le haut appareil urinaire. La fréquence cumulée est un facteur de vigilance central.": "Clinical pictures include urothelial injury, chronic inflammation, apoptosis, fibrosis, reduced bladder capacity and sometimes upper urinary tract involvement. This requires medical vigilance.",
  "La récupération dépend du niveau d’atteinte : irritation précoce, inflammation chronique, fibrose, rétraction, puis complications. Plus la matrice cicatricielle s’installe, plus le retour complet devient incertain.": "Frequency and cumulative exposure are central. Early urinary symptoms are harm-reduction warning signs, not normal side effects to ignore.",
  "Le suivi local peut signaler la répétition, mais symptômes urinaires persistants ou hématurie relèvent d’un avis médical.": "Recovery may be partial if fibrosis and capacity loss are established; this supports early consultation.",
  "Mélanges sédatifs : respiration, vomissement, mémoire": "Sedative mixtures: breathing and vomiting",
  "Le danger n’est pas seulement d’être plus dissocié.": "Ketamine + alcohol/GHB/opioids is a red zone.",
  "La kétamine peut rendre somnolent, confus, maladroit et moins sensible à la douleur. L’alcool, le GHB, les benzodiazépines ou les opiacés peuvent aussi réduire vigilance et respiration. Ensemble, ces effets peuvent se superposer dangereusement.": "Ketamine can already cause sleepiness, confusion, clumsiness and reduced pain perception. Alcohol, GHB, benzodiazepines or opioids can also reduce alertness and breathing.",
  "Le risque concret est de tomber, vomir sans bien se protéger, ne pas sentir une blessure, oublier ce qui a été pris, ou respirer trop lentement. Ce n’est pas un simple effet plus fort : c’est un changement de niveau de danger.": "Combining them is not just “being more high”. It can mean vomiting without protecting the airway, falling, not feeling an injury, or breathing too slowly.",
  "Si une personne est inconsciente mais respire normalement, la position latérale de sécurité est prioritaire. Si la respiration est lente, irrégulière, bruyante ou absente, il faut appeler le 112. Cette consigne doit rester visible.": "The Mix chart must display these associations with very visible icons. If someone is unconscious but breathing: recovery position. If breathing is abnormal: call 112.",
  "Le chart Mélanges doit donc afficher ces associations en rouge ou critique. Le ton peut rester friendly, mais la lecture du risque doit être sans ambiguïté.": "The product tone is friendly but clear: explain the mechanism so the safer decision becomes obvious.",
  "Pour aller plus loin : les dépresseurs du système nerveux central peuvent additionner sédation, amnésie, ataxie, risque d’aspiration et dépression respiratoire. Cette combinaison relève d’une vigilance élevée.": "Additive ataxia, amnesia, sedation, possible respiratory depression and aspiration risk in case of vomiting.",
  "La priorité clinique est conscience, ventilation, position de sécurité, température et informations sur les substances prises. Cette hiérarchie doit primer sur toute discussion théorique.": "Respiratory monitoring comes before discussion: consciousness, breathing, recovery position, emergency call if abnormal.",
  "L’absence de douleur ou de souvenir fiable ne rassure pas : elle peut au contraire masquer l’accident.": "Mixtures with depressants are therefore critical in the interaction UX.",
  "GABA et NMDA : freins renforcés, mémoire fragilisée": "GABA and NMDA: stronger brakes, fragile memory",
  "Pourquoi l’alcool détend, désorganise et peut effacer l’enregistrement des souvenirs.": "Why alcohol relaxes, disorganizes and can prevent memories from being recorded.",
  "L’alcool n’a pas une seule serrure précise. Il s’insère dans plusieurs systèmes en même temps, notamment GABA_A, le grand frein du cerveau. Quand ce frein reste ouvert plus longtemps, les neurones déclenchent moins facilement leurs signaux : détente, lenteur, ataxie et parole pâteuse viennent du même mécanisme. Cette lecture sert à comprendre la vigilance.": "Alcohol has no single precise lock. It inserts itself into several systems at once, especially GABA_A, the brain’s main brake. When this brake stays open longer, neurons fire less easily: relaxation, slowness, ataxia and slurred speech come from the same mechanism. This reading supports vigilance.",
  "En parallèle, l’alcool bloque les récepteurs NMDA, qui participent à l’entrée du calcium nécessaire à la mémoire dans l’hippocampe. Le cortex peut encore percevoir la scène, mais l’hippocampe ne l’enregistre plus correctement : c’est le principe du blackout alcoolique. Un blackout est un signal rouge de prudence.": "At the same time, alcohol blocks NMDA receptors, which participate in calcium entry needed for memory in the hippocampus. The cortex may still perceive the scene, but the hippocampus does not record it correctly: this is the blackout mechanism. A blackout is a red warning signal.",
  "Les récepteurs extra-synaptiques GABA, liés au bruit de fond neuronal, participent à la somnolence lourde. Ce n’est pas seulement “être détendu” : c’est une dépression globale du système nerveux central, avec vigilance sur respiration et mélanges.": "Extrasynaptic GABA receptors, linked to background neural noise, contribute to heavy sleepiness. This is not just “being relaxed”: it is global depression of the central nervous system, with breathing and mixture vigilance.",
  "Pour aller plus loin : potentialisation GABA_A avec entrée de chlorure, hyperpolarisation neuronale et inhibition tonique extra-synaptique. Cette inhibition explique la sédation et impose prudence.": "GABA_A potentiation with chloride entry, neuronal hyperpolarization and tonic extrasynaptic inhibition explains sedation and requires caution.",
  "Le blocage NMDA perturbe la LTP hippocampique, mécanisme de consolidation mnésique. Le blackout est donc un défaut d’encodage, pas une simple récupération impossible.": "NMDA blockade disrupts hippocampal LTP, a memory-consolidation mechanism. Blackout is an encoding failure, not simple forgetting.",
  "Dopamine via endorphines : l’inhibition de l’inhibition": "Dopamine via endorphins: inhibition of inhibition",
  "Pourquoi l’euphorie initiale peut masquer une dépression du SNC.": "Why early euphoria can hide CNS depression.",
  "L’alcool peut donner une impression de chaleur sociale et de récompense, mais il ne pousse pas la dopamine de la même manière qu’un stimulant classique. Il stimule des endorphines, qui touchent des récepteurs opioïdes sur des interneurones GABA dans l’aire tegmentale ventrale. Cette explication doit rester une information de prudence.": "Alcohol can create social warmth and reward, but it does not raise dopamine like a classic stimulant. It stimulates endorphins, which act on opioid receptors on GABA interneurons in the ventral tegmental area. This explanation is for vigilance.",
  "Ces interneurones GABA freinent normalement les neurones dopaminergiques. Quand les endorphines font taire ce frein, la dopamine est libérée par inhibition de l’inhibition. On peut se sentir plus léger ou plus confiant alors que les fonctions de contrôle se dégradent.": "These GABA interneurons normally brake dopaminergic neurons. When endorphins silence that brake, dopamine is released through inhibition of inhibition. One may feel lighter or more confident while control functions degrade.",
  "Le cortex préfrontal, zone de planification et de retenue, est sensible à la sédation GABAergique : il se met en retrait tôt. Le paradoxe est donc clair : on se sent parfois stimulé parce que la retenue baisse, alors que le cerveau est globalement ralenti. Cette désinhibition impose vigilance.": "The prefrontal cortex, involved in planning and restraint, is sensitive to GABAergic sedation and withdraws early. The paradox is clear: you may feel stimulated because restraint drops, while the brain is globally slowed. This disinhibition calls for vigilance.",
  "Pour aller plus loin : la désinhibition dopaminergique dans l’ATV passe par des mécanismes opioïdes endogènes modulant les interneurones GABA. L’euphorie ne neutralise pas la dépression du SNC.": "Dopaminergic disinhibition in the VTA can pass through endogenous opioid mechanisms modulating GABA interneurons. Euphoria does not neutralize CNS depression.",
  "L’atteinte préfrontale précoce altère inhibition comportementale, consentement, anticipation et décision. Cette zone impose prudence sociale et physique.": "Early prefrontal impairment alters behavioral inhibition, consent, anticipation and decision-making. Social and physical caution are required.",
  "Foie : ADH, acétaldéhyde et les trois stades": "Liver: ADH, acetaldehyde and the path to cirrhosis",
  "Pourquoi l’alcool ne s’élimine pas plus vite avec de la volonté.": "The liver does not simply “filter” alcohol: it transforms it into a toxic intermediate first.",
  "Le foie transforme l’éthanol avec l’enzyme ADH en acétaldéhyde. L’acétaldéhyde est très réactif, inflammatoire et toxique ; il peut se lier à des protéines et à l’ADN. Il doit ensuite être neutralisé par ALDH2 en acétate. Si le flux dépasse les capacités, la vigilance hépatique augmente.": "The liver first transforms ethanol into acetaldehyde with ADH. Acetaldehyde is much more reactive and toxic than ethanol: it drives inflammation and can bind biological structures. ALDH2 then transforms it into acetate, which is easier to handle. If this chain is overwhelmed, vigilance rises.",
  "L’alcool suit surtout une cinétique d’ordre zéro : le foie élimine une quantité presque fixe par heure, environ 0,10 à 0,15 g/L/h selon les personnes. Café, douche froide ou sommeil court ne rendent pas le sang sobre plus vite. Cette limite doit rester visible pour éviter conduite et décisions à risque.": "When exposure is massive or chronic, CYP2E1 is recruited. It helps burn alcohol but produces many reactive oxygen species, free radicals that attack membranes and mitochondria. This is not a harmless shortcut.",
  "En exposition massive ou chronique, CYP2E1 peut prendre le relais et générer beaucoup de radicaux libres. En même temps, la dégradation vole du NAD+ : les graisses s’accumulent d’abord dans le foie (stéatose), puis l’inflammation peut progresser vers hépatite alcoolique, fibrose et cirrhose. Ce continuum impose prudence et suivi médical.": "Alcohol metabolism consumes NAD+, slowing fat burning in liver cells. Fat accumulates: steatosis. Alcohol also weakens intestinal junctions, letting bacterial signals reach the liver and inflame it. Over time, collagen scars replace living tissue: cirrhosis.",
  "Pour aller plus loin : ADH produit l’acétaldéhyde, ALDH2 le convertit en acétate, et CYP2E1 augmente les ROS en exposition élevée ou chronique. Cette voie métabolique soutient la vigilance toxique.": "ADH → acetaldehyde then ALDH2 → acetate; high flux increases acetaldehyde exposure. CYP2E1 induction generates ROS and oxidative stress.",
  "Le ratio NADH/NAD+ perturbe beta-oxydation et favorise stéatose ; endotoxémie intestinale et inflammation hépatique participent à la progression vers fibrose/cirrhose.": "NAD+ depletion shifts hepatic redox state, favoring steatosis. Gut-liver axis and endotoxemia contribute to alcoholic hepatitis. Fibrogenesis and collagen deposition can progress toward cirrhosis.",
  "Sevrage : excitotoxicité, Delirium Tremens, urgence médicale": "Withdrawal: from excitotoxicity to Delirium Tremens",
  "Le sevrage alcoolique sévère peut être mortel et ne se gère pas seul.": "Alcohol is one of the substances whose withdrawal can kill without medical care.",
  "Quand l’alcool est présent tous les jours, le cerveau s’adapte : il réduit certains freins GABA et augmente certains moteurs NMDA pour continuer à fonctionner malgré la sédation. Cette adaptation peut devenir dangereuse à l’arrêt, donc prudence médicale.": "With daily exposure, the brain adapts: it reduces some GABA braking and increases NMDA engines to function despite alcohol. The person may seem “adapted”, but the system is actually reconfigured.",
  "Si l’arrêt est brutal après une consommation quotidienne prolongée, le frein alcoolique disparaît mais les moteurs restent trop nombreux. Le glutamate peut alors provoquer un orage excitateur : tremblements, sueurs, tachycardie, anxiété, convulsions, confusion et Delirium Tremens. C’est une urgence médicale.": "If alcohol suddenly stops, the chemical brake disappears while the extra engines remain. Glutamate can surge without enough braking, calcium floods neurons and excitotoxicity may occur. This can produce tremors, seizures, confusion and Delirium Tremens.",
  "Le kindling signifie que chaque cycle de sevrage peut aggraver les suivants. Si une personne arrête l’alcool après une consommation quotidienne prolongée et présente tremblements intenses, confusion, hallucinations, sueurs ou convulsions : appeler le 15 ou aller aux urgences immédiatement. Ne pas gérer seul.": "Delirium Tremens combines hallucinations, disorientation, agitation, sweating, tachycardia and vital instability. This is a medical emergency, not a situation to manage alone.",
  "Pour aller plus loin : downregulation GABAergique et upregulation NMDA exposent à excitotoxicité glutamatergique lors du retrait d’éthanol. Les benzodiazépines médicalement encadrées sont utilisées pour contrôler ce risque.": "Chronic alcohol exposure can induce GABAergic downregulation and NMDA upregulation. Abrupt cessation exposes unopposed glutamatergic excitation, calcium influx and excitotoxicity.",
  "Delirium Tremens associe dysautonomie, hallucinations, désorientation et risque vital. Cette situation relève d’une prise en charge médicale urgente.": "Kindling means repeated withdrawal cycles can worsen later episodes. Benzodiazepine-supervised medical management is standard in severe withdrawal.",
  "Wernicke-Korsakoff : l’amnésie par carence": "Wernicke-Korsakoff: amnesia through deficiency",
  "Quand la vitamine B1 manque, certains neurones n’ont plus de carburant.": "A vitamin B1 deficit can injure memory circuits irreversibly.",
  "L’alcoolisme chronique peut bloquer l’absorption et l’utilisation de la vitamine B1, aussi appelée thiamine. Sans B1, les neurones ont du mal à métaboliser le glucose, leur carburant. Ce n’est pas une fatigue morale : c’est une asphyxie métabolique, donc vigilance.": "Chronic alcohol exposure can block vitamin B1 absorption and use. Without B1, neurons struggle to metabolize glucose, their main fuel. This is like a power failure in cells that need constant energy.",
  "Les zones de la mémoire comme les corps mamillaires et le thalamus peuvent être touchées. L’encéphalopathie de Wernicke peut donner confusion, ataxie et troubles oculaires ; si elle n’est pas prise en charge, elle peut évoluer vers Korsakoff, avec amnésie permanente et fabulations.": "The mammillary bodies and thalamus, both involved in memory, are especially vulnerable. Wernicke encephalopathy can cause confusion, eye movement problems and ataxia. This is urgent and treatable only if recognized early.",
  "Ces lésions peuvent devenir irréversibles. Confusion, marche très instable ou troubles visuels dans un contexte d’alcool chronique imposent une orientation médicale rapide.": "If not treated, Korsakoff syndrome can follow: lasting amnesia with confabulation, where the brain fills memory gaps without intending to lie. Some lesions can be irreversible.",
  "Pour aller plus loin : déficit en thiamine altère le métabolisme glucidique neuronal et touche préférentiellement corps mamillaires, thalamus et circuits mnésiques. Cette atteinte impose une vigilance clinique.": "Thiamine deficiency impairs carbohydrate metabolism and neuronal energy production, damaging diencephalic memory circuits such as mammillary bodies and thalamus.",
  "Wernicke est une urgence car une supplémentation précoce peut limiter l’évolution vers Korsakoff.": "Wernicke encephalopathy is an emergency; delayed treatment can progress to Korsakoff syndrome with persistent amnestic disorder.",
  "Triple bouchon : DAT, NET, SERT bloqués simultanément": "Triple block: DAT, NET and SERT all blocked",
  "La cocaïne bouche les récupérateurs au lieu d’inverser le flux comme la MDMA.": "Cocaine blocks recyclers instead of reversing the flow like MDMA.",
  "La cocaïne bloque simultanément DAT, NET et SERT : les récupérateurs de dopamine, noradrénaline et sérotonine. Elle ne les inverse pas comme la MDMA ; elle les bouche. Les messagers restent dans la synapse et continuent à stimuler les récepteurs. Cette accumulation impose prudence.": "Cocaine blocks DAT, NET and SERT at the same time: the recyclers for dopamine, noradrenaline and serotonin. It does not reverse them like MDMA; it plugs them. Messengers stay in the synapse and keep stimulating receptors. This accumulation requires caution.",
  "DAT bloqué signifie dopamine accumulée dans le noyau accumbens : le cerveau reçoit un signal de récompense intense sans effort réel. Cela peut donner euphorie, confiance, mégalomanie temporaire et envie de recommencer, mais ce ressenti ne protège pas le corps.": "Blocked DAT means dopamine accumulates in the nucleus accumbens: the brain receives an intense reward signal without real effort. This can produce euphoria, confidence, temporary grandiosity and desire to repeat, but the feeling does not protect the body.",
  "NET bloqué signifie noradrénaline élevée : pupilles dilatées, alerte, tension et charge cardiaque. SERT ajoute confiance et désinhibition. La combinaison des trois explique la montée, mais aussi le risque aigu.": "Blocked NET means high noradrenaline: dilated pupils, alertness, blood pressure and cardiac load. SERT adds confidence and disinhibition. The three together explain the rush, but also acute risk.",
  "Pour aller plus loin : inhibition DAT/NET/SERT augmente monoamines synaptiques, avec forte composante mésolimbique et adrénergique. Cette pharmacologie soutient la vigilance cardiovasculaire.": "DAT/NET/SERT inhibition increases synaptic monoamines, with strong mesolimbic and adrenergic components. This pharmacology supports cardiovascular vigilance.",
  "La différence bouchon vs inverseur est essentielle : la cocaïne empêche la recapture, la MDMA agit comme substrat et favorise l’efflux. Les deux imposent prudence mais par des mécanismes différents.": "The plug vs reversal distinction is essential: cocaine prevents reuptake, MDMA acts as a substrate and promotes efflux. Both require caution through different mechanisms.",
  "Glutamate et craving : le danger qui dure des mois": "Glutamate and craving: the danger that lasts months",
  "Le plaisir est dopaminergique, mais le craving persistant implique le glutamate.": "Pleasure is dopaminergic, but persistent craving involves glutamate.",
  "Après l’effet, le craving n’est pas seulement une envie de plaisir. L’usage répété peut dérégler des systèmes de nettoyage du glutamate, notamment xCT et GLT‑1 sur les astrocytes. Le cerveau devient plus sensible aux indices associés à la cocaïne, donc prudence.": "After the effect, craving is not only a desire for pleasure. Repeated use can disrupt glutamate cleanup systems, especially xCT and GLT-1 on astrocytes. The brain becomes more sensitive to cues linked to cocaine, so caution is needed.",
  "Des mois après l’arrêt, voir un sachet, une surface blanche, un lieu ou un message peut déclencher un orage de glutamate. Ce signal peut court-circuiter le cortex préfrontal, la zone qui aide à freiner les impulsions. Ce mécanisme explique pourquoi l’envie peut sembler plus forte que la décision.": "Months after stopping, seeing a bag, a white surface, a place or a message can trigger a glutamate storm. This signal can short-circuit the prefrontal cortex, the area that helps brake impulses. The mechanism explains why craving can feel stronger than decision.",
  "La dopamine explique le renforcement immédiat ; le glutamate explique une partie du rappel compulsif. Nommer ce mécanisme aide à ne pas confondre craving et faiblesse morale, mais la vigilance reste nécessaire.": "Dopamine explains immediate reinforcement; glutamate explains part of compulsive recall. Naming this mechanism helps avoid moralizing craving, but vigilance remains necessary.",
  "Pour aller plus loin : l’altération xCT/GLT‑1 des astrocytes réduit l’homéostasie glutamatergique et favorise la reinstatement cue-induced. Cette plasticité justifie un suivi de long terme.": "Altered astrocytic xCT/GLT-1 reduces glutamate homeostasis and promotes cue-induced reinstatement. This plasticity justifies long-term support.",
  "Le craving implique circuits préfronto-accumbens, mémoire associative et glutamate ; il ne se résume pas à la concentration sanguine aiguë.": "Craving involves prefrontal-accumbens circuits, associative memory and glutamate; it is not just acute blood concentration.",
  "Cœur : paradoxe ischémique et arrêt électrique": "Heart: ischemic paradox and electrical arrest",
  "Le cœur demande plus d’oxygène pendant que l’apport peut diminuer.": "The heart asks for more oxygen while supply can decrease.",
  "La cocaïne crée un paradoxe dangereux : elle stimule Bêta‑1, donc le cœur bat plus vite et demande plus d’oxygène, mais elle stimule aussi Alpha‑1, donc les coronaires peuvent se resserrer par vasospasme. Plus de demande, moins d’offre : c’est un chemin vers l’infarctus. Douleur thoracique = 112.": "Cocaine creates a dangerous paradox: it stimulates Beta-1, so the heart beats faster and demands more oxygen, but it also stimulates Alpha-1, so coronary arteries can tighten through vasospasm. More demand, less supply: a path to heart attack. Chest pain = 112.",
  "La cocaïne peut aussi bloquer des canaux électriques du cœur, notamment sodium et hERG. Cela peut allonger le QTc, désorganiser le rythme et conduire à une fibrillation ventriculaire. Ce risque peut survenir même sans grande quantité déclarée, donc prudence.": "Cocaine can also block electrical channels in the heart, including sodium and hERG. This can prolong QTc, disorganize rhythm and lead to ventricular fibrillation. This can occur even without a large declared amount, so stay cautious.",
  "Les vaisseaux du cerveau sont aussi concernés : endothélium abîmé, plaquettes plus collantes, tension très haute. AVC ischémique ou hémorragique deviennent possibles. Faiblesse d’un côté, trouble de la parole ou confusion = urgence.": "Brain vessels are also involved: damaged endothelium, stickier platelets and very high blood pressure. Ischemic or hemorrhagic stroke becomes possible. One-sided weakness, speech trouble or confusion = emergency.",
  "Pour aller plus loin : tachycardie et inotropie augmentent la demande myocardique en O2, tandis que vasospasme coronaire et thrombose réduisent l’offre. Cette opposition est la base du paradoxe ischémique.": "Tachycardia and inotropy increase myocardial O2 demand, while coronary vasospasm and thrombosis reduce supply. This opposition is the ischemic paradox.",
  "Blocage Na+ et hERG peut perturber conduction et repolarisation, avec risque d’arythmie maligne. La vigilance clinique prime sur l’interprétation de dose.": "Na+ and hERG blockade can disturb conduction and repolarization, with malignant arrhythmia risk. Clinical vigilance outranks dose interpretation.",
  "Lévamisole : l’adultérant qui détruit l’immunité": "Levamisole: the adulterant that damages immunity",
  "Un risque fréquent, invisible à l’œil, et documenté cliniquement.": "A frequent risk, invisible to the eye and clinically documented.",
  "Une grande partie de la cocaïne disponible peut être coupée au lévamisole, un antiparasitaire vétérinaire. Le problème n’est pas seulement la pureté ou la puissance : le lévamisole peut attaquer le système immunitaire. Cette information justifie une vigilance forte et l’analyse des produits.": "A large share of street cocaine may be cut with levamisole, a veterinary antiparasitic. The issue is not only purity or strength: levamisole can attack the immune system. This justifies strong vigilance and product checking.",
  "Il peut provoquer une agranulocytose : certains globules blancs chutent, ce qui rend les infections beaucoup plus dangereuses. Fièvre, angine sévère, plaies inhabituelles ou fatigue intense après exposition doivent être pris au sérieux.": "It can cause agranulocytosis: some white blood cells drop, making infections much more dangerous. Fever, severe sore throat, unusual wounds or intense fatigue after exposure should be taken seriously.",
  "Il peut aussi déclencher une vascularite auto-immune avec purpura rétiforme et nécrose, notamment oreilles, nez ou peau. Ce n’est pas un risque théorique : c’est documenté. Produit non analysé = prudence renforcée. Un test réactif (Marquis, Scott, Mandelin) ne garantit pas l’absence de tous les adultérants, mais permet de détecter les plus fréquents. C’est une des mesures de réduction des risques les plus concrètes disponibles avant toute prise de cocaïne. Reste prudent.": "It can also trigger autoimmune vasculitis with retiform purpura and necrosis, especially ears, nose or skin. This is not theoretical: it is clinically documented. Untested product = stronger caution. A reagent test (Marquis, Scott, Mandelin) does not guarantee the absence of all adulterants, but can detect the most common ones. It is one of the most concrete harm-reduction steps available before any cocaine use. Stay cautious.",
  "Pour aller plus loin : le lévamisole est associé à agranulocytose et vascularites ANCA positives, avec atteintes cutanées nécrotiques. Cette toxicité est indépendante de l’effet stimulant recherché.": "Levamisole is associated with agranulocytosis and ANCA-positive vasculitis with necrotic skin lesions. This toxicity is independent of the desired stimulant effect.",
  "L’analyse de produit ne rend pas l’usage sûr, mais elle réduit l’angle mort sur adultérants. Cette nuance doit rester visible.": "Product checking does not make use safe, but it reduces the blind spot around adulterants. Keep that nuance visible.",
  "Hiver dopaminergique : anhédonie et récupération longue": "Dopaminergic winter: anhedonia and long recovery",
  "La redescente peut devenir une saison biologique, pas seulement un lendemain difficile.": "The comedown can become a biological season, not just a difficult next day.",
  "Avec l’usage chronique, le cerveau peut réduire la sensibilité de certains récepteurs D2. Ce qui donnait plaisir naturellement — manger, voir des amis, réussir une tâche — paraît fade. On appelle cela anhédonie : le monde devient gris, et cela impose vigilance.": "With chronic use, the brain may reduce sensitivity of D2 receptors. Things that normally give pleasure — eating, seeing friends, completing a task — feel flat. This is anhedonia: the world turns grey, and vigilance is needed.",
  "La cocaïne modifie aussi l’expression de gènes liés à l’addiction. ΔFosB peut s’accumuler et ordonner des changements de connexions, tandis que des micro-ischémies peuvent toucher les zones préfrontales qui freinent les impulsions. Ce recâblage rend le choix plus difficile.": "Cocaine also changes expression of addiction-related genes. DeltaFosB can accumulate and order connection changes, while micro-ischemia can affect prefrontal areas that brake impulses. This rewiring makes choice harder.",
  "La récupération dopaminergique peut prendre de longs mois, parfois 14 à 24 mois selon les observations discutées pour les récepteurs D2. Ce chiffre n’est pas une prédiction individuelle, mais il rappelle que repos, aide et temps sont des outils de prudence.": "Dopaminergic recovery can take many months, sometimes 14–24 months in observations discussed for D2 receptors. This number is not an individual prediction, but it reminds that time, rest and help are harm-reduction tools.",
  "Pour aller plus loin : downregulation D2 striatale, hypofrontalité ACC/OFC et accumulation de ΔFosB participent à la vulnérabilité durable. Cette plasticité impose une lecture non moralisante de l’addiction.": "Striatal D2 downregulation, ACC/OFC hypofrontality and DeltaFosB accumulation contribute to durable vulnerability. This plasticity requires a non-moralizing reading of addiction.",
  "La récupération est progressive et non linéaire ; craving, anhédonie et fonctions exécutives peuvent suivre des trajectoires différentes.": "Recovery is progressive and non-linear; craving, anhedonia and executive functions may follow different trajectories.",

      { title: "Surchauffe et hyponatrémie", visual: "heart", subtitle: "Deux risques opposés : trop peu d’eau, mais aussi trop d’eau pure.", plain: [
        "La sérotonine intervient aussi dans la thermorégulation, c’est-à-dire le thermostat du corps. Sous MDMA, ce thermostat peut devenir moins fiable, surtout si tu danses longtemps, dans un lieu chaud, avec peu de pauses. La priorité est de surveiller les signaux corporels sans attendre d’être en difficulté.",
        "Quand le corps chauffe, il transpire pour se refroidir. La transpiration fait perdre de l’eau, mais aussi des électrolytes comme le sodium. Boire trop peu peut aggraver la déshydratation et la surchauffe : c’est une vraie zone de vigilance.",
        "Mais boire des litres d’eau pure très vite peut créer un autre danger : le sodium du sang se dilue, ce qu’on appelle hyponatrémie. L’eau peut alors entrer dans les cellules pour rééquilibrer les concentrations. Cette situation est rare mais grave, donc elle doit être connue.",
        "Le cerveau est enfermé dans le crâne, une boîte rigide. S’il gonfle, la pression peut monter, réduire l’apport sanguin, comprimer le tronc cérébral, perturber la respiration, puis provoquer un manque d’oxygène pour le cœur. Confusion, vomissements, convulsions, forte température ou malaise justifient d’appeler les secours.",
        "La conduite pratique reste simple : pauses régulières au frais, hydratation normale, électrolytes si forte transpiration, éviter alcool et stimulation excessive. Le but est la vigilance équilibrée, pas la peur."

        "Pour aller plus loin : la MDMA peut perturber thermorégulation, hormone antidiurétique et comportements d’effort, ce qui rend simultanément possibles hyperthermie, déshydratation et hyponatrémie selon le contexte. Cette cohabitation impose une lecture prudente.",
        "L’hyponatrémie sévère expose à œdème cérébral, hypertension intracrânienne, convulsions, compression du tronc cérébral, arrêt respiratoire puis hypoxie. Ces signes relèvent d’une urgence médicale.",

      { title: "Valves cardiaques : le risque silencieux de la répétition", visual: "valve", subtitle: "Le problème n’est pas seulement l’intensité d’une soirée, mais la fréquence cumulée.", plain: [
        "Certaines cellules des valves cardiaques portent des récepteurs sensibles à la sérotonine, notamment 5‑HT2B. Quand ces récepteurs sont stimulés de manière répétée, ils peuvent envoyer un signal de construction aux cellules de valve. Cette partie est une vigilance de long terme, pas un diagnostic personnel.",
        "La cellule peut alors produire davantage de collagène, une protéine solide qui sert normalement à réparer les tissus. En excès, le collagène rigidifie la valve, comme une cicatrice interne qui rendrait une petite porte moins souple. La répétition augmente la prudence nécessaire.",
        "Une valve rigide peut moins bien se fermer. Le sang peut refluer, le cœur doit travailler davantage, puis se fatiguer avec le temps. Ce processus est souvent silencieux au début : on ne sent pas ses valves s’épaissir. Cette absence de symptôme précoce ne doit pas être interprétée comme une absence de risque.",
        "Le précédent du Fen-Phen, médicament retiré pour des problèmes valvulaires via des mécanismes liés à 5‑HT2B, montre pourquoi les chercheurs prennent ce sujet au sérieux. Pour la MDMA comme pour les psychédéliques répétés, le message RdR est la prudence sur la fréquence."
      ], expert: [
        "Pour aller plus loin : l’activation répétée de 5‑HT2B sur les cellules interstitielles valvulaires peut engager des voies pro‑mitogènes, notamment Gq, phospholipase C, calcium intracellulaire et kinases ERK. Cette cascade soutient la vigilance sur l’exposition chronique.",
        "La surproduction de matrice extracellulaire, dont collagène, peut contribuer à fibrose valvulaire, perte d’élasticité, régurgitation et augmentation de la charge cardiaque. Le risque dépend de nombreux facteurs et ne se résume pas à une prise isolée.",
        "L’absence de seuil humain précis impose un principe de prudence : réduire la fréquence et demander un avis médical en cas d’essoufflement inhabituel, douleur thoracique ou palpitations persistantes."
      ] },
      { title: "Descente et reconstruction", visual: "repair", subtitle: "La récupération se compte en jours, parfois en semaines, pas en une nuit magique.", plain: [
        "Après l’inondation de sérotonine, le cerveau doit refaire ses réserves. Il repart d’une matière première alimentaire, le tryptophane, qu’il transforme progressivement en 5‑HTP puis en sérotonine. Cette reconstruction demande du sommeil, de la nourriture et du temps.",
        "La nouvelle sérotonine doit ensuite être rangée dans des vésicules, puis transportée et utilisée correctement au bout des axones. Si les membranes ou les terminaisons ont subi du stress oxydatif, la récupération peut être plus longue. Ce n’est pas une faiblesse morale : c’est une contrainte biologique.",
        "La partie chimique peut prendre plusieurs jours ; la récupération fonctionnelle complète, surtout après forte dose, chaleur, mélanges ou répétitions, peut prendre plusieurs semaines. C’est pour cela que les repères RdR parlent souvent de 4 à 6 semaines minimum entre sessions MDMA.",
        "Si une nouvelle session arrive trop tôt, les réserves peuvent être incomplètes : l’effet empathique baisse, mais les effets stimulants et corporels peuvent rester présents. Cette dissociation entre plaisir et charge est un signal de vigilance important."
      ], expert: [
        "Pour aller plus loin : la récupération implique synthèse de novo de 5‑HT, restauration du stockage VMAT2, recyclage vésiculaire, transport axonal et réparation des terminaisons si stress oxydatif. Cette chaîne soutient la prudence sur la fréquence.",
        "En cas de chronicité, dopamine et métabolites réactifs peuvent participer à la formation de radicaux libres dans des environnements cellulaires vulnérables, avec atteinte des membranes et mitochondries. Cette information sert à expliquer la vigilance, pas à poser un diagnostic.",
        "L’historique local repère les répétitions rapprochées afin de rendre visible la récupération, sans culpabiliser ni encourager une nouvelle prise."
      ] }
    ],
    lsd: [
      { title: "5‑HT2A : une clé qui reste longtemps", visual: "receptor", subtitle: "Le LSD ne crée pas des images dans les yeux : il modifie le traitement cortical de la perception.", plain: [
        "La sérotonine est un messager naturel du cerveau. Le LSD ressemble assez à ce messager pour se fixer sur un récepteur appelé 5‑HT2A, très présent dans des zones corticales liées à la perception, aux émotions et aux associations d’idées. Cette localisation explique pourquoi plusieurs fonctions changent en même temps.",
        "Un récepteur fonctionne comme une serrure biologique. La sérotonine native se fixe puis se détache relativement vite ; le LSD peut activer le récepteur plus longtemps, comme une clé qui reste coincée. Cette durée prolongée participe à la longueur de l’expérience et impose de prévoir du temps.",
        "Quand 5‑HT2A est activé dans le cortex, le cerveau relie plus facilement des sensations, souvenirs et pensées qui restent d’habitude séparés. C’est une des bases possibles des motifs, couleurs intensifiées, synesthésies ou associations très rapides. Ces perceptions demandent un cadre sécurisé.",
        "Le plus fréquent n’est pas forcément une hallucination au sens psychiatrique strict, mais une perception transformée à partir de quelque chose de réel. Cette nuance aide à garder une pensée critique, mais ne remplace jamais la prudence sur le setting."
      ], expert: [
        "Pour aller plus loin : 5‑HT2A est fortement exprimé dans le cortex préfrontal et d’autres couches corticales impliquées dans cognition, perception et régulation émotionnelle. Cette distribution soutient la vigilance sur les antécédents psychiatriques.",
        "L’agonisme 5‑HT2A engage notamment des voies Gq/PLC/IP3/DAG et modifie l’équilibre glutamate/GABA, avec effets sur la connectivité thalamo‑corticale et corticale globale. Cette complexité rend l’expérience très dépendante du contexte.",
        "Le schéma doit être lu comme une différence de durée et de mode d’activation entre sérotonine native et LSD, pas comme une preuve de sécurité individuelle."
      ] },
      { title: "Thalamus : le filtre qui laisse trop passer", visual: "thalamus", subtitle: "Le problème n’est pas un cerveau magique, mais un tri sensoriel modifié.", plain: [
        "Ton cerveau reçoit beaucoup plus de signaux que ce que tu remarques : sons, lumière, sensations corporelles, souvenirs, pensées de fond. Le thalamus aide à trier ce flot, comme un filtre qui laisse passer l’utile et retient une partie du bruit. Quand ce filtre change, le monde peut sembler débordant.",
        "Sous LSD, le filtre peut devenir plus perméable. Un son banal, une lumière, une texture ou une sensation corporelle peuvent prendre beaucoup plus de place dans la conscience. C’est pour cela que musique, foule, fatigue et lumière forte comptent autant.",
        "La chimie derrière peut se comprendre simplement : le glutamate transmet et accélère, le GABA freine et calme. Si le système transmet davantage que ce qu’il freine, le cortex reçoit trop d’informations et tente de leur donner du sens. Cette surcharge appelle un setting simple et rassurant.",
        "Changer de pièce, baisser la lumière, réduire le son ou parler moins peut réellement modifier l’expérience, parce que le filtre sensoriel est plus ouvert. Cette action sur le setting est une mesure de prudence."
      ], expert: [
        "Pour aller plus loin : les modèles de gating thalamique décrivent une modification du filtrage sensoriel et des boucles thalamo‑corticales. Cette notion justifie la vigilance sur environnements bruyants ou imprévisibles.",
        "L’activation 5‑HT2A peut augmenter la transmission glutamatergique et modifier le contrôle GABAergique, ce qui favorise un flux sensoriel plus large vers le cortex. Cette interprétation reste un modèle pédagogique, pas un diagnostic en temps réel.",
        "Le schéma représente donc un filtre dont davantage de trous sont ouverts : la prudence consiste à réduire le nombre de signaux entrants quand l’expérience devient trop forte."
      ] },
      { title: "Microdosage : intensité faible, durée pas forcément courte", visual: "valve", subtitle: "Réduire la dose réduit surtout l’intensité, pas toujours la durée ressentie dans la même proportion.", plain: [
        "Une microdose est pensée comme très faible, mais cela ne veut pas dire que le système nerveux arrête d’être stimulé très vite. Pour le LSD, la demi-vie sanguine est souvent autour de quelques heures, mais la molécule peut rester engagée avec certains récepteurs plus longtemps que le ressenti ne le suggère. Cette différence impose de rester prudent.",
        "Le leurre classique est de se sentir plus productif parce que la tâche semble plus agréable, plus nouvelle ou plus fluide. Ce ressenti ne prouve pas que les performances objectives — logique, calcul, précision — augmentent. Cette distinction évite de confondre plaisir de faire et efficacité réelle.",
        "La répétition chronique pose aussi une question cardiaque via le récepteur 5‑HT2B. L’image utile : une goutte d’eau répétée peut creuser une pierre plus sûrement qu’un seau d’eau versé une seule fois puis oublié. La fréquence est donc une donnée de vigilance.",
        "Les études restent discutées et l’effet placebo peut être fort. Le suivi doit donc rester centré sur sommeil, anxiété, humeur, cœur, fréquence et capacité à fonctionner, sans transformer le microdosage en pratique banalisée."
      ], expert: [
        "Pour aller plus loin : la demi-vie plasmatique du LSD ne capture pas entièrement le temps de résidence fonctionnel au niveau de certains récepteurs et circuits. Cette dissociation soutient la prudence sur conduite, sommeil et tâches à risque.",
        "Les effets subjectifs sur humeur et motivation peuvent diverger des mesures objectives de performance cognitive, notamment en attention focalisée. Cette incertitude doit rester visible dans l’interface.",
        "L’exposition répétée à des agonistes 5‑HT2B est discutée comme risque théorique de valvulopathie ; faute de seuil humain clair, le principe de prudence s’applique."
      ] },
      { title: "Valves : collagène, MMP et TIMP", visual: "valve", subtitle: "Un chantier de construction et de démolition qui peut perdre son équilibre.", plain: [
        "Une valve cardiaque saine est souple : elle s’ouvre et se ferme comme une petite porte anti-retour. Si certaines cellules de valve reçoivent trop souvent un signal de croissance, elles peuvent produire trop de collagène, qui rigidifie la structure. Cette évolution est lente et mérite vigilance.",
        "Le corps possède des outils de nettoyage : les MMP, des enzymes qui coupent le collagène en excès. Il possède aussi des freins : les TIMP, qui empêchent les MMP de détruire trop de tissu. La récupération dépend de l’équilibre entre ces deux forces.",
        "Si les TIMP dominent trop, le collagène reste et la valve garde sa rigidité. Si les MMP travaillent quand la stimulation cesse, une partie du collagène jeune peut être remodelée progressivement. Cette fenêtre de récupération n’est pas infinie.",
        "Avec le temps, le collagène peut se réticuler, c’est-à-dire se lier plus fortement, puis parfois se calcifier. Une fois que le tissu devient dur comme de la pierre, la récupération naturelle devient beaucoup plus limitée. Cette zone justifie la prudence sur les usages répétés."
      ], expert: [
        "Pour aller plus loin : les MMP sont des métalloprotéinases matricielles capables de dégrader des composants de matrice extracellulaire, tandis que les TIMP inhibent leur activité. Cette balance gouverne une partie du remodelage tissulaire.",
        "La fibrose valvulaire associe production de collagène, modification de la matrice, éventuelle réticulation puis calcification, ce qui rend le retour ad integrum de plus en plus difficile. Cette information reste une vigilance de long terme.",
        "Le suivi de fréquence ne remplace pas une échographie ni un avis médical ; essoufflement, palpitations persistantes ou douleur thoracique justifient de consulter."
      ] },
      { title: "Boucles, temps et intégration", visual: "loop", subtitle: "Pourquoi une pensée peut tourner et pourquoi les conclusions attendent souvent quelques jours.", plain: [
        "Sous LSD, des zones cérébrales qui communiquent peu d’habitude peuvent s’envoyer beaucoup plus de signaux. La pensée peut alors revenir sur le même point, tourner en boucle ou sauter vers des associations très éloignées. Une boucle de pensée n’est pas une vérité : c’est un état transitoire à accompagner avec prudence.",
        "La perception du temps dépend de circuits qui comparent ce qui vient d’arriver avec ce qui arrive maintenant. Si ces circuits sont surchargés ou désynchronisés, une minute peut sembler très longue ou très courte. Il vaut mieux éviter les décisions importantes pendant cette phase.",
        "La zone sombre ou rémanente d’une timeline signifie : système nerveux encore sensible, perceptions encore modifiées, fatigue possible et jugement pas totalement revenu. Même si le pic baisse, la prudence sur conduite, messages importants ou déplacements reste nécessaire.",
        "L’intégration commence après : images, pensées et émotions doivent se réordonner. Se précipiter vers une grande conclusion dans les 24 heures peut donner une certitude qui se transforme ensuite. Laisser quelques jours, dormir et parler avec une personne fiable fait partie de la vigilance."
      ], expert: [
        "Pour aller plus loin : l’hyperconnectivité fonctionnelle et la désorganisation temporaire de certaines hiérarchies prédictives peuvent favoriser boucles de pensée, distorsion temporelle et associations atypiques. Cette lecture doit rester contextualisée.",
        "La mémoire immédiate et les comparateurs temporels participent à l’impression de durée ; leur perturbation peut expliquer dilatation ou compression du temps subjectif. Cette incertitude justifie de différer les décisions majeures.",
        "L’intégration est un processus cognitif et émotionnel post-effet : sommeil, mise en récit et soutien social réduisent le risque de surinterprétation ou d’anxiété persistante."
      ] }
    ],

        "La kétamine se loge dans ce canal et le bouche de l’intérieur : c’est pour cela qu’on parle d’antagoniste non compétitif. Le glutamate peut être présent, mais le passage est partiellement bloqué. Cette déconnexion explique l’incoordination et impose prudence.",

        "À dose sub-anesthésique, le blocage est partiel : certains signaux comme la musique peuvent rester saillants tandis que le corps devient flou. Cette dissociation sélective augmente le risque de mauvais jugement moteur.",

      { title: "Vessie : urothélium, inflammation, fibrose", visual: "bladder", subtitle: "La toxicité signature de la répétition est urinaire.", plain: [

        "La couche interne de la vessie s’appelle l’urothélium. Elle fonctionne comme un revêtement étanche qui protège les tissus sensibles. Si ce revêtement est irrité à répétition, l’urine peut devenir douloureuse pour les tissus dessous. Les douleurs urinaires ne sont pas un détail.",
        "Le corps essaie de réparer l’inflammation avec du tissu cicatriciel. Si ce processus devient chronique, la vessie peut perdre de l’élasticité, stocker moins d’urine et déclencher des envies très fréquentes. Cette fibrose peut devenir partiellement irréversible.",
        "Il existe une fenêtre de récupération si les signaux sont pris tôt : réduire l’exposition et consulter peut éviter que l’inflammation s’installe. Brûlures, sang, douleurs, réveils nocturnes ou besoin d’uriner très souvent doivent être traités comme signaux médicaux."

        'Time perception distortion is one of the most consistently reported LSD effects. It involves disruption of fronto-striatal timing circuits. A single minute can subjectively feel like an hour; an hour can pass like a minute. This is not a sign of damage or "going too far" — it is a neurological effect that requires calm anchoring, not panic.',
        'The plasticity window in the days after a strong LSD experience (BDNF peak over 7–14 days) means that what happens in those days shapes what the experience becomes in memory and meaning. Nourishing food, low-stress environments, writing or speaking about the experience without judgment — these are the tools of integration. Avoid major decisions or confrontations for the first 24–48 hours. Stay cautious and allow time for the experience to settle.'
