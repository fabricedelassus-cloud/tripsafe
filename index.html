      {title:'Liver: ADH, acetaldehyde and the three stages', subtitle:'Why alcohol does not clear faster through willpower.', visual:'warning', plain:['The liver transforms ethanol through ADH into acetaldehyde. Acetaldehyde is reactive, inflammatory and toxic, and must then be neutralized by ALDH2 into acetate.', 'Alcohol clearance is close to fixed-rate kinetics: the liver removes an almost fixed amount per hour. Coffee, cold showers or short sleep do not make blood alcohol disappear faster.', 'Heavy or chronic exposure recruits CYP2E1, generates reactive oxygen species and consumes NAD+. Fat can accumulate in the liver first, then inflammation may progress to fibrosis and cirrhosis.'], expert:['ADH produces acetaldehyde; ALDH2 converts it to acetate; CYP2E1 increases ROS under high or chronic exposure.', 'The NADH/NAD+ shift disturbs beta-oxidation and favours steatosis. Gut endotoxin and inflammation contribute to fibrosis/cirrhosis.', 'This pathway supports toxic and hepatic vigilance.']},
      {title:'Withdrawal: excitotoxicity, Delirium Tremens, medical emergency', subtitle:'Severe alcohol withdrawal can be fatal and is not managed alone.', visual:'heart', plain:['With daily alcohol exposure, the brain adapts: it downregulates some GABA brakes and upregulates some NMDA engines to function despite sedation.', 'If alcohol stops abruptly after prolonged daily drinking, the alcohol brake disappears while excitatory engines remain overactive. Tremors, sweats, tachycardia, anxiety, seizures, confusion and Delirium Tremens can appear.', 'Kindling means repeated withdrawals can make later ones more severe. Intense tremors, confusion, hallucinations, sweats or seizures require urgent medical help.'], expert:['GABAergic downregulation and NMDA upregulation expose to glutamatergic excitotoxicity during ethanol withdrawal.', 'Medically supervised benzodiazepines are used to control this risk.', 'Delirium Tremens involves dysautonomia, hallucinations, disorientation and vital risk.']},

      {title:'Levamisole: the adulterant that can damage immunity', subtitle:'A frequent, invisible and clinically documented risk.', visual:'warning', plain:['A large share of available cocaine can be cut with levamisole, a veterinary antiparasitic. The problem is not only purity or strength: levamisole can attack the immune system.', 'It can cause agranulocytosis: some white blood cells collapse, making infections much more dangerous. Fever, severe sore throat, unusual wounds or intense fatigue after exposure matter.', 'It can also trigger autoimmune vasculitis with retiform purpura and necrosis, especially ears, nose or skin. Untested product means stronger caution. A reagent test (Marquis, Scott, Mandelin) does not guarantee the absence of all adulterants, but can detect the most common ones. It is one of the most concrete harm-reduction steps available before any cocaine use. Stay cautious.'], expert:['Levamisole is associated with agranulocytosis and ANCA-positive vasculitis with necrotic skin lesions.', 'This toxicity is independent from the desired stimulant effect.', 'Product testing does not make use safe, but it reduces the blind spot around adulterants.']},

osis."] },

  function buildSessionAI(session) {
    const sub = substances[session.substance];
    if (!sub) return [`${archivedSessionLine()}`];
    const elapsed = Math.max(0, (Date.now() - new Date(session.startedAt).getTime()) / 60000);
    const phase = currentPhase(session.substance, elapsed);
    const doseInfo = totalKnownDose(session);
    const level = classifyDose(session.substance, doseInfo.total || session.dose, doseInfo.known);
    const histAlerts = scanHistoryForSession(session);
    const recentMetric = [...(session.metrics || [])].pop();
    const risk = currentMainRisk(session);
    const u = sessionUncertainty(session);
    const lines = [];
    if (state.lang === 'en') {
      lines.push(`Current local reading for ${sub.short}: phase “${phase.label}”. Use it as a cautious estimate synced with the phone clock.`);
      lines.push(`Main risk now: ${risk.title}. ${risk.body}`);
      lines.push(`Uncertainty: ${uncertaintyMeta(u.level).title}. ${uncertaintyMeta(u.level).body}`);
      if (doseInfo.known && doseInfo.total) lines.push(`Declared total for main substance: ${doseInfo.total}${sub.unit}, ${doseLabel(level).toLowerCase()} level according to the indicative table.`);
      else lines.push('Dose not quantified: visual estimates are logging data only and should not guide redosing. Stay cautious.');
      if (recentMetric?.hr) { const hr = Number(recentMetric.hr); lines.push(hr >= 130 ? 'Very high heart rate declared: pause, cool place, call for help if chest pain, faintness or confusion appears.' : hr >= 110 ? 'Heart rate elevated: pause, breathe, reduce stimulation and move somewhere cooler.' : 'Declared heart rate is below tracker alert thresholds; still compare with symptoms.'); }
      if (recentMetric?.temp) { const tt = Number(recentMetric.temp); lines.push(tt >= 38.5 ? 'Temperature ≥ 38.5°C: potential emergency signal; cool down and call for help if symptoms are present.' : tt >= 37.8 ? 'Temperature in vigilance range: move away from heat and effort.' : 'Declared temperature is below tracker alert thresholds. Keep watching context and symptoms.'); }
      if (histAlerts[0]) lines.push('History signal: ' + histAlerts[0].text);
      return lines;
    }
    lines.push(`Lecture locale pour ${sub.short} : phase “${phase.label}”, synchronisée avec l’horloge du téléphone.`);
    lines.push(`Risque principal maintenant : ${risk.title}. ${risk.body}`);
    lines.push(`Incertitude : ${uncertaintyMeta(u.level).title}. ${uncertaintyMeta(u.level).body}`);
    if (doseInfo.known && doseInfo.total) lines.push(`Dose totale déclarée pour la substance principale : ${doseInfo.total}${sub.unit}, niveau ${doseLabel(level).toLowerCase()} selon le tableau indicatif.`);
    else lines.push('Dose non quantifiée : les estimations visuelles servent au journal, pas à décider une reprise. Prudence.');
    if (recentMetric?.hr) { const hr = Number(recentMetric.hr); lines.push(hr >= 130 ? 'Fréquence cardiaque très haute déclarée : pause, endroit frais, aide si douleur thoracique, malaise ou confusion.' : hr >= 110 ? 'Fréquence cardiaque élevée : pause, respiration, moins de stimulation et endroit plus frais.' : 'Fréquence cardiaque sous les seuils d’alerte du suivi ; comparer avec les symptômes reste essentiel.'); }
    if (recentMetric?.temp) { const tt = Number(recentMetric.temp); lines.push(tt >= 38.5 ? 'Température ≥ 38,5°C : signal potentiellement urgent ; refroidir et demander de l’aide si symptômes.' : tt >= 37.8 ? 'Température en zone vigilance : quitter chaleur/effort et refroidir doucement.' : 'Température sous les seuils d’alerte du suivi. Le contexte reste important.'); }
    if (histAlerts[0]) lines.push('Signal historique : ' + histAlerts[0].text);
    return lines;
  }


  function buildDocAI(subKey) {
    const sub = substances[subKey] || substances.mdma;
    const sessions = state.sessions.filter(s => s.substance === subKey);
    const last = sessions.sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt))[0];
    const atlas = learningAtlas[subKey] || [];
    const readCount = atlas.length > 0 ? atlas.filter((m, i) => state.readModules[moduleKey(subKey, m, i)] || state.readModules[subKey + '_' + i]).length : 0;
    const lines = [];
    if (state.lang === 'en') {
      lines.push(`Key point for ${sub.short}: risk is shaped by dose + delay + context + mixtures, not by a single number.`);
      if (atlas.length > 0 && readCount < atlas.length) lines.push(`Biology modules: ${readCount}/${atlas.length} read for ${sub.short}. ${atlas.length - readCount} module(s) remaining in the Neuro tab.`);
      else if (atlas.length > 0 && readCount === atlas.length) lines.push(`All ${atlas.length} biology modules for ${sub.short} have been read. Check the interactions tab for cross-substance vigilance.`);
      if (subKey === 'mdma') lines.push('With MDMA, the two priority signals are heart rate and body temperature. Heat, dancing, alcohol or redosing can make them rise before the person notices. Take breaks, move to a cooler place and hydrate normally.');
      else if (subKey === 'ketamine') lines.push('For ketamine, the main safety sensor is physical safety: falls, vomiting, sedation and depressant mixtures matter as much as dose.');
      else if (subKey === 'alcool') lines.push('For alcohol, legality does not reduce biological risk: memory, breathing, liver load and withdrawal risk require serious vigilance.');
      else if (subKey === 'cocaine') lines.push('For cocaine, cardiovascular risk, redosing compulsion and possible levamisole adulteration must be as visible as the rush.');
      else lines.push('Set and setting act like an amplifier: music, light, fatigue and social context can change the trajectory.');
      if (last) {
        const days = Math.round((Date.now() - new Date(last.startedAt).getTime()) / 864e5);
        lines.push(`Local history: last ${sub.short} session recorded ${days} day(s) ago. This stays on this device.`);
      } else {
        lines.push('No session recorded for this substance on this device: recovery is not personalized yet. This does not mean zero risk.');
      }
      return lines;
    }
    lines.push(`À retenir pour ${sub.short} : le risque se joue sur dose + délai + contexte + mélanges, pas sur une seule variable.`);
    if (atlas.length > 0 && readCount < atlas.length) lines.push(`Modules de biologie : ${readCount}/${atlas.length} parcourus pour ${sub.short}. ${atlas.length - readCount} module(s) restant(s) dans l’onglet Neuro.`);
    else if (atlas.length > 0 && readCount === atlas.length) lines.push(`Tous les ${atlas.length} modules de biologie ${sub.short} ont été parcourus. Consulte l’onglet Interactions pour la vigilance croisée.`);
    if (subKey === 'mdma') lines.push('Avec la MDMA, les deux signaux à surveiller en priorité sont ton rythme cardiaque et ta température corporelle. Quand tu as chaud, que tu as pris de l’alcool ou que tu reprends une dose, ces deux indicateurs peuvent monter sans que tu t’en rendes compte. Fais des pauses régulières, cherche un endroit frais, hydrate-toi normalement.');
    else if (subKey === 'ketamine') lines.push('Le capteur principal est la sécurité physique : chute, vomissement, sédation et mélanges dépresseurs comptent autant que la dose.');
    else if (subKey === 'alcool') lines.push('Avec l’alcool, la légalité ne réduit pas le risque biologique : mémoire, respiration, foie et sevrage demandent une vigilance réelle.');
    else if (subKey === 'cocaine') lines.push('Avec la cocaïne, le risque cardiovasculaire, la compulsion de reprise et le lévamisole doivent être aussi visibles que la montée.');
    else lines.push('Le set and setting est un amplificateur : musique, lumière, fatigue et entourage peuvent transformer l’expérience.');
    if (last) {
      const days = Math.round((Date.now() - new Date(last.startedAt).getTime()) / 864e5);
      lines.push(`Historique local : dernière session ${sub.short} enregistrée il y a ${days} j. Cette donnée reste sur ce téléphone.`);
    } else {
      lines.push('Aucune session enregistrée pour cette substance sur ce téléphone : le suivi ne personnalise pas encore la récupération. Cela ne veut pas dire risque zéro.');
    }
    return lines;
  }

  async function checkRemoteVersion(showToast = false) {
    if (location.protocol === 'file:') return;
    try {
      const res = await fetch('./version.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('version fetch failed');
      const data = await res.json();
      state.remoteVersion = data.version || '';
      if (data.version && data.version !== APP_VERSION) {
        state.pwaUpdateAvailable = true;
        render();
      } else if (showToast) {
        RDR.toast(t('v152NoUpdate'));

    let title = parts.length > 1 ? parts[0] : clean.split(/\s+/).slice(0, 5).join(' ');

  function renderDoseDoc(sub) {

    const mgkg = sub.id === 'mdma' && weight && dose ? (dose / weight).toFixed(2) : null;
    const alerts = computeDoseAlerts(sub.id, state.docDose, state.docWeight, state.docSex, known, 0);
    return `<div class="stack">
      <article class="card-xl dose-lab">
        <div class="card-head"><h2>${t('doseLocked')} ${escapeHTML(sub.name)}</h2><span class="route-pill">${escapeHTML(sub.routeDefault)} • ${escapeHTML(sub.unit)}</span></div>

  function timelineClock(baseMinutes, offset) {
    const total = (baseMinutes + Math.round(offset)) % (24 * 60);
    const h = Math.floor(total / 60), m = total % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  function renderTimeline(subKey, elapsed = null, startedAt = null) {
    const phases = phaseBoundaries(subKey);
    const total = phases[3].end;
    const marker = elapsed == null ? null : Math.min(100, Math.max(0, (elapsed / total) * 100));
    const startDate = startedAt ? new Date(startedAt) : null;
    const labelFor = (p) => {
      if (startDate) {
        const a = new Date(startDate.getTime() + p.start * 60000);
        const b = new Date(startDate.getTime() + p.end * 60000);
        return `${p.label} ${a.toLocaleTimeString(localeClockCode(),{hour:'2-digit',minute:'2-digit'})} → ${b.toLocaleTimeString(localeClockCode(),{hour:'2-digit',minute:'2-digit'})}`;
      }
      return `${p.label} T+${fmtDuration(p.start)} → T+${fmtDuration(p.end)}`;
    };
    return `<div class="timeline-wrap">
      <div class="timeline-bar">
        ${phases.slice(0,4).map(p => `<div class="seg ${p.key}" style="width:${Math.max(8, ((p.end - p.start) / total) * 100)}%"><span>${escapeHTML(p.label)}</span></div>`).join('')}
        ${marker == null ? '' : `<span class="now-marker" style="left:${marker}%" aria-hidden="true"></span>`}
      </div>
      <div class="timeline-legend">${phases.slice(0,4).map(p => `<span>${escapeHTML(labelFor(p))}</span>`).join('')}</div>
      ${elapsed == null ? `<p class="compact-note">${t('phaseApproxNote')}</p>` : ''}
    </div>`;
  }

  function renderTimelineDetails(subKey) {
    const sub = substances[subKey];
    const phases = [
      ['debut', 'Début', sub.durations.onset], ['montee', 'Montée', sub.durations.comeup], ['plateau', 'Plateau', sub.durations.plateau], ['descente', 'Descente', sub.durations.comedown], ['apres', 'Rémanence', sub.durations.after]
    ];
    return `<div class="phase-cards">${phases.map(([key, label, range]) => `<div class="phase-card"><span>${label} • ${fmtRange(range)}</span><p>${escapeHTML(sub.phases[key] || '')}</p></div>`).join('')}</div>`;
  }

  function renderInteractionVideo(a, b, inter) {
    const steps = [
      { n: 1, title: `${labelOf(a)} ${t('alone')}`, text: substanceInteractionMechanism(a) },
      { n: 2, title: `${labelOf(b)} ${t('alone')}`, text: substanceInteractionMechanism(b) },
      { n: 3, title: t('collisionPoint'), text: inter.why },
      { n: 4, title: t('bodySignal'), text: interactionBodySignal(inter.risk) },
      { n: 5, title: t('friendlyDecision'), text: inter.action }
    ];
    return `<div class="mini-video">${renderInteractionSvg(a, b, inter)}<div class="mini-video-rail">${steps.map(s => `<div><i>${s.n}</i><b>${escapeHTML(s.title)}</b><p>${escapeHTML(s.text)}</p></div>`).join('')}</div></div>`;

  function substanceInteractionMechanism(k) {
    if (state.lang === 'en') {
      if (k === 'mdma') return 'Raises serotonin plus stimulation; heart and temperature can rise. Be cautious with heat, redoses and medicines.';
      if (k === 'ketamine') return 'Dissociative/sedative: coordination, memory and breathing become key signals. Be especially cautious with depressants.';
      if (['lsd', 'champignons', 'dmt', 'mescaline', 'twocb'].includes(k)) return 'Psychedelic: perception, emotions and suggestibility strongly depend on context. Set and setting remain vigilance points.';
      if (k === 'alcool') return 'CNS depressant: sedation, memory, reflexes and liver are key vigilance zones. Interactions are especially dangerous with other depressants.';
      if (k === 'cocaine') return 'Major cardiovascular stimulant: heart, blood pressure and compulsive redosing are central risks. Other stimulants add cardiac load.';
      if (k === 'cannabis') return 'Can amplify sensations, anxiety, confusion or relaxation depending on the person. Be cautious during the come-up.';
      if (['amphetamine', 'cafeine', 'apvp', 'threemmc'].includes(k)) return 'Stimulant: heart, blood pressure, heat, anxiety and sleep are involved. Be cautious with other stimulants.';
      if (['ghb', 'benzos', 'opiaces'].includes(k)) return 'Depressant/sedative: consciousness and breathing are critical signals. Stronger caution with alcohol or ketamine.';
      if (['isrs', 'imao', 'tramadol', 'lithium'].includes(k)) return 'Medicine/treatment: neurochemical interactions can be major. Never change treatment alone; medical caution is needed.';
      return 'Mechanism not detailed in this version; do not infer that the mix is safe.';
    }
    if (k === 'mdma') return 'Pousse sérotonine + stimulation ; cœur et température peuvent monter. Prudence sur chaleur, reprises et médicaments.';
    if (k === 'ketamine') return 'Dissociatif/sédatif ; coordination, mémoire et respiration deviennent des points clés. Prudence avec dépresseurs.';
    if (['lsd', 'champignons', 'dmt', 'mescaline', 'twocb'].includes(k)) return 'Psychédélique : perception, émotions et suggestibilité dépendent fortement du contexte. Prudence set & setting.';
    if (k === 'alcool') return 'Dépresseur du SNC : sédation, mémoire, réflexes et foie sont les zones de vigilance. Interactions dangereuses avec tout autre dépresseur.';
    if (k === 'cocaine') return 'Stimulant cardiovasculaire majeur : cœur, tension, rebidose compulsive. Charge cardiaque additive avec les autres stimulants.';
    if (k === 'cannabis') return 'Peut amplifier sensations, anxiété, confusion ou détente selon personne. Prudence en montée.';
    if (['amphetamine', 'cafeine', 'apvp', 'threemmc'].includes(k)) return 'Stimulant : cœur, tension, chaleur, anxiété et sommeil sont concernés. Prudence avec autres stimulants.';
    if (['ghb', 'benzos', 'opiaces'].includes(k)) return 'Dépresseur/sédatif : conscience et respiration sont les signaux critiques. Prudence renforcée avec alcool ou kétamine.';
    if (['isrs', 'imao', 'tramadol', 'lithium'].includes(k)) return 'Médicament/traitement : interactions neurochimiques parfois majeures ; ne jamais modifier seul un traitement. Prudence médicale.';
    return 'Mécanisme non détaillé dans cette version ; ne pas déduire que le mélange est sûr.';
  }


  function interactionBodySignal(risk) {
    if (state.lang === 'en') {
      if (risk === 'fatal') return 'Red signals: unconsciousness, slow breathing, seizure, very high temperature, severe confusion or chest pain.';
      if (risk === 'risky') return 'Signals: very fast heart rate, chest pain, panic, overheating, agitation or vomiting.';
      if (risk === 'caution') return 'Signals: anxiety, confusion, temperature, urge to redose, masked or amplified effects.';
      return 'Even without a major signal, context can change the trajectory.';
    }
    if (risk === 'fatal') return 'Signaux rouges : inconscience, respiration lente, convulsion, forte température, confusion sévère, douleur thoracique.';
    if (risk === 'risky') return 'Signaux : cœur très rapide, douleur thoracique, panique, surchauffe, agitation, vomissements.';
    if (risk === 'caution') return 'Signaux : anxiété, confusion, température, envie de reprendre, effets masqués ou amplifiés.';
    return 'Même sans signal majeur, le contexte peut changer la trajectoire.';
  }

  function labelOpt(key) { return t(key); }
  function drinkDefaults(type) {

  function ethanolGrams(volumeCl, abv, count) {

  function estimateAlcohol(fields) {

    const volumeCl = type === 'custom' ? (Number(String(fields.drinkVolCl || d.cl).replace(',', '.')) || d.cl) : d.cl;
    const abv = type === 'custom' ? (Number(String(fields.drinkAbv || d.abv).replace(',', '.')) || d.abv) : d.abv;
    const grams = ethanolGrams(volumeCl, abv, count);
    return { grams, std: grams / 10, volumeCl, abv, count, type };
  }
  function estimateBAC(grams, weight, sex, startedAt) {
    const kg = Number(weight) || 70;
    const r = sex === 'F' ? 0.55 : 0.68;
    const raw = grams / (r * kg);
    const hours = startedAt ? Math.max(0, (Date.now() - new Date(startedAt).getTime()) / 36e5) : 0;
    const afterElim = Math.max(0, raw - 0.15 * Math.max(0, hours - 0.75));
    return { raw, current: afterElim, hours };
  }
  function estimateLineMg(cm, size) {

    const factors = { fine: [10, 25], medium: [25, 50], large: [50, 100] };
    const f = factors[size] || factors.medium;
    return { low: Math.round(c * f[0]), high: Math.round(c * f[1]), mid: Math.round(c * (f[0] + f[1]) / 2), cm: c, size };
  }
  function estimateFingerMg(size) {

          <details class="form-group-optional" data-group-key="context" ${state.formGroupsOpen.context ? 'open' : ''} ontoggle="RDR.setFormGroupOpen('context', this.open)"><summary class="form-group-title"><span class="form-step-badge neutral">4</span>${t('formGroupContext')}</summary><article><h2>${t('coUseTitle')}</h2><div class="chip-grid">${coUseOptions.map(([k, label]) => `<button class="toggle-chip ${f.coUse.includes(k) ? 'active' : ''}" onclick="RDR.toggleFormArray('coUse','${k}')">${escapeHTML(uiLabel(label))}</button>`).join('')}</div></article><article><h2>${t('contextTitle')}</h2><div class="chip-grid">${contextTags.map(([k, label]) => `<button class="toggle-chip ${f.contexts.includes(k) ? 'active' : ''}" onclick="RDR.toggleFormArray('contexts','${k}')">${escapeHTML(uiLabel(label))}</button>`).join('')}</div><label>${t('notes')}<textarea id="input-session-notes" rows="3" oninput="RDR.formDraft('notes', this.value)" onchange="RDR.form('notes', this.value)" placeholder="${t('notesPlaceholder')}">${escapeHTML(f.notes)}</textarea></label></article></details>
          <article class="card-xl pre-analysis-card"><h2>${t('preAnalysis')}</h2>${renderTimeline(f.substance)}${doseBuilt.alcohol ? `<div class="alert info">${t('bacEstimate')} ≈ ${estimateBAC(doseBuilt.alcohol.grams, f.weight, f.sex, sessionStartDate(f.time)).current.toFixed(2)} g/L · ${t('drivingLimitNote')}</div>` : ''}${alerts.concat(histAlerts).map(a => `<div class="alert ${a.type}">${escapeHTML(a.text)}</div>`).join('') || `<div class="alert safe">${t('noAlert')}</div>`}${f.coUse.map(k => renderInteractionResult(f.substance, k)).join('')}<button class="primary-btn full" onclick="RDR.startSession()">${t('startTracking')}</button></article>
        </article>
      </details>

  function renderActiveSession(session) {
    const sub = substances[session.substance];
    if (!sub) return `<section><article class="card-xl"><h1>${t('archivedIncompatible')}</h1><p class="muted">${escapeHTML(labelOf(session.substance))}</p><button class="danger-btn full" onclick="RDR.requestEndConfirm()">${t('endSession')}</button></article></section>`;
    const elapsed = Math.max(0, (Date.now() - new Date(session.startedAt).getTime()) / 60000);
    const phase = currentPhase(session.substance, elapsed);
    const doseInfo = totalKnownDose(session);
    const level = classifyDose(session.substance, doseInfo.total || session.dose, doseInfo.known);
    const alerts = computeDoseAlerts(session.substance, doseInfo.total || session.dose, session.weight, session.sex, doseInfo.known, 0).concat(scanHistoryForSession(session));
    const pairAlerts = sessionInteractionPairs(session).filter(p => p.rank >= 4).slice(0, 3).map(p => ({ type: p.rank >= 6 ? 'critical' : p.rank >= 5 ? 'danger' : 'warn', text: `${t('mixAlertTitle')} : ${labelOf(p.a)} + ${labelOf(p.b)} — ${p.inter.action || t('mixAlertAction')}` }));
    const mgkg = doseInfo.known && doseInfo.total && session.weight ? (doseInfo.total / Number(session.weight)).toFixed(2) : '';
    const doseText = doseInfo.known && doseInfo.total ? `${escapeHTML(doseInfo.total)}${escapeHTML(sub.unit)}` : (session.doseDisplay || t('unknownDose'));
    return `<section class="session-active-screen">
      <div class="live-hero compact-live ${sub.color}">
        <div><span class="eyebrow">${t('activeSession')}</span><h1>${escapeHTML(sub.short)} • ${escapeHTML(phase.label)}</h1><p><span id="elapsed-timer">${formatElapsed(elapsed)}</span> ${t('sinceT0')}</p><div class="dose-anchor"><span class="dose-anchor-value">${doseText}</span><span class="dose-anchor-level badge ${level.className}">${escapeHTML(doseLabel(level))}</span>${mgkg ? `<span class="dose-anchor-mgkg">${mgkg} mg/kg</span>` : ''}</div></div>
        <span class="live-dot"></span>
      </div>
      <button class="danger-btn full sos-inline" onclick="RDR.openSOS()">🆘 ${t('sosTitle')}</button>
      ${alerts.concat(pairAlerts).map(a => `<div class="alert ${a.type}">${escapeHTML(a.text)}</div>`).join('') || `<div class="alert info">${t('notSafeJustUnknown')}</div>`}
      <button class="primary-btn full add-intake-sticky" onclick="RDR.setSessionTab('dose')">${t('addIntakePrimary')}</button>
      <div class="session-tabs"><button class="${state.sessionTab === 'now' ? 'active' : ''}" onclick="RDR.setSessionTab('now')">${t('tabNow')}</button><button class="${state.sessionTab === 'body' ? 'active' : ''}" onclick="RDR.setSessionTab('body')">${t('tabBody')}</button><button class="${state.sessionTab === 'dose' ? 'active' : ''}" onclick="RDR.setSessionTab('dose')">${t('tabDoseLog')}</button></div>
      ${state.sessionTab === 'body' ? renderSessionTabBody(session, sub) : state.sessionTab === 'dose' ? renderSessionTabDose(session, sub) : renderSessionTabNow(session, sub, phase, elapsed, level)}
      ${renderEndSessionControl()}
    </section>`;
  }


  function renderSessionTabNow(session, sub, phase, elapsed, level) {
    return `<div class="stack">${renderSessionCockpit(session)}<article class="card-xl"><div class="card-head"><h2>${t('whereAmI')}</h2><span class="badge ${level.className}">${escapeHTML(doseLabel(level))}</span></div>${renderTimeline(session.substance, elapsed, new Date(session.startedAt))}${renderAICard(buildSessionAI(session), t('compassTitle'))}</article>${renderPhaseClockCards(session)}${renderSessionInteractionCards(session)}${renderCompanionMini()}<article class="card-xl"><h2>${t('currentPhase')} ${escapeHTML(phaseLabel(phase.key))}</h2><div class="phase-card active" style="margin:0;"><span>${escapeHTML(phaseLabel(phase.key))}</span><p>${wrapGlossaire(sub.phases[phase.key] || '')}</p></div><details style="margin-top:10px;"><summary class="details-summary">${t('allPhasesDetails')}</summary><div class="phase-cards" style="margin-top:8px;">${Object.entries(sub.phases).map(([k, txt]) => `<div class="phase-card ${k === phase.key ? 'active' : ''}"><span>${phaseLabel(k)}</span><p>${wrapGlossaire(txt)}</p></div>`).join('')}</div></details></article></div>`;
  }


  function renderSessionTabBody(session, sub) {
    const latest = [...(session.metrics || [])].pop() || {};
    return `<div class="stack"><article class="card-xl metrics"><h2>${t('liveBody')}</h2><div class="metric-grid">${renderMetric(t('labelFC'), latest.hr ? `${latest.hr} bpm` : '—', t('threshFC'), metricState('hr', latest.hr))}${renderMetric(t('labelTemp'), latest.temp ? `${latest.temp} °C` : '—', t('threshTemp'), metricState('temp', latest.temp))}${renderMetric(t('labelWater'), latest.water ? `${latest.water} ml` : '—', t('threshWater'), 'info')}</div><div class="form-grid three-cols"><label>${t('bpm')}<input id="input-metric-hr" type="number" inputmode="numeric" min="20" max="250" step="1" value="${escapeHTML(state.metricDraft.hr)}" oninput="RDR.metricDraft('hr', this.value)"></label><label>°C<input id="input-metric-temp" type="number" inputmode="decimal" min="32" max="43" step="0.1" value="${escapeHTML(state.metricDraft.temp)}" oninput="RDR.metricDraft('temp', this.value)"></label><label>${t('waterMl')}<input id="input-metric-water" type="number" inputmode="numeric" min="0" max="5000" step="50" value="${escapeHTML(state.metricDraft.water)}" oninput="RDR.metricDraft('water', this.value)"></label></div><button class="ghost-btn full" onclick="RDR.recordMetric()">${t('saveMetrics')}</button></article>${renderCompanionMini()}</div>`;
  }


  function renderSessionTabDose(session, sub) {
    return `<div class="stack"><article class="card-xl"><h2>${t('declaredDoses')}</h2>${renderEntries(session)}</article>${renderSessionInteractionCards(session)}<article class="card-xl"><h2>${t('addIntakePrimary')}</h2>${renderActiveIntakeLogger(session, sub)}</article></div>`;

  function renderEndSessionControl() {
    return state.endSessionConfirm ? `<div class="end-confirm-row"><span class="muted" style="font-size:13px;">${t('endConfirmText')}</span><button class="danger-btn" onclick="RDR.endSession()">${t('endConfirmYes')}</button><button class="ghost-btn" onclick="RDR.cancelEndConfirm()">${t('endConfirmNo')}</button></div>` : `<button class="danger-btn full" onclick="RDR.requestEndConfirm()">${t('endSession')}</button>`;

  function renderMetric(label, value, ref, stateName) {
    const isEmpty = value === '—';
    return `<div class="metric-card ${stateName}" ${isEmpty ? `title="${escapeHTML(t('toSaisir'))}"` : ''}><span>${escapeHTML(label)}</span><b style="${isEmpty ? 'opacity:.45' : ''}">${escapeHTML(value)}</b><small>${isEmpty ? t('toSaisir') : escapeHTML(ref)}</small></div>`;
  }

  function metricState(kind, value) {
    const v = Number(value);
    if (!v) return 'neutral';
    if (kind === 'hr') return v >= 130 ? 'critical' : v >= 110 ? 'warn' : 'safe';
    if (kind === 'temp') return v >= 38.5 ? 'critical' : v >= 37.8 ? 'warn' : 'safe';
    return 'info';
  }

  function renderEntries(session) {
    const entries = entryList(session);
    return `<div class="entry-list">${entries.map(e => { const entrySub = getSubstance(e.substance || session.substance); const elapsed = Math.max(0, (Date.now() - new Date(e.at).getTime()) / 60000); const ph = currentPhase(entrySub.id, elapsed); const display = e.display || (e.known ? `${escapeHTML(e.amount)} ${entrySub.unit}` : t('unknownDose')); const bac = e.alcohol ? estimateBAC(e.alcohol.grams, session.weight, session.sex, e.at) : null; const u = uncertaintyForEntry(e); const uMeta = uncertaintyMeta(u.score >= 4 ? 'high' : u.score >= 2 ? 'medium' : 'low'); return `<div class="entry entry-mixed"><b>${e.kind === 'initial' ? t('initialDose') : escapeHTML(entrySub.short)}</b><span><span class="entry-sub">${escapeHTML(entrySub.name)} · ${display}</span><span class="entry-meta">${escapeHTML(e.mode || '')} · ${phaseLabel(ph.key)} · T+${fmtDuration(elapsed)}${bac ? ` · ${t('bacEstimate')} ≈ ${bac.current.toFixed(2)} g/L` : ''}</span>${u.score ? `<span class="badge ${uMeta.cls} mini-uncertainty">${escapeHTML(uMeta.title)}</span>` : ''}</span><small>${new Date(e.at).toLocaleTimeString(localeClockCode(), {hour:'2-digit', minute:'2-digit'})}</small></div>`; }).join('')}</div>`;
  }


  function renderTopupLogger(sub) {
    return renderActiveIntakeLogger(state.active || { substance: sub.id, weight: state.form.weight, sex: state.form.sex, startedAt: new Date().toISOString(), entries: [] }, sub);
  }

  function formatElapsed(minutes) {
    const totalSec = Math.floor(minutes * 60);
    const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function renderHistory() {
    const sessions = [...state.sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    const overall = buildOverallHistoryAI(sessions);
    return `<section>
      <div class="section-title"><h1>${t('historyTitle')}</h1><p>${t('historyOnPhone')}</p></div>
      ${renderAICard(overall, t('compassTitle'))}
      <article class="card-xl"><div class="card-head"><h2>${t('archivedSessions')}</h2><button class="ghost-btn" onclick="RDR.clearHistory()">${t('clearHistory')}</button></div>${sessions.length ? sessions.map(renderHistoryItem).join('') : `<div class="why-read-card"><b>${t('whyHistoryTitle')}</b><p>${t('whyHistoryBody')}</p></div>`}</article>
      <article class="card-xl privacy"><h2>${t('privacyTitle')}</h2><p>${t('privacyText')}</p></article>
    </section>`;

  function renderHistoryItem(s) {
    const sub = getSubstance(s.substance);
    const doseInfo = totalKnownDose(s);
    const level = classifyDose(s.substance, doseInfo.total || s.dose, doseInfo.known);
    const alerts = scanHistoryForSession(s, state.sessions).slice(0, 2);
    return `<div class="history-item"><div><b>${escapeHTML(sub.name)}</b><span>${new Date(s.startedAt).toLocaleString(localeDateCode(), {dateStyle:'medium', timeStyle:'short'})}</span></div><div><span class="badge ${level.className}">${doseInfo.known ? `${doseInfo.total || s.dose}${sub.unit}` : t('unknownDose')}</span></div>${alerts.map(a => `<p class="history-alert ${a.type}">${escapeHTML(a.text)}</p>`).join('')}<button class="small-btn" onclick="RDR.reuseSession('${s.id}')">${t('reuseSession')}</button><button class="small-btn ghost" onclick="RDR.deleteSession('${s.id}')">${t('deleteSession')}</button></div>`;
  }

  function buildOverallHistoryAI(sessions) {
    if (!sessions.length) return state.lang === 'en'
      ? ['No local data yet: the tracker cannot detect rhythm, overlap or recovery patterns.', 'When you archive a session, it stays on this device and only feeds this local reading.']
      : ['Aucune donnée locale : le suivi ne peut pas encore repérer les rythmes, recouvrements ou récupérations difficiles.', 'Quand tu archives une session, elle reste sur ce téléphone et nourrit uniquement cette lecture locale.'];
    const sorted = [...sessions].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));
    const last = sorted[0];
    const counts = sessions.reduce((acc, s) => (acc[s.substance] = (acc[s.substance] || 0) + 1, acc), {});
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    const lastDays = Math.round((Date.now() - new Date(last.startedAt).getTime()) / 864e5);
    const recent30 = sessions.filter(s => (Date.now() - new Date(s.startedAt).getTime()) / 864e5 < 30).length;
    if (state.lang === 'en') {
      const lines = [`${sessions.length} archived session(s). Most frequent substance: ${getSubstance(top[0]).short} (${top[1]}).`];
      lines.push(`Last session: ${getSubstance(last.substance).short}, ${lastDays} day(s) ago.`);
      if (recent30 >= 3) lines.push('Dense recent rhythm: watch sleep, mood, motivation, anxiety, tolerance and the urge to “fix” a comedown with another session.');
      else lines.push('No very dense frequency pattern detected in the last 30 days. Keep recovery visible and do not infer zero risk.');
      return lines;
    }
    const lines = [`${sessions.length} session(s) enregistrée(s). Substance la plus fréquente : ${getSubstance(top[0]).short} (${top[1]}).`];
    lines.push(`Dernière session : ${getSubstance(last.substance).short}, il y a ${lastDays} j.`);
    if (recent30 >= 3) lines.push('Rythme récent dense : surveiller sommeil, humeur, motivation, anxiété, tolérance et envie de “corriger” une descente par une autre prise.');
    else lines.push('Aucun motif de fréquence très dense détecté dans les 30 derniers jours. La récupération reste à rendre visible, sans conclure à un risque zéro.');
    return lines;
  }

  function renderGuideSheet() {
    const session = state.active;
    const lines = session ? buildSessionAI(session) : buildDocAI(state.selected);
    const urgentKeywords = ['urgence', 'critique', '112', 'pause', 'refroidir', 'appeler', 'PLS', 'température ≥', 'respiration', 'urgent', 'call'];
    return `<div class="modal-backdrop" onclick="RDR.closeGuide(event)"><section class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>${t('compassTitle')}</h1><p style="color:var(--muted);font-size:13px;margin-bottom:14px;">${t('compassDisclaimer')} ${t('compassSub')}</p><div class="compass-card card-xl"><div class="compass-icon">↗</div><div>${lines.map(l => { const isUrgent = urgentKeywords.some(kw => l.toLowerCase().includes(kw.toLowerCase())); const text = isUrgent ? (t('signalToWatch') + l.replace(/^Signal à surveiller :\s*/,'')).trim() : l; return isUrgent ? `<p style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:700;">${wrapGlossaire(text)}</p>` : `<p>${wrapGlossaire(text)}</p>`; }).join('')}</div></div><button class="primary-btn full" onclick="RDR.closeGuide()">${t('compassOk')}</button></section></div>`;
  }

  function renderSOS() {
    return `<div class="modal-backdrop" onclick="RDR.closeSOS(event)"><section class="sheet sos-sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>${t('sosTitle')}</h1><div class="call-grid"><a class="call-btn" href="tel:112">112</a><a class="call-btn" href="tel:15">15</a><a class="call-btn" href="tel:18">18</a><a class="call-btn" href="tel:0800231313">Drogues Info</a></div><ol class="sos-steps"><li><b>${t('consciousBreathing')}</b><p>${t('sosStep1')}</p></li><li><b>${t('sosInfo')}</b><p>${t('sosStep2')}</p></li><li><b>${t('safeSpace')}</b><p>${t('sosStep3')}</p></li><li><b>${t('facilitation')}</b><p>${t('sosStep4')}</p></li></ol><button class="primary-btn full" onclick="RDR.closeSOS()">${t('sosClose')}</button></section></div>`;

  function renderInstallSheet() {
    return `<div class="modal-backdrop" onclick="RDR.closeInstall(event)"><section class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>${t('installShareTitle')}</h1><p>${t('installShareBody')}</p><div class="install-steps"><div><b>1</b><span>${t('installStep1')}</span></div><div><b>2</b><span>${t('installStep2')}</span></div><div><b>3</b><span>${t('installStep3')}</span></div></div>${deferredPrompt ? `<button class="primary-btn full" onclick="RDR.installPWA()">${t('installNow')}</button>` : `<button class="ghost-btn full" onclick="RDR.copyInstallText()">${t('copyFriendMessage')}</button>`}<button class="small-btn full" onclick="RDR.closeInstall()">${t('close')}</button></section></div>`;
  }

  function renderDisclaimer() {
    const step = state.onboardingStep || 1;
    const slides = [
      { title: t('onboarding1Title'), body: t('onboarding1Body'), cta: t('next') },
      { title: t('onboarding2Title'), body: t('onboarding2Body'), cta: t('next') },
      { title: t('onboarding3Title'), body: t('onboarding3Body'), cta: t('begin') }
    ];

  function metricAlert(metric) {
    const alerts = [];
    const hr = Number(metric.hr), temp = Number(metric.temp);
    if (hr >= 130) alerts.push('FC critique déclarée');
    if (temp >= 38.5) alerts.push('Température critique déclarée');
    return alerts;
  }

  const RDR = {
    render,
    go(view) {
      state.view = view;
      state.installOpen = false;
      state.matrixTooltip = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (view === 'interactions') {
        requestAnimationFrame(() => document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    },
    selectSubstance(id, tab = 'overview') { state.selected = id; state.docTab = tab || state.docTab; state.videoIndex = 0; state.matrixTooltip = null; state.view = 'doc'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    setDocTab(tab) { state.docTab = tab; state.videoIndex = 0; render(); },
    setSessionTab(tab) { state.sessionTab = tab; render(); },
    openCompanion() { state.view = 'companion'; state.installOpen = false; state.matrixTooltip = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    setVideo(i) {
      state.videoIndex = Number(i) || 0;
      render();
      requestAnimationFrame(() => document.querySelector('.chapter.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }));
    },
    toggleVideoAuto() { if (videoTimer) { clearInterval(videoTimer); videoTimer = null; render(); return; } const sub = substances[state.selected]; videoTimer = setInterval(() => { state.videoIndex = (state.videoIndex + 1) % sub.video.length; render(); requestAnimationFrame(() => document.querySelector('.chapter.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' })); }, 3200); render(); },
    setDocDose(v) { state.docDose = v; scheduleRender(); },
    setDocWeight(v) { state.docWeight = v; scheduleRender(); },
    setDocSex(v) { state.docSex = v; render(); },
    matrixTap(a, b, event) {
      if (event) {
        event.preventDefault?.();
        event.stopPropagation?.();
      }
      const sameCell = state.matrixTooltip && state.matrixTooltip.a === a && state.matrixTooltip.b === b;
      if (sameCell) {
        state.matrixTooltip = null;
        state.interactionA = a;
        state.interactionB = b;
        RDR.go('interactions');
        requestAnimationFrame(() => {
          document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      } else {
        state.matrixTooltip = { a, b };
        render();
        requestAnimationFrame(() => {
          const box = document.querySelector('.matrix-tooltip-box');
          const details = document.querySelector('.matrix-details[open]');
          (box || details)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }
    },
    setInteractionA(v) {
      state.interactionA = v;
      state.matrixTooltip = null;
      render();
      requestAnimationFrame(() => {
        document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    },
    setInteractionB(v) {
      state.interactionB = v;
      state.matrixTooltip = null;
      render();
      requestAnimationFrame(() => {
        document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    },
    setInteractionPair(a, b) {
      state.interactionA = a;
      state.interactionB = b;
      state.matrixTooltip = null;
      render();
      requestAnimationFrame(() => {
        document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  function renderV16LearningPaths() {
    return `<article class="card-xl"><div class="card-head"><div><h2>${t('learningPathsTitle')}</h2><p class="subtitle">${t('v16NoWall')}</p></div><span class="badge info">${t('v16MiniPath')}</span></div><div class="v16-path-row"><button class="learning-path-card" onclick="RDR.selectSubstance('mdma','neuro')"><i>🧠</i><span><b>${t('v16ReadPathScience')}</b><small>SERT · 5‑HT2A · NMDA</small></span><span>›</span></button><button class="learning-path-card" onclick="RDR.go('interactions')"><i>⚡</i><span><b>${t('v16ReadPathMix')}</b><small>${t('quickPairsTitle')}</small></span><span>›</span></button><button class="learning-path-card" onclick="RDR.go('history')"><i>🌙</i><span><b>${t('v16ReadPathRecovery')}</b><small>J+1 · J+3 · J+7</small></span><span>›</span></button><button class="learning-path-card" onclick="RDR.openCompanion()"><i>🆘</i><span><b>${t('v16ReadPathSupport')}</b><small>112 · 15 · ${t('safeSpace')}</small></span><span>›</span></button></div></article>`;
  }

  renderHome = function() {
    const registry = typeof SUBSTANCE_REGISTRY !== 'undefined' ? SUBSTANCE_REGISTRY : {};
    const psy = Object.keys(registry).filter(k => registry[k].category === 'psy').map(k => substances[k]).filter(Boolean);
    const stimDep = Object.keys(registry).filter(k => registry[k].category === 'stimDep').map(k => substances[k]).filter(Boolean);
    return `<section class="v16-home"><div class="hero wow-card"><div class="orbital"><span></span><span></span><span></span></div><div class="hero-copy"><span class="eyebrow">${t('homeEyebrow')}</span><h1>${t('homeTitle')}</h1><p>${t('homeSubtitle')}</p></div></div>${renderV16IntentCards()}<div class="v16-promise-card"><b>${t('v16PromiseTitle')}</b><p>${t('v16PromiseBody')}</p></div>${state.pwaUpdateAvailable ? renderPWAUpdateBanner() : ''}${state.contentUpdateAvailable ? `<div class="alert info">${t('newContentAvailable')}</div>` : ''}${state.expert ? `<p class="compact-note" style="text-align:center;color:var(--info);">${t('expertActiveNote')}</p>` : ''}${renderV16LearningPaths()}<details class="v16-compact-library"><summary>${t('v16LibrarySummary')}</summary><div class="section-title"><h2>${t('sectionPsy')}</h2><p>${t('substanceSubtitle')}</p></div><div class="substance-grid">${psy.map(s => renderSubstanceCard(s)).join('')}</div><div class="section-title"><h2>${t('sectionStimDep')}</h2><p>${t('sectionStimDepSub')}</p></div><div class="substance-grid substance-grid-secondary">${stimDep.map(s => renderSubstanceCard(s)).join('')}</div></details><div class="ai-card card-xl assistant-trigger" role="button" tabindex="0" onclick="RDR.openGuide()" onkeydown="if(event.key==='Enter'||event.key===' '){RDR.openGuide()}"><div class="compass-icon">↗</div><div><h3>${t('compassTitle')}</h3><p>${t('compassSub')}</p><p class="compact-note" style="margin-top:6px;">${compassHomeHistoryText()}</p></div></div><article class="card-xl update-status-card"><h2>${t('githubUpdateTitle')}</h2><p class="muted">${t('githubUpdateBody')}</p><p class="compact-note">${t('githubCurrentVersion')} : ${APP_VERSION}${state.remoteVersion ? ` · ${t('githubRemoteVersion')} : ${escapeHTML(state.remoteVersion)}` : ''}</p><button class="ghost-btn full" onclick="RDR.checkRemoteVersion(true)">${t('updateCheckNow')}</button></article></section>`;
  };

  const v16PreviousDocOverview = renderDocOverview;
  renderDocOverview = function(sub) {
    return `<div class="stack">${scientificNote()}${renderV16Essential(sub)}<article class="card-xl"><h2>${t('v16KnownEstimated')}</h2><p class="muted">${t('knownEstimatedBody') || t('v16CoreKeptBody')}</p><div class="v16-essential-actions"><button class="ghost-btn" onclick="RDR.setDocTab('dose')">${t('tabDose')}</button><button class="ghost-btn" onclick="RDR.setDocTab('mix')">${t('tabInteractions')}</button></div></article><details class="v16-core-details"><summary>${t('v16DeepCore')} — ${t('v16KeepReading')}</summary><div class="v16-core-inner"><p class="compact-note">${t('v16CoreIntro')}</p>${v16PreviousDocOverview(sub)}</div></details></div>`;
  };

  renderNeuroDeep = function(sub) {
    const modules = learningAtlas[sub.id] || learningAtlas[chartKey(sub.id)] || [];
    if (modules.length === 0) {
      return `<div class="stack"><article class="card-xl"><h2>${t('neuroTitle')}</h2><p class="muted">${t('neuroEmptyLong')} ${escapeHTML(sub.short)}.</p><button class="ghost-btn" onclick="RDR.setDocTab('overview')">${t('neuroBack')}</button></article></div>`;
    }
    const total = modules.length;
    const read = modules.filter((m, i) => moduleRead(sub.id, m, i)).length;
    const progressBadge = `<span id="module-progress-${sub.id}" class="badge ${read === total ? 'safe' : 'info'}">${read}/${total}</span>`;
    return `<div class="stack"><article class="card-xl v16-neuro-header"><div class="card-head"><div><h2>${t('neuroTitle')}</h2><p class="subtitle">${t('v16Aha')}</p></div>${progressBadge}</div><div class="mode-toggle-row"><button class="${!state.expert ? 'active' : ''}" onclick="RDR.setExpert(false)">${t('modeSimple')}</button><button class="${state.expert ? 'active' : ''}" onclick="RDR.setExpert(true)">${t('modeExpert')}</button><span class="subtitle">${t('v16CoreKept')}</span></div></article><div class="neuro-grid">${modules.map((m, idx) => { const plain = m.plain || []; const expert = m.expert || []; const isLast = idx === modules.length - 1; const nextModule = !isLast ? modules[idx + 1] : null; const lead = v16Sentences(plain[0] || m.subtitle || m.title, 1); const bodyItems = plain.slice(1, 3); const systemLabel = m.critical ? t('urgentMedical') : escapeHTML(m.system || t('brainDefault')); return `<article class="card-xl deep-card neuro-module ${m.critical ? 'neuro-module-critical danger-zone' : ''}" data-sub="${sub.id}" id="neuro-module-${sub.id}-${idx}"><div class="module-step-label">${t('moduleStepLabel')} ${idx + 1}/${modules.length}</div><div class="card-head"><div><h2>${escapeHTML(m.title)}</h2><p class="subtitle">${escapeHTML(m.subtitle || '')}</p></div><span class="deep-pill ${m.critical ? 'badge critical' : ''}">${systemLabel}</span></div>${renderMechanismSvg(sub, m.visual || 'receptor', 0)}${(sub.id === 'alcool' && /sevrage|Delirium/i.test(m.title || '')) ? '<a class="call-btn full" href="tel:15">🚨 ' + t('samuEmergency') + '</a>' : ''}<div class="v16-mini-lesson"><div class="v16-lesson-card lead"><b>${t('v16FastTakeaway')}</b><p>${wrapGlossaire(lead)}</p></div><div class="v16-lesson-card"><b>${t('v16InBody')}</b>${bodyItems.length ? `<ul>${bodyItems.map(x => `<li>${wrapGlossaire(v16Trim(x, 190))}</li>`).join('')}</ul>` : `<p>${wrapGlossaire(v16Sentences(plain[0] || '', 2))}</p>`}</div><div class="v16-lesson-card warn"><b>${t('v16WhyRisk')}</b><p>${wrapGlossaire(whyItMattersNowText(sub.id, m, idx))}</p></div><div class="v16-lesson-card action"><b>${t('v16Action')}</b><p>${wrapGlossaire(t('v16NoWall'))}</p></div></div><details class="v16-core-details" ontoggle="if(this.open){RDR.markModuleRead('${sub.id}',${idx})}"><summary>${t('v16CoreExplanation')} — ${t('v16KeepReading')}</summary><div class="v16-core-inner"><div class="v16-core-plain">${plain.map(x => `<p>${wrapGlossaire(x)}</p>`).join('')}</div></div></details><details ${state.expert ? 'open' : ''} ontoggle="if(this.open){RDR.markModuleRead('${sub.id}',${idx})}"><summary class="details-summary"><span class="badge info expert-pill">🔬</span> ${t('v16ExpertDetail')}</summary><ul>${expert.map(x => `<li>${wrapGlossaire(x)}</li>`).join('')}</ul></details>${nextModule ? `<button class="ghost-btn full" style="margin-top:12px;" onclick="RDR.markModuleRead('${sub.id}',${idx}); (function(){ const el = document.getElementById('neuro-module-${sub.id}-${idx + 1}'); if(el){ const top = el.getBoundingClientRect().top + window.scrollY - 140; window.scrollTo({top, behavior:'smooth'}); }})()">${t('nextModule')} : ${escapeHTML(nextModule.title)} →</button>` : `<div class="alert safe" style="margin-top:12px;text-align:center;font-weight:900;">✓ ${t('allModulesRead').replace('{sub}', escapeHTML(sub.short))}</div><button class="ghost-btn full" onclick="RDR.setDocTab('recovery')">${t('ctaRecovery')}</button>`}</article>`; }).join('')}</div></div>`;
  };

  const v16PreviousSessionTabNow = renderSessionTabNow;
  renderSessionTabNow = function(session, sub, phase, elapsed, level) {
    return `<div class="stack"><article class="card-xl v16-promise-card"><b>${t('v16SessionFocusTitle')}</b><p>${t('v16SessionFocusBody')}</p></article>${v16PreviousSessionTabNow(session, sub, phase, elapsed, level)}</div>`;
  };


  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    render();
  });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').then(reg => {
        window.tripSafeSWRegistration = reg;
        reg.update().catch(() => {});
        if (reg.waiting) { state.pwaUpdateAvailable = true; render(); }
        reg.addEventListener('updatefound', () => {
          const worker = reg.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              state.pwaUpdateAvailable = true;
              render();
            }
          });
        });
      }).catch(() => {});
    });
  }


  window.addEventListener('scroll', scheduleDocCompactUpdate, { passive: true });

  document.addEventListener('click', (e) => {
    const gloss = e.target.closest && e.target.closest('.gloss');
    if (gloss) {
      e.preventDefault();
      e.stopPropagation();
      state.glossTooltip = { text: gloss.getAttribute('data-def') || gloss.getAttribute('title') || '' };
      render();
      return;
    }
    if (state.glossTooltip && !(e.target.closest && e.target.closest('.gloss-tooltip-box'))) {
      state.glossTooltip = null;
      render();
    }
  });
  render();
  if (state.active) startTimerLoop();
})();
</script>
</body>
</html>
