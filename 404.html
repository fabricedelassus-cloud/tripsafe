<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta name="description" content="TripSafe RdR Mobile v8 - réduction des risques, pédagogie neuro et interactions complètes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>TripSafe RdR — v8</title>
  <style>:root {
  --bg: #090d1a;
  --bg2: #0f172a;
  --surface: rgba(20, 30, 54, .76);
  --surface-solid: #111827;
  --surface-2: rgba(255, 255, 255, .07);
  --text: #f8fafc;
  --muted: #a7b4c8;
  --line: rgba(255, 255, 255, .13);
  --shadow: 0 24px 80px rgba(0,0,0,.38);
  --info: #6366f1;
  --safe: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --critical: #7f1d1d;
  --classic: #0891b2;
  --ketamine: #7c3aed;
  --serotonin: #d946ef;
  --radius: 26px;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
  --sans: ui-rounded, "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #eef2ff;
  --surface: rgba(255, 255, 255, .86);
  --surface-solid: #ffffff;
  --surface-2: rgba(15, 23, 42, .05);
  --text: #0f172a;
  --muted: #53627a;
  --line: rgba(15, 23, 42, .13);
  --shadow: 0 24px 60px rgba(15,23,42,.14);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); color: var(--text); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(circle at 10% -10%, rgba(217,70,239,.30), transparent 28rem),
    radial-gradient(circle at 100% 5%, rgba(8,145,178,.24), transparent 22rem),
    radial-gradient(circle at 50% 105%, rgba(16,185,129,.18), transparent 26rem),
    linear-gradient(180deg, var(--bg2), var(--bg));
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--info) 70%, white); outline-offset: 2px; }

.noscript { max-width: 560px; padding: 24px; margin: 0 auto; }
.app-shell { width: min(100%, 560px); min-height: 100svh; margin: 0 auto; padding: env(safe-area-inset-top) 14px calc(98px + env(safe-area-inset-bottom)); }
.screen { padding-bottom: 16px; }
.enter { animation: enter .28s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0 10px;
  backdrop-filter: blur(24px);
}
.brand { border: 0; background: transparent; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0; text-align: left; cursor: pointer; }
.brand b { display: block; letter-spacing: -.03em; font-size: 16px; }
.brand small { display: block; color: var(--muted); font-size: 11px; margin-top: -2px; }
.logo-orb { width: 46px; height: 46px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(217,70,239,.9), rgba(8,145,178,.85)); box-shadow: 0 12px 35px rgba(99,102,241,.35); }
.logo-orb span { width: 19px; height: 19px; border-radius: 999px; border: 3px solid #fff; border-top-color: transparent; animation: spin 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn, .sos-mini, .primary-btn, .ghost-btn, .small-btn, .danger-btn, .call-btn {
  min-height: 44px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  background: var(--surface); box-shadow: 0 10px 30px rgba(0,0,0,.12); color: var(--text);
}
.icon-btn { width: 44px; padding: 0; }
.sos-mini { background: rgba(239,68,68,.18); color: #fecaca; border-color: rgba(239,68,68,.42); font-weight: 900; padding: 0 14px; }
.primary-btn { background: linear-gradient(135deg, var(--info), var(--classic)); border: 0; color: white; font-weight: 900; padding: 0 18px; }
.ghost-btn { padding: 0 16px; }
.small-btn { min-height: 38px; padding: 0 12px; font-size: 13px; }
.small-btn.ghost { background: transparent; }
.danger-btn { background: rgba(239,68,68,.18); color: #fecaca; border-color: rgba(239,68,68,.35); padding: 0 18px; font-weight: 900; }
.full { width: 100%; margin-top: 12px; }
button:active, .call-btn:active { transform: translateY(1px); }

.hero, .card-xl, .ai-card, .doc-header, .video-card, .live-hero, .install-banner, .substance-card, .interaction-result, .metric-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(24px);
}
.wow-card { position: relative; min-height: 370px; overflow: hidden; padding: 22px; display: flex; align-items: flex-end; }
.hero-copy { position: relative; z-index: 2; }
.eyebrow { display: inline-flex; width: max-content; max-width: 100%; min-height: 28px; align-items: center; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 900; color: #dbeafe; background: rgba(99,102,241,.24); border: 1px solid rgba(99,102,241,.35); }
.hero h1, .doc-header h1, .section-title h1, .live-hero h1 { margin: 10px 0 8px; font-size: clamp(35px, 12vw, 58px); line-height: .88; letter-spacing: -.075em; }
.hero p, .doc-header p, .section-title p, .live-hero p, .muted { color: var(--muted); margin: 0; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.orbital { position: absolute; inset: -30px -40px auto auto; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.18), rgba(217,70,239,.26) 28%, rgba(8,145,178,.20) 54%, transparent 70%); filter: blur(.2px); animation: float 8s ease-in-out infinite; }
.orbital span { position: absolute; border: 1px solid rgba(255,255,255,.20); border-radius: 50%; inset: 12%; animation: spin 16s linear infinite; }
.orbital span:nth-child(2) { inset: 26%; animation-duration: 12s; animation-direction: reverse; }
.orbital span:nth-child(3) { inset: 41%; background: rgba(255,255,255,.8); box-shadow: 0 0 40px rgba(255,255,255,.5); }
@keyframes float { 50% { transform: translate3d(-10px, 18px, 0) scale(1.04); } }

.install-banner { margin: 12px 0 18px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.install-banner p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.section-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 2px 12px; }
.section-title h1, .section-title h2 { margin: 0; letter-spacing: -.055em; }
.section-title h2 { font-size: 24px; }
.section-title p { font-size: 13px; max-width: 260px; }

.substance-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.substance-card { min-height: 168px; padding: 15px; text-align: left; border: 1px solid var(--line); cursor: pointer; overflow: hidden; position: relative; }
.substance-card::after { content: ''; position: absolute; right: -28px; top: -28px; width: 110px; height: 110px; border-radius: 50%; background: var(--classic); opacity: .18; }
.substance-card.serotonin::after { background: var(--serotonin); }
.substance-card.ketamine::after { background: var(--ketamine); }
.substance-card h3 { margin: 12px 0 6px; font-size: 19px; line-height: 1; letter-spacing: -.045em; }
.substance-card p { margin: 0; font-size: 12px; color: var(--muted); }
.mini-row { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }

.badge, .route-pill, .back-chip, .rail-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; max-width: 100%;
  border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 900; line-height: 1; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
}
.badge.safe, .badge.safe-soft, .risk-code.safe, .risk-code.safe-soft { background: rgba(16,185,129,.18); color: #bbf7d0; }
.badge.info { background: rgba(99,102,241,.24); color: #dbeafe; }
.badge.warn { background: rgba(245,158,11,.22); color: #fde68a; }
.badge.danger { background: rgba(239,68,68,.22); color: #fecaca; }
.badge.critical { background: rgba(127,29,29,.72); color: #fff; }
.badge.classic { background: rgba(8,145,178,.24); color: #cffafe; }
.badge.ketamine { background: rgba(124,58,237,.24); color: #ddd6fe; }
.badge.serotonin { background: rgba(217,70,239,.24); color: #fae8ff; }
.badge.neutral { background: rgba(148,163,184,.18); color: var(--text); }
.route-pill { flex: none; min-height: 36px; padding-inline: 12px; overflow: visible; }
.back-chip { margin-bottom: 8px; min-height: 34px; }

.doc-header { margin-top: 8px; padding: 18px; overflow: visible; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(255,255,255,.03)), var(--surface); }
.doc-header.classic { background: linear-gradient(135deg, rgba(8,145,178,.22), rgba(255,255,255,.03)), var(--surface); }
.doc-header.serotonin { background: linear-gradient(135deg, rgba(217,70,239,.24), rgba(99,102,241,.14)), var(--surface); }
.doc-header.ketamine { background: linear-gradient(135deg, rgba(124,58,237,.26), rgba(255,255,255,.03)), var(--surface); }
.doc-header h1 { font-size: clamp(32px, 10vw, 52px); }
.substance-rail { display: flex; overflow-x: auto; gap: 8px; padding: 12px 2px 4px; scrollbar-width: none; }
.substance-rail::-webkit-scrollbar { display: none; }
.rail-chip { border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; flex: 0 0 auto; }
.rail-chip.active { background: rgba(99,102,241,.34); }
.segmented { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 12px; scrollbar-width: none; }
.segmented::-webkit-scrollbar { display: none; }
.segmented button { flex: 0 0 auto; min-height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); font-weight: 800; cursor: pointer; }
.segmented button.active { color: white; background: linear-gradient(135deg, var(--info), var(--classic)); border-color: transparent; }

.stack { display: grid; gap: 12px; }
.card-xl, .ai-card, .video-card { padding: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
h2, h3 { margin: 0 0 8px; letter-spacing: -.045em; line-height: 1.05; }
p { margin: 8px 0; }
ul { margin: 8px 0 0; padding-left: 18px; }
li { margin: 6px 0; }
.info-grid, .effect-grid, .form-grid, .metric-grid, .risk-grid { display: grid; gap: 10px; }
.info-grid { grid-template-columns: 1fr; }
.effect-grid { grid-template-columns: 1fr; }
.effect-card, .phase-card { border: 1px solid var(--line); background: var(--surface-2); border-radius: 18px; padding: 12px; }
.effect-card b, .phase-card span { font-weight: 900; }
.danger-zone { border-color: rgba(239,68,68,.35); }
.heart-card { border-color: rgba(217,70,239,.28); }

.ai-card { display: flex; align-items: flex-start; gap: 12px; background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(8,145,178,.12)), var(--surface); }
.ai-avatar { flex: 0 0 44px; height: 44px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, var(--info), var(--serotonin)); color: white; font-family: var(--mono); font-weight: 900; }
.ai-card p { color: var(--muted); font-size: 13px; margin: 6px 0; }

.video-card { overflow: hidden; position: relative; }
.video-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mechanism { width: 100%; display: block; border-radius: 22px; background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.10), rgba(255,255,255,.03) 44%, rgba(0,0,0,.14)); border: 1px solid var(--line); overflow: hidden; }
.mechanism text { fill: currentColor; font: 700 12px var(--mono); opacity: .82; }
.neuron, .lung, .gut, .room, .scale, .clock { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.45); stroke-width: 2; }
.post { fill: rgba(8,145,178,.14); }
.particles circle, .ions circle, .molecule { fill: #f0abfc; filter: url(#glow); animation: particle 2.2s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .08s); }
.mechanism.classic .particles circle, .mechanism.classic .molecule { fill: #67e8f9; }
.mechanism.ketamine .particles circle, .mechanism.ketamine .molecule { fill: #c4b5fd; }
@keyframes particle { 50% { transform: translate(10px, -8px); opacity: .55; } }
.gate, .channel, .display { fill: rgba(99,102,241,.24); stroke: rgba(255,255,255,.4); }
.membrane, .pulse path, .signal, .wave { fill: none; stroke: rgba(255,255,255,.50); stroke-width: 4; stroke-linecap: round; }
.receptor path, .receptor ellipse { fill: none; stroke: #93c5fd; stroke-width: 5; stroke-linecap: round; }
.signal { stroke: #a7f3d0; stroke-dasharray: 12 10; animation: dash 1.5s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -44; } }
.blocker { fill: #c4b5fd; filter: url(#glow); }
.heart-shape { fill: rgba(239,68,68,.30); stroke: #fecaca; stroke-width: 3; transform-origin: 210px 115px; animation: beat 1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.06); } }
.pulse path { stroke: #fca5a5; stroke-dasharray: 520; animation: pulse 1.6s linear infinite; }
@keyframes pulse { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
.temp { fill: #f59e0b; filter: url(#glow); }
.warning-tri { fill: rgba(245,158,11,.18); stroke: #fbbf24; stroke-width: 4; }
.warn-mark { font: 900 82px var(--sans) !important; fill: #fbbf24 !important; }
.hand { stroke: #fff; stroke-width: 6; stroke-linecap: round; transform-origin: 210px 105px; animation: spin 12s linear infinite; }
.h2 { animation-duration: 4s; }
.progress-line { height: 8px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; margin: 12px 0; }
.progress-line span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--serotonin), var(--classic)); transition: width .25s ease; }
.video-script { font-size: 15px; }
.chapter-row { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0 0; scrollbar-width: none; }
.chapter { flex: 0 0 112px; min-height: 72px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); text-align: left; padding: 10px; font-size: 12px; font-weight: 800; }
.chapter span { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.12); margin-bottom: 6px; color: var(--text); }
.chapter.active { color: var(--text); border-color: rgba(99,102,241,.55); background: rgba(99,102,241,.18); }

.phase-cards { display: grid; gap: 9px; margin-top: 12px; }
.phase-cards.detailed { grid-template-columns: 1fr; }
.phase-card p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.phase-card.active { border-color: rgba(99,102,241,.65); background: rgba(99,102,241,.16); }

label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
input, select, textarea { width: 100%; min-height: 46px; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
textarea { resize: vertical; }
[data-theme="light"] input, [data-theme="light"] select, [data-theme="light"] textarea { background: #fff; }
.form-grid { grid-template-columns: 1fr; margin-top: 10px; }
.form-grid.two-cols, .form-grid.three-cols { grid-template-columns: 1fr 1fr; }
.result-card { display: grid; gap: 4px; margin-top: 12px; padding: 16px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
.result-card span { color: var(--muted); font-size: 12px; font-weight: 900; }
.result-card b { font-size: 27px; letter-spacing: -.05em; }
.result-card em { font-family: var(--mono); font-style: normal; color: var(--muted); }
.result-card.warn { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.14); }
.result-card.danger, .result-card.critical { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.14); }
.result-card.safe { border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.12); }
.result-card.info { border-color: rgba(99,102,241,.5); background: rgba(99,102,241,.14); }

.alert, .friendly-warning, .action-strip { border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-top: 10px; background: var(--surface-2); }
.alert.safe { border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.12); }
.alert.warn, .friendly-warning { border-color: rgba(245,158,11,.42); background: rgba(245,158,11,.14); }
.alert.danger, .alert.critical { border-color: rgba(239,68,68,.48); background: rgba(239,68,68,.15); }
.alert.info { border-color: rgba(99,102,241,.42); background: rgba(99,102,241,.12); }

.timeline-wrap { margin: 12px 0; }
.timeline-bar { position: relative; display: flex; height: 48px; border-radius: 999px; padding: 4px; background: rgba(255,255,255,.08); overflow: hidden; border: 1px solid var(--line); }
.seg { display: grid; place-items: center; min-width: 48px; color: white; font-size: 10px; font-weight: 900; text-align: center; }
.seg:first-child { border-radius: 999px 0 0 999px; }
.seg:nth-last-child(2) { border-radius: 0 999px 999px 0; }
.seg.debut { background: rgba(99,102,241,.62); }
.seg.montee { background: rgba(217,70,239,.62); }
.seg.plateau { background: rgba(16,185,129,.62); }
.seg.descente { background: rgba(245,158,11,.68); }
.now-marker { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 999px; background: white; box-shadow: 0 0 18px white; }
.timeline-legend { display: grid; gap: 5px; margin-top: 8px; font-size: 11px; color: var(--muted); grid-template-columns: 1fr 1fr; }

.interaction-result { margin-top: 12px; padding: 14px; border-radius: 22px; }
.interaction-result.warn { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
.interaction-result.danger, .interaction-result.critical { border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.15); }
.interaction-result.safe, .interaction-result.safe-soft { border-color: rgba(16,185,129,.40); background: rgba(16,185,129,.10); }
.interaction-result.info { border-color: rgba(99,102,241,.40); background: rgba(99,102,241,.10); }
.risk-badge { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.risk-badge b { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 16px; background: rgba(255,255,255,.16); font-size: 24px; }
.risk-badge span { font-weight: 900; }
.mini-video { margin-top: 12px; overflow: hidden; }
.mini-video-rail { display: grid; gap: 8px; }
.mini-video-rail div { padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: rgba(0,0,0,.10); }
.mini-video-rail i { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.14); font-style: normal; font-weight: 900; margin-right: 8px; }
.mini-video-rail b { font-weight: 900; }
.mini-video-rail p { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.risk-grid { grid-template-columns: 1fr; }
.risk-code { border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
.risk-code b { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.13); }
.risk-code.warn { background: rgba(245,158,11,.12); }
.risk-code.danger { background: rgba(239,68,68,.12); }
.risk-code.critical { background: rgba(127,29,29,.45); }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-chip { min-height: 38px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); padding: 0 12px; cursor: pointer; font-size: 13px; font-weight: 800; }
.toggle-chip.active { background: rgba(99,102,241,.24); color: var(--text); border-color: rgba(99,102,241,.45); }
.live-hero { margin-top: 8px; padding: 18px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, rgba(99,102,241,.26), rgba(217,70,239,.16)), var(--surface); }
.live-hero h1 { font-size: clamp(31px, 9vw, 48px); }
.live-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 0 rgba(16,185,129,.8); animation: live 1.4s infinite; }
@keyframes live { 70% { box-shadow: 0 0 0 14px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
.metric-grid { grid-template-columns: 1fr 1fr 1fr; }
.metric-card { padding: 12px; border-radius: 20px; box-shadow: none; }
.metric-card span, .metric-card small { display: block; color: var(--muted); font-size: 11px; font-weight: 900; }
.metric-card b { display: block; font-family: var(--mono); font-size: 19px; margin: 5px 0; }
.metric-card.safe { border-color: rgba(16,185,129,.45); }
.metric-card.warn { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.12); }
.metric-card.critical { border-color: rgba(239,68,68,.55); background: rgba(239,68,68,.16); }
.entry-list { display: grid; gap: 8px; }

/* V2.1 interaction video layer */
.interaction-svg {
  width: 100%;
  display: block;
  border-radius: 22px;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.12), transparent 28%),
    radial-gradient(circle at 18% 18%, rgba(217,70,239,.16), transparent 34%),
    radial-gradient(circle at 82% 82%, rgba(6,182,212,.14), transparent 36%),
    rgba(255,255,255,.04);
  margin: 10px 0 12px;
  overflow: hidden;
}
.interaction-svg text { fill: var(--text); font: 900 12px var(--sans); pointer-events: none; }
.interaction-svg .mix-line { fill: none; stroke: rgba(255,255,255,.42); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 12; animation: dash 1.8s linear infinite; }
.interaction-svg .mix-line.ghost { opacity: .36; animation-direction: reverse; }
.interaction-svg .mix-orb { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.45); stroke-width: 2; filter: url(#mixGlow); }
.interaction-svg .mix-orb.a { animation: driftA 3.2s ease-in-out infinite; }
.interaction-svg .mix-orb.b { animation: driftB 3.2s ease-in-out infinite; }
@keyframes driftA { 50% { transform: translateX(13px); } }
@keyframes driftB { 50% { transform: translateX(-13px); } }
.interaction-svg .mix-core { fill: url(#mixGrad); opacity: .34; filter: url(#mixGlow); }
.interaction-svg .mix-pulse { fill: none; stroke: rgba(255,255,255,.40); stroke-width: 3; transform-origin: 210px 104px; animation: mixPulse 1.65s ease-in-out infinite; }
@keyframes mixPulse { 0% { transform: scale(.78); opacity: .75; } 100% { transform: scale(1.25); opacity: 0; } }
.interaction-svg .mix-code { font: 1000 42px var(--sans); fill: #fff; }
.interaction-svg .mix-caption { font: 800 13px var(--sans); fill: var(--muted); }
.interaction-svg.warn .mix-core { fill: #f59e0b; }
.interaction-svg.danger .mix-core,
.interaction-svg.critical .mix-core { fill: #ef4444; opacity: .44; }
.interaction-svg.safe .mix-core,
.interaction-svg.safe-soft .mix-core { fill: #10b981; }
.interaction-svg.info .mix-core { fill: #6366f1; }

/* ===== v3 neuro / contraste / anti-jank ===== */

/* Custom interaction selectors */

    const dose = parseFloat(String(doseRaw).replace(',', '.'));
    if (!Number.isFinite(dose) || dose <= 0) return { key: 'below', ...doseLevels.below, mgkg: null };
    const d = substances[substanceKey]?.doses;
    if (!d) return { key: 'unknown', ...doseLevels.unknown, mgkg: null };
    for (const key of ['threshold', 'light', 'common', 'strong', 'veryStrong']) {
      const [lo, hi] = d[key];
      if (dose >= lo && dose < hi) return { key, ...doseLevels[key], dose };
    }
    return { key: 'below', ...doseLevels.below, dose };
  }

  function computeDoseAlerts(subKey, doseRaw, weightRaw, sex, known = true, topupTotal = 0) {
    const alerts = [];
    const dose = known ? parseFloat(String(doseRaw).replace(',', '.')) || 0 : NaN;
    const total = known ? dose + (Number(topupTotal) || 0) : NaN;
    const weight = parseFloat(String(weightRaw).replace(',', '.')) || 0;
    const level = classifyDose(subKey, total || dose, known);
    if (!known) alerts.push({ type: 'critical', text: 'Dose non quantifiable : l’app ne convertit pas doigt/clé/ligne visuelle en mg. À traiter comme incertain.' });
    if (level.rank >= 4 && known) alerts.push({ type: level.rank >= 5 ? 'critical' : 'warn', text: `Niveau ${level.label.toLowerCase()} dans le tableau : contexte, sitter et absence de mélange deviennent essentiels.` });
    if (subKey === 'mdma' && known) {
      const mgkg = weight ? total / weight : null;
      if (total > 200) alerts.push({ type: 'critical', text: 'MDMA > 200 mg total déclaré : zone rouge dans le brief. Risque cardio/thermique et neurotoxique augmenté.' });
      else if (total > 120) alerts.push({ type: 'warn', text: 'MDMA > 120 mg total déclaré : vigilance renforcée, surtout chaleur, danse, reprises ou alcool.' });
      const limit = sex === 'F' ? 1.3 : 1.5;
      if (mgkg && mgkg > limit) alerts.push({ type: 'critical', text: `MDMA ${mgkg.toFixed(2)} mg/kg > seuil ${limit} mg/kg utilisé par l’app : prudence maximale.` });
      if (Number(topupTotal) > 0) alerts.push({ type: 'critical', text: 'Reprise MDMA déclarée : la cinétique peut devenir moins prévisible. Ne pas chercher à “retrouver” le premier plateau.' });
    }
    return alerts;
  }

  function phaseBoundaries(subKey) {
    const d = substances[subKey].durations;
    const onset = avg(d.onset), comeup = avg(d.comeup), plateau = avg(d.plateau), comedown = avg(d.comedown);
    return [
      { key: 'debut', label: 'Début', start: 0, end: onset },
      { key: 'montee', label: 'Montée', start: onset, end: onset + comeup },
      { key: 'plateau', label: 'Plateau', start: onset + comeup, end: onset + comeup + plateau },
      { key: 'descente', label: 'Descente', start: onset + comeup + plateau, end: onset + comeup + plateau + comedown },
      { key: 'apres', label: 'Rémanence', start: onset + comeup + plateau + comedown, end: onset + comeup + plateau + comedown + Math.min(avg(d.after), 360) }
    ];
  }

  function currentPhase(subKey, elapsedMin) {
    const phases = phaseBoundaries(subKey);
    return phases.find(p => elapsedMin >= p.start && elapsedMin < p.end) || phases[phases.length - 1];
  }

  function sessionStartDate(timeHHMM) {
    const [h, m] = String(timeHHMM || nowTime()).split(':').map(Number);
    const d = new Date();
    d.setHours(h || 0, m || 0, 0, 0);
    if (d.getTime() - Date.now() > 30 * 60 * 1000) d.setDate(d.getDate() - 1);
    return d.toISOString();
  }

  function totalKnownDose(session) {
    if (!session.knownDose) return { known: false, total: null };
    let total = Number(session.dose) || 0;
    for (const e of session.entries || []) {
      if (e.kind === 'topup') {
        if (!e.known) return { known: false, total };
        total += Number(e.amount) || 0;
      }
    }
    return { known: true, total };
  }

  function scanHistoryForSession(session, sessions = state.sessions) {
    const alerts = [];
    const start = new Date(session.startedAt).getTime();
    const same = sessions.filter(s => s.substance === session.substance).sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    const last = same.find(s => new Date(s.startedAt).getTime() < start && !s.deleted);
    const sub = substances[session.substance];
    if (last) {
      const deltaH = (start - new Date(last.startedAt).getTime()) / 36e5;
      const noOverlapH = (sub.durations.total[1] + sub.durations.after[1]) / 60 + 24;
      if (deltaH < noOverlapH) alerts.push({ type: 'critical', text: `Recouvrement probable : dernière session ${sub.short} il y a ${Math.round(deltaH)} h, alors que la fenêtre effets + rémanence + repos peut dépasser ${Math.round(noOverlapH)} h.` });
      if (session.substance === 'mdma') {
        const deltaD = deltaH / 24;
        if (deltaD < 28) alerts.push({ type: 'critical', text: `MDMA rapprochée : dernière session il y a ${Math.round(deltaD)} j. Récupération humeur/sommeil/sérotonine à surveiller.` });
        else if (deltaD < 90) alerts.push({ type: 'warn', text: `MDMA dans les 3 derniers mois : rythme à garder rare, surtout si fatigue, humeur basse ou doses/reprises.` });
      }
    }
    const last90 = sessions.filter(s => (start - new Date(s.startedAt).getTime()) / 864e5 < 90);
    if (last90.length >= 4) alerts.push({ type: 'warn', text: `${last90.length} sessions enregistrées sur 90 jours : l’app te propose de regarder sommeil, humeur, tolérance et récupération plutôt que seulement la dernière dose.` });
    return alerts;
  }

  function buildSessionAI(session) {
    const sub = substances[session.substance];
    if (!sub) return `<section><article class="card-xl"><h1>Session archivée incompatible v8</h1><p class="muted">Cette session concerne ${escapeHTML(labelOf(session.substance))}, une substance retirée de l’interface v8. Termine et archive ou efface-la depuis l’historique si besoin.</p><button class="danger-btn full" onclick="RDR.endSession()">Terminer et archiver</button></article></section>`;
    const elapsed = Math.max(0, (Date.now() - new Date(session.startedAt).getTime()) / 60000);
    const phase = currentPhase(session.substance, elapsed);
    const doseInfo = totalKnownDose(session);
    const level = classifyDose(session.substance, doseInfo.total || session.dose, doseInfo.known);
    const histAlerts = scanHistoryForSession(session);
    const recentMetric = [...(session.metrics || [])].pop();
    const lines = [];
    lines.push(`Tu es probablement en phase “${phase.label}” pour ${sub.short}. ${sub.phases[phase.key] || ''}`);
    if (doseInfo.known && doseInfo.total) lines.push(`Dose totale déclarée : ${doseInfo.total}${sub.unit}, niveau ${level.label.toLowerCase()} selon le tableau indicatif.`);
    else lines.push('Dose non quantifiée : je raisonne en mode prudence, sans conversion doigt/ligne/clé en milligrammes.');
    if (recentMetric?.hr) {
      const hr = Number(recentMetric.hr);
      lines.push(hr >= 130 ? 'Fréquence cardiaque très haute déclarée : pause, endroit frais, assistance si douleur thoracique/malaise/confusion.' : hr >= 110 ? 'Cœur accéléré : pause, respiration, moins de stimulation, endroit plus frais.' : 'Fréquence cardiaque déclarée dans une zone plutôt rassurante, à suivre avec le ressenti.');
    }
    if (recentMetric?.temp) {
      const t = Number(recentMetric.temp);
      lines.push(t >= 38.5 ? 'Température ≥ 38,5°C : c’est un signal d’urgence potentielle, refroidir et appeler si symptômes.' : t >= 37.8 ? 'Température en vigilance : s’éloigner de la chaleur, réduire danse/effort, se rafraîchir.' : 'Température déclarée sous les seuils d’alerte de l’app.');
    }
    if (histAlerts[0]) lines.push(histAlerts[0].text);
    return lines;
  }

  function buildDocAI(subKey) {
    const sub = substances[subKey];
    const sessions = state.sessions.filter(s => s.substance === subKey);
    const last = sessions.sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt))[0];
    const lines = [];
    lines.push(`À retenir pour ${sub.short} : le risque se joue sur dose + délai + contexte + mélanges, pas sur une seule variable.`);
    if (subKey === 'mdma') lines.push('Avec la MDMA, les deux signaux à surveiller en priorité sont ton rythme cardiaque et ta température corporelle. Quand tu danses, que tu as chaud, que tu as pris de l’alcool ou que tu reprends une dose, ces deux indicateurs peuvent monter sans que tu t’en rendes compte. Fais des pauses régulières, cherche un endroit frais, hydrate-toi normalement.');
    else if (subKey === 'ketamine') lines.push('Le capteur principal est la sécurité physique : chute, vomissement, sédation et mélanges dépresseurs comptent autant que la dose.');
    else lines.push('Le set and setting est un “amplificateur” : musique, lumière, foule, fatigue et entourage peuvent transformer l’expérience.');
    if (last) {
      const days = Math.round((Date.now() - new Date(last.startedAt).getTime()) / 864e5);
      lines.push(`Historique local : dernière session ${sub.short} enregistrée il y a ${days} j. Cette donnée reste sur ce téléphone.`);
    } else {
      lines.push('Aucune session enregistrée pour cette substance sur ce téléphone : l’app ne personnalise pas encore la récupération.');
    }
    return lines;
  }

  function renderDoseDoc(sub) {
    const known = state.docDose !== 'unknown';
    const level = classifyDose(sub.id, state.docDose, known);
    const weight = parseFloat(state.docWeight) || 0;
    const dose = parseFloat(String(state.docDose).replace(',', '.')) || 0;
    const mgkg = sub.id === 'mdma' && weight && dose ? (dose / weight).toFixed(2) : null;
    const alerts = computeDoseAlerts(sub.id, state.docDose, state.docWeight, state.docSex, known, 0);
    return `<div class="stack">
      <article class="card-xl dose-lab">
        <div class="card-head"><h2>Dose verrouillée sur ${escapeHTML(sub.name)}</h2><span class="route-pill">${escapeHTML(sub.routeDefault)} • ${escapeHTML(sub.unit)}</span></div>

        <div class="form-grid">
          <label>Dose envisagée / déclarée (${escapeHTML(sub.unit)})<input id="input-doc-dose" type="number" inputmode="decimal" value="${escapeHTML(state.docDose)}" placeholder="ex. ${sub.id === 'champignons' ? '1.2' : '80'}" oninput="RDR.setDocDose(this.value)"></label>
          <label>Poids pour lecture mg/kg<input id="input-doc-weight" type="number" inputmode="numeric" value="${escapeHTML(state.docWeight)}" oninput="RDR.setDocWeight(this.value)"></label>
          <label>Sexe biologique<select onchange="RDR.setDocSex(this.value)"><option ${state.docSex === 'H' ? 'selected' : ''}>H</option><option ${state.docSex === 'F' ? 'selected' : ''}>F</option></select></label>
        </div>
        ${renderDoseHelp(sub)}
        <div class="result-card ${level.className}"><span>Niveau</span><b>${escapeHTML(level.label)}</b>${mgkg ? `<em>${mgkg} mg/kg</em>` : ''}</div>
        ${alerts.map(a => `<div class="alert ${a.type}">${escapeHTML(a.text)}</div>`).join('')}
      </article>
      <article class="card-xl"><h2>Timeline explicite de ce qui peut se passer</h2>${renderTimeline(sub.id)}${renderTimelineDetails(sub.id)}</article>
      <article class="card-xl"><h2>Recouvrement de prises</h2><p>${escapeHTML(sub.recovery.noOverlap)}</p><p>${escapeHTML(sub.recovery.between)}</p></article>

  }

  function renderDoseHelp(sub) {
    const map = {
      mdma: "Pour peser en mg, il faut une balance précise au mg — pas au centigramme. Un comprimé peut contenir des quantités très différentes selon sa provenance ; le visuel ne suffit pas. Sans balance ou analyse, sélectionne dose inconnue.",
      lsd: "Un buvard peut contenir des quantités variables et ce n’est jamais certifié sans analyse. Pour diviser une dose avec moins d’erreur que la découpe au ciseau, les sources RdR parlent souvent de dilution volumétrique : une dose dans un volume connu, puis fraction du liquide. Conserver au frais, à l’abri de la lumière, et rester prudent sur la durée de conservation.",
      champignons: "Toujours distinguer grammes secs et frais : le frais contient beaucoup d’eau. Broyer un lot sec en poudre homogène avant de peser peut réduire la variabilité entre morceaux, mais ne remplace pas une analyse. Chapeaux et pieds peuvent avoir des concentrations différentes.",
      ketamine: "La kétamine se présente souvent en poudre ou cristaux. Une balance au mg est nécessaire pour parler de quantité ; une ligne visuelle peut varier énormément selon les habitudes et le produit. Sans balance, sélectionne dose inconnue.",
      twocb: "Le 2C‑B est très sensible au milligramme. Une balance au centigramme peut avoir une erreur assez grande pour faire passer d’un niveau léger à fort. Une balance précise au mg est indispensable pour une estimation crédible.",

    return `<div class="dose-help"><h3>Comment lire cette dose ?</h3><p>${escapeHTML(map[sub.id] || 'La dose indiquée reste une estimation : sans analyse, la composition et la concentration exactes restent incertaines.')}</p></div>`;

  function timelineClock(baseMinutes, offset) {
    const total = (baseMinutes + Math.round(offset)) % (24 * 60);
    const h = Math.floor(total / 60), m = total % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  function renderTimeline(subKey, elapsed = null, startedAt = null) {
    const phases = phaseBoundaries(subKey);
    const total = phases[3].end;
    const marker = elapsed == null ? null : Math.min(100, Math.max(0, (elapsed / total) * 100));
    const startDate = startedAt ? new Date(startedAt) : null;
    const labelFor = (p) => {
      if (startDate) {
        const a = new Date(startDate.getTime() + p.start * 60000);
        const b = new Date(startDate.getTime() + p.end * 60000);
        return `${p.label} ${a.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} → ${b.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
      }
      return `${p.label} T+${fmtDuration(p.start)} → T+${fmtDuration(p.end)}`;
    };
    return `<div class="timeline-wrap">
      <div class="timeline-bar">
        ${phases.slice(0,4).map(p => `<div class="seg ${p.key}" style="width:${Math.max(8, ((p.end - p.start) / total) * 100)}%"><span>${escapeHTML(p.label)}</span></div>`).join('')}
        ${marker == null ? '' : `<span class="now-marker" style="left:${marker}%" aria-hidden="true"></span>`}
      </div>
      <div class="timeline-legend">${phases.slice(0,4).map(p => `<span>${escapeHTML(labelFor(p))}</span>`).join('')}</div>
      ${elapsed == null ? '<p class="compact-note">Ces durées sont indicatives. La variabilité individuelle est forte : dose réelle, voie, repas, fatigue, contexte et tolérance peuvent déplacer la timeline. La zone de rémanence signifie que le système nerveux peut rester sensible même après le pic.</p>' : ''}
    </div>`;
  }

  function renderTimelineDetails(subKey) {
    const sub = substances[subKey];
    const phases = [
      ['debut', 'Début', sub.durations.onset], ['montee', 'Montée', sub.durations.comeup], ['plateau', 'Plateau', sub.durations.plateau], ['descente', 'Descente', sub.durations.comedown], ['apres', 'Rémanence', sub.durations.after]
    ];
    return `<div class="phase-cards">${phases.map(([key, label, range]) => `<div class="phase-card"><span>${label} • ${fmtRange(range)}</span><p>${escapeHTML(sub.phases[key] || '')}</p></div>`).join('')}</div>`;
  }

      { n: 1, title: `${labelOf(a)} seul`, text: substanceInteractionMechanism(a) },
      { n: 2, title: `${labelOf(b)} seul`, text: substanceInteractionMechanism(b) },
      { n: 3, title: 'Point de collision', text: inter.why },
      { n: 4, title: 'Signal corps', text: interactionBodySignal(inter.risk) },
      { n: 5, title: 'Décision friendly', text: inter.action }
    ];
    return `<div class="mini-video">${renderInteractionSvg(a, b, inter)}<div class="mini-video-rail">${steps.map(s => `<div><i>${s.n}</i><b>${escapeHTML(s.title)}</b><p>${escapeHTML(s.text)}</p></div>`).join('')}</div></div>`;
  }

  function renderInteractionSvg(a, b, inter) {
    const meta = riskMeta[inter.risk] || riskMeta.unknown;
    const left = escapeHTML(labelOf(a));
    const right = escapeHTML(labelOf(b));
    return `<svg class="interaction-svg ${meta.className}" viewBox="0 0 420 210" role="img" aria-label="Animation d'interaction ${left} et ${right}">
      <defs>
        <filter id="mixGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="mixGrad" x1="0" x2="1"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
      </defs>
      <path class="mix-line" d="M92 104 C150 42 270 42 328 104"/>
      <path class="mix-line ghost" d="M92 104 C150 168 270 168 328 104"/>
      <circle class="mix-orb a" cx="92" cy="104" r="36"/>
      <circle class="mix-orb b" cx="328" cy="104" r="36"/>
      <circle class="mix-core" cx="210" cy="104" r="45"/>
      <circle class="mix-pulse" cx="210" cy="104" r="58"/>
      <text x="92" y="104" text-anchor="middle" dominant-baseline="central">${left}</text>
      <text x="328" y="104" text-anchor="middle" dominant-baseline="central">${right}</text>
      <text class="mix-code" x="210" y="100" text-anchor="middle" dominant-baseline="central">${meta.code}</text>
      <text class="mix-caption" x="210" y="178" text-anchor="middle">${escapeHTML(meta.label)}</text>
    </svg>`;
  }

  function substanceInteractionMechanism(k) {
    if (k === 'mdma') return 'Pousse sérotonine + stimulation ; cœur et température peuvent monter.';
    if (k === 'ketamine') return 'Dissociatif/sédatif ; coordination, mémoire et respiration deviennent des points clés.';
    if (['lsd', 'champignons', 'dmt', 'mescaline', 'twocb'].includes(k)) return 'Psychédélique : perception, émotions et suggestibilité dépendent fortement du contexte.';
    if (k === 'alcool') return 'Dépresseur : jugement, coordination et déshydratation peuvent se dégrader.';
    if (k === 'cannabis') return 'Peut amplifier sensations, anxiété, confusion ou détente selon personne.';
    if (['cocaine', 'amphetamine', 'cafeine'].includes(k)) return 'Stimulant : cœur, tension, chaleur, anxiété et sommeil sont concernés.';
    if (['ghb', 'benzos', 'opiaces'].includes(k)) return 'Dépresseur/sédatif : conscience et respiration sont les signaux critiques.';
    if (['isrs', 'imao', 'tramadol', 'lithium'].includes(k)) return 'Médicament/traitement : interactions neurochimiques parfois majeures ; ne jamais modifier seul un traitement.';
    return 'Mécanisme non détaillé dans cette version.';
  }

  function interactionBodySignal(risk) {
    if (risk === 'fatal') return 'Signaux rouges : inconscience, respiration lente, convulsion, forte température, confusion sévère, douleur thoracique.';
    if (risk === 'risky') return 'Signaux : cœur très rapide, douleur thoracique, panique, surchauffe, agitation, vomissements.';
    if (risk === 'caution') return 'Signaux : anxiété, confusion, température, envie de reprendre, effets masqués ou amplifiés.';
    return 'Même sans signal majeur, le contexte peut changer la trajectoire.';
  }

  function recoverySpecific(sub) {
    if (sub.id === 'mdma') return {
      first: 'Premières heures : la rémanence peut durer 12 à 48h. Même si le plaisir baisse, le cœur, la température, le foie et le sommeil peuvent rester sollicités. Évite conduite, alcool, stimulants et redosage.',
      next: 'Le lendemain : fatigue, humeur basse, appétit irrégulier ou sommeil léger peuvent venir du stock de sérotonine en reconstruction. Sommeil, repas nourrissants, calme et hydratation normale aident plus qu’une nouvelle stimulation.',
      days: 'Jours suivants : surveille humeur, irritabilité, motivation, envie de reprendre pour corriger la descente, troubles du sommeil. Le suivi signale la fréquence sur 30 jours et la prudence renforcée si une session MDMA revient dans les 4 semaines.'
    };
    if (sub.id === 'lsd') return {
      first: 'Premières heures : la durée est longue. Même quand le pic baisse, la rémanence peut garder l’esprit sensible à la lumière, aux sons, aux émotions et aux boucles de pensée. Pas de conduite ni décision importante.',
      next: 'Le lendemain : le sommeil peut être décalé ou chargé de rêves. L’intégration commence souvent quand le cerveau revient au calme : écrire, parler à une personne de confiance ou se reposer peut aider.',
      days: 'Jours suivants : si une peur, une déréalisation ou une anxiété persiste, ne reste pas seul avec ça. Les expériences fortes peuvent prendre du temps à être digérées psychologiquement.'
    };
    if (sub.id === 'champignons') return {
      first: 'Premières heures : la descente peut ramener faim, fatigue et besoin de calme. Les émotions peuvent encore bouger même si les effets visuels baissent.',
      next: 'Le lendemain : l’intégration peut être émotionnelle, symbolique ou simplement corporelle. Du repos et un environnement simple évitent de transformer la fatigue en anxiété.',
      days: 'Jours suivants : surveille sommeil, humeur, pensées répétitives ou besoin de reparler de l’expérience. La variabilité des champignons rend l’historique utile mais jamais parfaitement prédictif.'
    };
    if (sub.id === 'ketamine') return {
      first: 'Premières heures : coordination, mémoire, équilibre et perception de la douleur peuvent rester altérés. Évite déplacements, escaliers, eau, conduite et mélanges sédatifs.',
      next: 'Le lendemain : surveille fatigue, confusion résiduelle et surtout les signaux urinaires : brûlure, douleurs, envie fréquente, sang ou difficulté à uriner.',
      days: 'Jours suivants : la répétition augmente le risque vésical. Des symptômes urinaires persistants ou qui reviennent méritent un avis médical, pas une simple attente.'
    };
    return {
      first: `Premières heures : ${sub.phases.apres || ''} Rémanence indicative : ${fmtRange(sub.durations.after)}. Évite conduite, alcool, reprise et décisions importantes.`,
      next: 'Le lendemain : sommeil, alimentation simple, calme et retour progressif au niveau de base sont prioritaires.',
      days: 'Jours suivants : surveille humeur, sommeil, motivation, anxiété, douleurs ou symptômes inhabituels. En cas de doute, demander de l’aide.'
    };
  }

  function renderRecovery(sub) {
    const sessions = state.sessions.filter(s => s.substance === sub.id).sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    const r = recoverySpecific(sub);
    return `<div class="stack">
      ${renderAICard(buildDocAI(sub.id), 'Boussole personnelle')}
      <article class="card-xl"><h2>Dans les premières heures</h2><p>${wrapGlossaire(r.first)}</p><p>${wrapGlossaire(sub.recovery.noOverlap)}</p></article>
      <article class="card-xl"><h2>Le lendemain</h2><p>${wrapGlossaire(r.next)}</p><p>${wrapGlossaire(sub.phases.apres)}</p></article>
      <article class="card-xl"><h2>Les jours suivants</h2><p>${wrapGlossaire(r.days)}</p><p>${wrapGlossaire(sub.recovery.between)}</p></article>
      ${sessions.length > 0 ? `<article class="card-xl"><h2>Historique ${escapeHTML(sub.short)} sur ce téléphone</h2>${sessions.slice(0,5).map(s => renderHistoryMini(s)).join('')}</article>` : ''}
    </div>`;
  }

  function renderAICard(lines, title = 'Boussole') {
    return `<div class="ai-card compass-card assistant-trigger" role="button" tabindex="0" onclick="RDR.openGuide()" onkeydown="if(event.key==='Enter'||event.key===' '){RDR.openGuide()}"><div class="compass-icon">↗</div><div><h3>${escapeHTML(title)}</h3>${lines.map(l => `<p>${escapeHTML(l)}</p>`).join('')}</div></div>`;
  }

  function renderSession() {
    return state.active ? renderActiveSession(state.active) : renderSessionOnboarding();
  }

  function renderSessionOnboarding() {
    const f = state.form;
    const sub = substances[f.substance];
    const known = f.knownDose === 'yes' && !/non quantifiable|doigt|clé|visuelle/i.test(f.mode);
    const topupTotal = f.topupKnown === 'yes' ? (Number(f.topupCount) || 0) * (Number(String(f.topupDose).replace(',', '.')) || 0) : 0;
    const alerts = computeDoseAlerts(f.substance, f.dose, f.weight, f.sex, known, topupTotal);
    const dummy = { substance: f.substance, dose: Number(f.dose)||0, knownDose: known, startedAt: sessionStartDate(f.time), entries: [], metrics: [] };
    const histAlerts = scanHistoryForSession(dummy);
    return `<section>
      <div class="section-title"><h1>Session</h1><p>Un écran = une décision : est-ce que je peux suivre ça proprement ?</p></div>
      <article class="card-xl quick-start-card">
        <h2>Démarrage rapide</h2>
        <p class="muted">Substance sélectionnée : <b>${escapeHTML(sub.name)}</b></p>
        <button class="primary-btn full" onclick="RDR.quickStart()">▶ Démarrer maintenant</button>
        <p class="compact-note" style="text-align:center;margin-top:8px">ou <span style="color:var(--info);cursor:pointer;" onclick="document.getElementById('session-form-full')?.scrollIntoView({behavior:'smooth'})">complète le formulaire complet</span> pour un suivi précis</p>
      </article>
      <article class="card-xl session-form" id="session-form-full">
        <h2>Formulaire complet</h2>
        <div class="form-grid">
          <label>Substance<select onchange="RDR.form('substance', this.value)">${Object.values(substances).map(s => `<option value="${s.id}" ${f.substance === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
          <label>Voie<select onchange="RDR.form('route', this.value)">${sub.routes.map(r => `<option ${f.route === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
          <label>Mode de prise<select class="${f.mode !== sub.sessionModes[0] ? 'has-selection' : ''}" onchange="RDR.form('mode', this.value)">${sub.sessionModes.map(m => `<option ${f.mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
          <label>Heure de prise<input type="time" value="${escapeHTML(f.time)}" onchange="RDR.form('time', this.value)"></label>
          <label>Poids kg<input id="input-session-weight" type="number" inputmode="numeric" value="${escapeHTML(f.weight)}" oninput="RDR.form('weight', this.value)"></label>
          <label>Sexe biologique<select onchange="RDR.form('sex', this.value)"><option ${f.sex === 'H' ? 'selected' : ''}>H</option><option ${f.sex === 'F' ? 'selected' : ''}>F</option></select></label>
          ${f.substance === 'mdma' ? '<p class="compact-note">Utilisé uniquement pour calculer le seuil mg/kg MDMA (1,3 pour F, 1,5 pour H). Sans effet sur les autres substances.</p>' : ''}
          <label>Dose connue ?<select onchange="RDR.form('knownDose', this.value)"><option value="yes" ${f.knownDose === 'yes' ? 'selected' : ''}>Oui, pesée/connue</option><option value="no" ${f.knownDose === 'no' ? 'selected' : ''}>Non / visuelle</option></select></label>
          <label>Dose initiale (${sub.unit})<input id="input-session-dose" type="number" inputmode="decimal" value="${escapeHTML(f.dose)}" placeholder="laisser vide si inconnue" oninput="RDR.form('dose', this.value)"></label>
        </div>
        ${renderDoseHelp(sub)}
        <div class="friendly-warning"><b>Doigt, clé, ligne visuelle</b><p>Tu peux le noter dans l’historique, mais l’app ne convertit pas en mg. C’est volontaire : ce n’est pas fiable.</p></div>
      </article>
      <article class="card-xl">
        <h2>Top-up / reprise</h2>
        <p class="muted">Ici on documente une reprise déjà faite ou envisagée pour calculer le risque total. L’app ne pousse pas à reprendre.</p>
        <div class="form-grid two-cols">
          <label>Nombre<input id="input-session-topup-count" type="number" min="0" max="5" value="${escapeHTML(f.topupCount)}" oninput="RDR.form('topupCount', this.value)"></label>
          <label>Dose par reprise (${sub.unit})<input id="input-session-topup-dose" type="number" inputmode="decimal" value="${escapeHTML(f.topupDose)}" oninput="RDR.form('topupDose', this.value)"></label>
          <label>Connue ?<select onchange="RDR.form('topupKnown', this.value)"><option value="yes" ${f.topupKnown === 'yes' ? 'selected' : ''}>Oui</option><option value="no" ${f.topupKnown === 'no' ? 'selected' : ''}>Non</option></select></label>
          <label>Délai entre reprises (min)<input id="input-session-topup-delay" type="number" inputmode="numeric" min="30" max="480" value="${escapeHTML(f.topupDelay)}" oninput="RDR.form('topupDelay', this.value)"></label>
        </div>
        <div class="alert warn">${escapeHTML(sub.recovery.noOverlap)}</div>
      </article>
      <article class="card-xl"><h2>Mélanges / médicaments déclarés</h2><div class="chip-grid">${coUseOptions.map(([k, label]) => `<button class="toggle-chip ${f.coUse.includes(k) ? 'active' : ''}" onclick="RDR.toggleFormArray('coUse','${k}')">${label}</button>`).join('')}</div></article>
      <article class="card-xl"><h2>Contexte</h2><div class="chip-grid">${contextTags.map(([k, label]) => `<button class="toggle-chip ${f.contexts.includes(k) ? 'active' : ''}" onclick="RDR.toggleFormArray('contexts','${k}')">${label}</button>`).join('')}</div><label>Notes<textarea id="input-session-notes" rows="3" oninput="RDR.form('notes', this.value)" placeholder="mood, sommeil, produit analysé, amis...">${escapeHTML(f.notes)}</textarea></label></article>
      <article class="card-xl">
        <h2>Pré-analyse locale</h2>
        ${renderTimeline(f.substance)}
        ${alerts.concat(histAlerts).map(a => `<div class="alert ${a.type}">${escapeHTML(a.text)}</div>`).join('') || '<div class="alert safe">Pas de signal rouge calculé avec les infos déclarées. Ça ne veut pas dire risque zéro.</div>'}
        ${f.coUse.map(k => renderInteractionResult(f.substance, k)).join('')}
        <button class="primary-btn full" onclick="RDR.startSession()">Démarrer le suivi</button>
      </article>
    </section>`;
  }

  function renderActiveSession(session) {
    const sub = substances[session.substance];
    if (!sub) return `<section><article class="card-xl"><h1>Session archivée incompatible v8</h1><p class="muted">Cette session concerne ${escapeHTML(labelOf(session.substance))}, une substance retirée de l’interface v8. Termine et archive ou efface-la depuis l’historique si besoin.</p><button class="danger-btn full" onclick="RDR.endSession()">Terminer et archiver</button></article></section>`;
    const elapsed = Math.max(0, (Date.now() - new Date(session.startedAt).getTime()) / 60000);
    const phase = currentPhase(session.substance, elapsed);
    const doseInfo = totalKnownDose(session);
    const level = classifyDose(session.substance, doseInfo.total || session.dose, doseInfo.known);
    const alerts = computeDoseAlerts(session.substance, doseInfo.total || session.dose, session.weight, session.sex, doseInfo.known, 0).concat(scanHistoryForSession(session));
    const latest = [...(session.metrics || [])].pop() || {};
    return `<section>
      <div class="live-hero ${sub.color}">
        <div><span class="eyebrow">Session active</span><h1>${escapeHTML(sub.short)} • ${escapeHTML(phase.label)}</h1><p><span id="elapsed-timer">${formatElapsed(elapsed)}</span> depuis T0</p></div>
        <span class="live-dot"></span>
      </div>
      <button class="danger-btn full sos-inline" onclick="RDR.openSOS()">🆘 SOS — Urgence / Crise</button>
      <article class="card-xl">
        <div class="card-head"><h2>Où j’en suis ?</h2><span class="badge ${level.className}">${escapeHTML(level.label)}</span></div>
        ${renderTimeline(session.substance, elapsed, new Date(session.startedAt))}
        ${renderAICard(buildSessionAI(session), 'Boussole')}
      </article>
      ${alerts.map(a => `<div class="alert ${a.type}">${escapeHTML(a.text)}</div>`).join('')}
      <article class="card-xl metrics">
        <h2>Corps en direct</h2>
        <div class="metric-grid">
          ${renderMetric('FC', latest.hr ? `${latest.hr} bpm` : '—', '60–100 repos', metricState('hr', latest.hr))}
          ${renderMetric('Temp', latest.temp ? `${latest.temp} °C` : '—', '<37,8 vigilance', metricState('temp', latest.temp))}
          ${renderMetric('Eau', latest.water ? `${latest.water} ml` : '—', 'rythme normal, pas trop', 'info')}
        </div>
        <div class="form-grid three-cols">
          <label>BPM<input id="metric-hr" type="number" inputmode="numeric" value="${escapeHTML(state.metricDraft.hr)}" oninput="RDR.metricDraft('hr', this.value)"></label>
          <label>°C<input id="metric-temp" type="number" inputmode="decimal" step="0.1" value="${escapeHTML(state.metricDraft.temp)}" oninput="RDR.metricDraft('temp', this.value)"></label>
          <label>Eau ml<input id="metric-water" type="number" inputmode="numeric" value="${escapeHTML(state.metricDraft.water)}" oninput="RDR.metricDraft('water', this.value)"></label>
        </div>
        ${state.metricSaved ? '<div class="alert safe" style="text-align:center;font-weight:900;">✓ Métriques enregistrées</div>' : ''}
        <button class="ghost-btn full" onclick="RDR.recordMetric()">Enregistrer ces métriques</button>
      </article>
      <article class="card-xl"><h2>Prises déclarées</h2>${renderEntries(session)}${renderTopupLogger(sub)}</article>
      <article class="card-xl">
        <h2>Phase actuelle : ${escapeHTML(phaseLabel(phase.key))}</h2>
        <div class="phase-card active" style="margin:0;"><span>${escapeHTML(phaseLabel(phase.key))}</span><p>${escapeHTML(sub.phases[phase.key] || '')}</p></div>
        <details style="margin-top:10px;"><summary class="details-summary">📋 Toutes les phases</summary><div class="phase-cards" style="margin-top:8px;">${Object.entries(sub.phases).map(([k, t]) => `<div class="phase-card ${k === phase.key ? 'active' : ''}"><span>${phaseLabel(k)}</span><p>${escapeHTML(t)}</p></div>`).join('')}</div></details>
      </article>
      <button class="danger-btn full" onclick="RDR.endSession()">Terminer et archiver</button>
    </section>`;
  }

  function renderMetric(label, value, ref, stateName) {
    const isEmpty = value === '—';
    return `<div class="metric-card ${stateName}" ${isEmpty ? 'title="Saisis une valeur ci-dessous pour activer le suivi"' : ''}><span>${escapeHTML(label)}</span><b style="${isEmpty ? 'opacity:.45' : ''}">${escapeHTML(value)}</b><small>${isEmpty ? 'à saisir' : escapeHTML(ref)}</small></div>`;
  }

  function metricState(kind, value) {
    const v = Number(value);
    if (!v) return 'neutral';
    if (kind === 'hr') return v >= 130 ? 'critical' : v >= 110 ? 'warn' : 'safe';
    if (kind === 'temp') return v >= 38.5 ? 'critical' : v >= 37.8 ? 'warn' : 'safe';
    return 'info';
  }

  function renderEntries(session) {
    const sub = substances[session.substance];
    const entries = [{ kind: 'initial', at: session.startedAt, amount: session.dose, known: session.knownDose, mode: session.mode }].concat(session.entries || []);
    return `<div class="entry-list">${entries.map(e => `<div class="entry"><b>${e.kind === 'initial' ? 'Initiale' : 'Reprise déclarée'}</b><span>${e.known ? `${escapeHTML(e.amount)} ${sub.unit}` : 'dose inconnue'} • ${escapeHTML(e.mode || '')}</span><small>${new Date(e.at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</small></div>`).join('')}</div>`;
  }

  function renderTopupLogger(sub) {
    return `<div class="topup-logger"><h3>Déclarer une reprise déjà faite</h3><div class="form-grid three-cols"><label>Connue ?<select onchange="RDR.topupDraft('known', this.value)"><option value="yes" ${state.topupDraft.known === 'yes' ? 'selected' : ''}>Oui</option><option value="no" ${state.topupDraft.known === 'no' ? 'selected' : ''}>Non</option></select></label><label>Quantité ${sub.unit}<input id="topup-amount" type="number" inputmode="decimal" value="${escapeHTML(state.topupDraft.amount)}" oninput="RDR.topupDraft('amount', this.value)"></label><label>Il y a min<input id="topup-minutes" type="number" inputmode="numeric" value="${escapeHTML(state.topupDraft.minutesAgo)}" oninput="RDR.topupDraft('minutesAgo', this.value)"></label></div><label>Note<textarea id="topup-note" rows="2" oninput="RDR.topupDraft('note', this.value)">${escapeHTML(state.topupDraft.note)}</textarea></label><button class="ghost-btn full" onclick="RDR.addTopup()">Ajouter à l’historique</button></div>`;
  }

  function formatElapsed(minutes) {
    const totalSec = Math.floor(minutes * 60);
    const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function renderHistoryMini(s) {
    const sub = getSubstance(s.substance);
    const d = new Date(s.startedAt);
    const doseInfo = totalKnownDose(s);
    return `<div class="history-mini"><b>${escapeHTML(sub.short)}</b><span>${d.toLocaleDateString('fr-FR')} • ${doseInfo.known ? `${doseInfo.total || s.dose}${sub.unit}` : 'dose inconnue'}</span></div>`;
  }

  function renderHistory() {
    const sessions = [...state.sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    const overall = buildOverallHistoryAI(sessions);
    return `<section>
      <div class="section-title"><h1>Historique local</h1><p>Sur ce téléphone uniquement.</p></div>
      ${renderAICard(overall, 'Boussole')}
      <article class="card-xl"><div class="card-head"><h2>Sessions archivées</h2><button class="ghost-btn" onclick="RDR.clearHistory()">Effacer</button></div>${sessions.length ? sessions.map(renderHistoryItem).join('') : '<p class="muted">Aucune session archivée.</p>'}</article>
      <article class="card-xl privacy"><h2>Confidentialité</h2><p>Les données sont stockées dans le localStorage du navigateur de ce téléphone. Pas de compte, pas de serveur, pas de synchronisation.</p></article>
    </section>`;
  }

  function renderHistoryItem(s) {
    const sub = getSubstance(s.substance);
    const doseInfo = totalKnownDose(s);
    const alerts = scanHistoryForSession(s, state.sessions).slice(0, 2);
    return `<div class="history-item"><div><b>${escapeHTML(sub.name)}</b><span>${new Date(s.startedAt).toLocaleString('fr-FR', {dateStyle:'medium', timeStyle:'short'})}</span></div><div><span class="badge ${classifyDose(s.substance, doseInfo.total || s.dose, doseInfo.known).className}">${doseInfo.known ? `${doseInfo.total || s.dose}${sub.unit}` : 'inconnue'}</span></div>${alerts.map(a => `<p class="history-alert ${a.type}">${escapeHTML(a.text)}</p>`).join('')}<button class="small-btn" onclick="RDR.reuseSession('${s.id}')">Reprendre comme modèle</button><button class="small-btn ghost" onclick="RDR.deleteSession('${s.id}')">Supprimer</button></div>`;
  }

  function buildOverallHistoryAI(sessions) {
    if (!sessions.length) return ['Aucune donnée locale : l’app ne peut pas encore repérer les rythmes, recouvrements ou récupérations difficiles.', 'Quand tu archives une session, elle reste sur ce téléphone et nourrit uniquement cette lecture locale.'];
    const last = sessions.sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0];
    const counts = sessions.reduce((acc, s) => (acc[s.substance] = (acc[s.substance] || 0) + 1, acc), {});
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    const lines = [`${sessions.length} session(s) enregistrée(s). Substance la plus fréquente : ${getSubstance(top[0]).short} (${top[1]}).`];
    const lastDays = Math.round((Date.now() - new Date(last.startedAt).getTime()) / 864e5);
    lines.push(`Dernière session : ${getSubstance(last.substance).short}, il y a ${lastDays} j.`);
    if (sessions.filter(s => (Date.now() - new Date(s.startedAt).getTime()) / 864e5 < 30).length >= 3) lines.push('Rythme récent dense : surveiller sommeil, humeur, motivation, anxiété, tolérance et envie de “corriger” une descente par une autre prise.');
    else lines.push('Aucun motif de fréquence très dense détecté dans les 30 derniers jours.');
    return lines;
  }

  function renderGuideSheet() {
    const session = state.active;
    const lines = session ? buildSessionAI(session) : buildDocAI(state.selected);
    const urgentKeywords = ['urgence', 'critique', '112', 'pause', 'refroidir', 'appeler', 'PLS', 'température ≥', 'respiration'];
    return `<div class="modal-backdrop" onclick="RDR.closeGuide(event)"><section class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>Mon suivi — Boussole personnelle</h1><p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Outil de suivi personnel — lecture locale uniquement. Ce résumé est calculé uniquement à partir de ce que tu as déclaré. Ce n’est pas un conseil médical ni une recommandation de consommation : c’est un miroir de ta situation déclarée.</p><div class="compass-card card-xl"><div class="compass-icon">↗</div><div>${lines.map(l => { const isUrgent = urgentKeywords.some(kw => l.toLowerCase().includes(kw.toLowerCase())); const text = isUrgent ? ('Signal à surveiller : ' + l.replace(/^Signal à surveiller :\s*/,'')).trim() : l; return isUrgent ? `<p style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);border-radius:12px;padding:8px 10px;margin:6px 0;font-weight:700;">${wrapGlossaire(text)}</p>` : `<p>${wrapGlossaire(text)}</p>`; }).join('')}</div></div><button class="primary-btn full" onclick="RDR.closeGuide()">OK</button></section></div>`;
  }

  function renderSOS() {
    return `<div class="modal-backdrop" onclick="RDR.closeSOS(event)"><section class="sheet sos-sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>SOS / crise</h1><div class="call-grid"><a class="call-btn" href="tel:112">112</a><a class="call-btn" href="tel:15">15</a><a class="call-btn" href="tel:18">18</a><a class="call-btn" href="tel:0800231313">Drogues Info</a></div><ol class="sos-steps"><li><b>Conscience ? respiration ?</b><p>Si inconscient ou respiration anormale : 112. Si la personne respire, position latérale de sécurité, dégager col/ceinture.</p></li><li><b>Infos secours</b><p>Substances, dose approximative, heure, alcool, médicaments, IMAO, tramadol, lithium.</p></li><li><b>Safe space</b><p>Calme, frais, lumière douce, peu de paroles, une personne sobre.</p></li><li><b>Facilitation</b><p>Phrases simples, présence empathique, ne pas forcer. Changer le setting pour aider le set.</p></li></ol><button class="primary-btn full" onclick="RDR.closeSOS()">Fermer</button></section></div>`;
  }

  function renderInstallSheet() {
    return `<div class="modal-backdrop" onclick="RDR.closeInstall(event)"><section class="sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="sheet-handle"></div><h1>Installer / partager</h1><p>Pour qu’un ami l’ajoute à l’écran d’accueil, l’app doit être servie par une URL HTTPS. Envoyer juste un fichier HTML ouvre une page, mais ne donne pas une vraie PWA offline installable.</p><div class="install-steps"><div><b>1</b><span>Dépose le dossier ou le ZIP sur Netlify Drop, Vercel ou GitHub Pages.</span></div><div><b>2</b><span>Partage l’URL HTTPS générée.</span></div><div><b>3</b><span>iPhone : Safari → Partager → Ajouter à l’écran d’accueil. Android : bouton Installer ou menu navigateur.</span></div></div>${deferredPrompt ? '<button class="primary-btn full" onclick="RDR.installPWA()">Installer maintenant</button>' : '<button class="ghost-btn full" onclick="RDR.copyInstallText()">Copier le message pour amis</button>'}<button class="small-btn full" onclick="RDR.closeInstall()">Fermer</button></section></div>`;
  }

  function renderDisclaimer() {
    const step = state.onboardingStep || 1;
    const slides = [
      { title: 'TripSafe RdR', body: "Cette app explique ce qui se passe dans le corps et le cerveau avant, pendant et après une expérience. Elle aide à prendre de meilleures décisions — elle n'encourage pas la consommation et ne rend jamais une prise sûre.", cta: 'Suivant →' },
      { title: 'Tout reste sur ton téléphone', body: "Aucune donnée n'est envoyée nulle part. L'historique, les doses déclarées et les métriques vivent uniquement dans le localStorage de ce téléphone. Pas de compte, pas de serveur.", cta: 'Suivant →' },
      { title: 'SOS toujours accessible', body: "Le bouton SOS rouge est visible depuis n'importe quel écran. En cas de crise : 112, 15 ou 18. Le risque zéro n'existe pas.", cta: 'Commencer' }
    ];
    const s = slides[step - 1] || slides[0];
    const isLast = step === 3;
    return `<div class="modal-backdrop hard"><section class="sheet disclaimer" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="disclaimer-dots">${[1,2,3].map(i => `<span class="${i === step ? 'active' : ''}"></span>`).join('')}</div><h1>${escapeHTML(s.title)}</h1><p style="color:var(--muted);line-height:1.6;margin:12px 0 20px;">${escapeHTML(s.body)}</p><button class="primary-btn full" onclick="${isLast ? 'RDR.acceptDisclaimer()' : 'RDR.nextOnboarding()'}">${escapeHTML(s.cta)}</button></section></div>`;
  }

  function metricAlert(metric) {
    const alerts = [];
    const hr = Number(metric.hr), temp = Number(metric.temp);
    if (hr >= 130) alerts.push('FC critique déclarée');
    if (temp >= 38.5) alerts.push('Température critique déclarée');
    return alerts;
  }

  const RDR = {
    render,
    go(view) {
      state.view = view;
      state.installOpen = false;
      state.matrixTooltip = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (view === 'interactions') {
        requestAnimationFrame(() => document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    },
    selectSubstance(id, tab = 'overview') { state.selected = id; state.docTab = tab || state.docTab; state.videoIndex = 0; state.matrixTooltip = null; state.view = 'doc'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    setDocTab(tab) { state.docTab = tab; state.videoIndex = 0; render(); },
    setVideo(i) {
      state.videoIndex = Number(i) || 0;
      render();
      requestAnimationFrame(() => document.querySelector('.chapter.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }));
    },
    toggleVideoAuto() { if (videoTimer) { clearInterval(videoTimer); videoTimer = null; render(); return; } const sub = substances[state.selected]; videoTimer = setInterval(() => { state.videoIndex = (state.videoIndex + 1) % sub.video.length; render(); requestAnimationFrame(() => document.querySelector('.chapter.active')?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' })); }, 3200); render(); },
    setDocDose(v) { state.docDose = v; scheduleRender(); },
    setDocWeight(v) { state.docWeight = v; scheduleRender(); },
    setDocSex(v) { state.docSex = v; render(); },
    matrixTap(a, b, event) {
      if (event) {
        event.preventDefault?.();
        event.stopPropagation?.();
      }
      const sameCell = state.matrixTooltip && state.matrixTooltip.a === a && state.matrixTooltip.b === b;
      if (sameCell) {
        state.matrixTooltip = null;
        state.interactionA = a;
        state.interactionB = b;
        RDR.go('interactions');
        requestAnimationFrame(() => {
          document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      } else {
        state.matrixTooltip = { a, b };
        render();
        requestAnimationFrame(() => {
          const box = document.querySelector('.matrix-tooltip-box');
          const details = document.querySelector('.matrix-details[open]');
          (box || details)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }
    },
    setInteractionA(v) {
      state.interactionA = v;
      state.matrixTooltip = null;
      render();
      requestAnimationFrame(() => {
        document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    },
    setInteractionB(v) {
      state.interactionB = v;
      state.matrixTooltip = null;
      render();
      requestAnimationFrame(() => {
        document.querySelector('.interaction-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    },
    toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem(STORAGE.theme, state.theme); render(); },
    toggleExpert() {
      state.expert = !state.expert;
      localStorage.setItem(STORAGE.expert, state.expert ? 'yes' : 'no');
      RDR.toast(state.expert ? t('expertOn') : t('expertOff'));
      render();
    },
    setExpert(v) {
      state.expert = !!v;
      localStorage.setItem(STORAGE.expert, state.expert ? 'yes' : 'no');
      RDR.toast(state.expert ? t('expertOn') : t('expertOff'));
      render();
    },
    openSOS() { state.sosOpen = true; render(); },
    closeSOS(e) { if (!e || e.target.classList.contains('modal-backdrop')) { state.sosOpen = false; render(); } },
    openInstall() { state.installOpen = true; render(); },
    closeInstall(e) { if (!e || e.target.classList.contains('modal-backdrop')) { state.installOpen = false; render(); } },
    openGuide() { state.guideOpen = true; render(); },
    closeGuide(e) { if (!e || e.target.classList.contains('modal-backdrop')) { state.guideOpen = false; render(); } },
    openHeartDetail(i) { state.heartDetailOpen = Number(i); render(); },
    closeHeartDetail(e) { if (!e || e.target.classList.contains('modal-backdrop')) { state.heartDetailOpen = null; state.metricSaved = false; render(); } },
    nextOnboarding() { state.onboardingStep = Math.min(3, (state.onboardingStep || 1) + 1); render(); },
    acceptDisclaimer() { localStorage.setItem(STORAGE.disclaimer, 'yes'); state.disclaimerOpen = false; state.onboardingStep = 1; render(); },
    form(key, value) { state.form[key] = value; if (key === 'substance') { const sub = substances[value]; state.form.route = sub.routeDefault; state.form.mode = sub.sessionModes[0]; render(); return; } if (['dose','weight','topupDose','topupCount','topupDelay','notes'].includes(key)) scheduleRender(); else render(); },
    toggleFormArray(key, value) { const arr = state.form[key] || []; state.form[key] = arr.includes(value) ? arr.filter(x => x !== value) : arr.concat(value); render(); },
    quickStart() { state.form.knownDose = 'no'; state.form.dose = ''; state.form.topupCount = '0'; state.form.topupDose = ''; state.form.time = nowTime(); this.startSession(); },
    startSession() {
      const f = state.form; const sub = substances[f.substance];
      const known = f.knownDose === 'yes' && !/non quantifiable|doigt|clé|visuelle/i.test(f.mode);
      const startedAt = sessionStartDate(f.time);
      const entries = [];
      const count = Math.max(0, Math.min(5, Number(f.topupCount) || 0));
      for (let i = 0; i < count; i++) {
        const at = new Date(new Date(startedAt).getTime() + (Number(f.topupDelay) || 120) * 60000 * (i + 1)).toISOString();
        entries.push({ kind: 'topup', at, amount: f.topupDose || '', known: f.topupKnown === 'yes', mode: 'Top-up documenté' });
      }
      const session = { id: (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()), createdAt: new Date().toISOString(), startedAt, substance: f.substance, route: f.route || sub.routeDefault, mode: f.mode, weight: f.weight, sex: f.sex, dose: f.dose || '', knownDose: known, entries, coUse: f.coUse, contexts: f.contexts, notes: f.notes, metrics: [], alerts: [] };
      state.active = session; writeJSON(STORAGE.active, session); state.view = 'session'; render();
    },
    metricDraft(k, v) { state.metricDraft[k] = v; scheduleRender(); },
    recordMetric() { if (!state.active) return; const metric = { at: new Date().toISOString(), elapsedMin: Math.round((Date.now() - new Date(state.active.startedAt).getTime()) / 60000), hr: state.metricDraft.hr, temp: state.metricDraft.temp, water: state.metricDraft.water }; metric.alerts = metricAlert(metric); state.active.metrics = (state.active.metrics || []).concat(metric); state.metricDraft = { hr: '', temp: '', water: '' }; state.metricSaved = true; writeJSON(STORAGE.active, state.active); render(); setTimeout(() => { state.metricSaved = false; render(); }, 2000); },
    topupDraft(k, v) { state.topupDraft[k] = v; if (['amount','minutesAgo','note'].includes(k)) scheduleRender(); else render(); },
    addTopup() { if (!state.active) return; const minutesAgo = Number(state.topupDraft.minutesAgo) || 0; const at = new Date(Date.now() - minutesAgo * 60000).toISOString(); state.active.entries = (state.active.entries || []).concat({ kind: 'topup', at, amount: state.topupDraft.amount, known: state.topupDraft.known === 'yes', mode: state.topupDraft.note || 'Reprise déclarée après coup' }); state.topupDraft = { amount: '', note: '', mode: 'Déclarée après coup', minutesAgo: '0', known: 'yes' }; writeJSON(STORAGE.active, state.active); render(); },
    endSession() { if (!state.active) return; const archived = { ...state.active, endedAt: new Date().toISOString() }; state.sessions = state.sessions.concat(archived); writeJSON(STORAGE.sessions, state.sessions); state.active = null; localStorage.removeItem(STORAGE.active); state.view = 'history'; render(); },
    clearHistory() { if (confirm('Effacer tout l’historique local ?')) { state.sessions = []; writeJSON(STORAGE.sessions, []); render(); } },
    deleteSession(id) { state.sessions = state.sessions.filter(s => s.id !== id); writeJSON(STORAGE.sessions, state.sessions); render(); },
    reuseSession(id) { const s = state.sessions.find(x => x.id === id); if (!s) return; state.form = { ...defaultForm(), substance: s.substance, route: s.route, mode: s.mode, weight: s.weight, sex: s.sex, dose: s.dose, knownDose: s.knownDose ? 'yes' : 'no', coUse: s.coUse || [], contexts: s.contexts || [] }; state.view = 'session'; render(); },
    clearMatrixTooltip() { state.matrixTooltip = null; render(); },
    onMatrixScroll() {
      const c = document.getElementById('matrix-container');
      const btn = document.getElementById('matrix-top-btn');
      if (c && btn) btn.style.display = (c.scrollTop > 80 || c.scrollLeft > 80) ? 'block' : 'none';
    },
    toggleLang() {
      state.lang = state.lang === 'fr' ? 'en' : 'fr';
      localStorage.setItem(STORAGE.lang, state.lang);
      render();
    },
    toast(message) {
      state.toast = message;
      clearTimeout(RDR._toastTimer);
      RDR._toastTimer = setTimeout(() => { state.toast = null; render(); }, 2200);
    },
    async installPWA() { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(()=>{}); deferredPrompt = null; state.installOpen = false; render(); },
    copyInstallText() { const text = 'Ouvre ce lien dans Safari/Chrome puis choisis “Ajouter à l’écran d’accueil”. L’app garde ton historique sur ton téléphone uniquement.'; navigator.clipboard?.writeText(text); alert('Message copié.'); }
  };

  window.RDR = RDR;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    render();
  });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
  }

  setInterval(() => {
    if (state.view === 'session' && state.active) {
      const timerEl = document.getElementById('elapsed-timer');
      if (timerEl) {
        const elapsed = Math.max(0, (Date.now() - new Date(state.active.startedAt).getTime()) / 60000);
        timerEl.textContent = formatElapsed(elapsed);
      }
    }
  }, 1000);
  document.addEventListener('click', (e) => {
    const gloss = e.target.closest && e.target.closest('.gloss');
    if (gloss) {
      e.preventDefault();
      e.stopPropagation();
      state.glossTooltip = { text: gloss.getAttribute('data-def') || gloss.getAttribute('title') || '' };
      render();
      return;
    }
    if (state.glossTooltip && !(e.target.closest && e.target.closest('.gloss-tooltip-box'))) {
      state.glossTooltip = null;
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
